    ${staleDate ? `<p class="left-time stale" role="status">받은 링크의 날짜(${dateLabel(staleDate)})가 지났어요. 날짜를 다시 골라 주세요.</p>` : ""}
    <p class="sub">시간과 예산은 미리 골라 뒀어요.</p>
    ${lateNote ? `<p class="left-time" id="lateNote" role="status">오늘은 남은 시간이 짧아서 내일로 골라 뒀어요. 오늘 저녁 짧은 코스를 원하면 "오늘"을 눌러 주세요.</p>` : ""}
    <div class="group"><h2 id="g-when">언제 가요?</h2><div class="chips" style="--cols:3" role="radiogroup" aria-labelledby="g-when">${WHEN.map((w) =>
      `<button class="chip" role="radio" data-key="when" data-v="${w.id}" aria-checked="${state.when === w.id}">${w.label()}</button>`).join("")}</div>
      <input type="date" class="date-pick" id="datePick" aria-label="여행 날짜" min="${kstToday()}" value="${state.when === "pick" ? state.date : ""}" ${state.when === "pick" ? "" : "hidden"}>
      <p class="left-time auto-note" id="autoNote" role="status" hidden></p>
    </div>
    ${chipGroup("어디서 출발해요? (숙소가 있는 동네)", "from", froms.map((f) => f.id), (id) => { const f = froms.find((x) => x.id === id); return f.emoji === "🏠" ? f.label : `${em(f.emoji)} ${f.label}`; })}
    <p class="geo" id="geo" hidden></p>
    ${ZONES.length ? chipGroup("어느 쪽으로 갈까요?", "zone", ZONES.map((z) => z.id), (id) => ZONES.find((z) => z.id === id).label) : ""}
    ${ZONES.length ? `<div id="roamWrap" ${state.zone === "all" ? "hidden" : ""}>${chipGroup("얼마나 돌아다닐까요?", "roam", ROAMS.map((r) => r.id), (id) => ROAMS.find((r) => r.id === id).label)}</div>` : ""}
    <details class="advanced"${seenCourse() ? "" : " open"}><summary><span id="advSummary"></span><b aria-hidden="true"></b></summary><div class="inner">
    ${chipGroup("몇 시에 출발해요?", "depart", DEPART, (v) => v, 5)}
    <div id="hoursWrap" ${hubOf() ? "hidden" : ""}>${chipGroup("몇 시간 있어요?", "hours", HOURS, (v) => `${v}시간`, 4)}</div>
    <div id="leaveWrap" ${hubOf() ? "" : "hidden"}>${chipGroup("기차·비행기는 몇 시에 떠나요? (그 전 정각)", "leave", LEAVES, (v) => v, 4)}</div>
    ${chipGroup("1명 예산은요?", "budget", BUDGET, manwon, 4)}
    ${state.how === "any" ? chipGroup("몇 명이서 가요? (택시비를 나눠요)", "people", PEOPLE, (v) => v === 4 ? "4명+" : `${v}명`, 4) : ""}
    ${chipGroup("어디서 끝나요?", "end", ENDS.map((e) => e.id), (id) => { const e = ENDS.find((x) => x.id === id); return `${em(e.emoji)} ${e.label}`; })}
    ${chipGroup("어디 위주로 볼까요?", "area", areaChoices().map((a) => a.id), (id) => { const a = AREAS.find((x) => x.id === id); return `${em(a.emoji)} ${a.label}`; })}
    ${chipGroup("무엇 위주로 즐길까요?", "taste", TASTES.map((t) => t.id), (id) => { const t = TASTES.find((x) => x.id === id); return `${em(t.emoji)} ${t.label}`; })}
    </div></details>
    <div class="cta"><p class="go-hint" id="goHint" role="status" hidden></p><button class="primary" id="go">코스 짜기</button></div>`;
  const go = document.getElementById("go");
  const geo = document.getElementById("geo");
  const say = (msg) => { geo.textContent = msg; geo.hidden = !msg; };
  // 접어 둔 조건을 한 줄로 보여 줘요
  const syncAdv = () => {
    const parts = [state.depart ? `${state.depart} 출발` : "출발 시각 없음", hubOf() ? (state.hours || !state.depart ? `${state.leave} ${hubOf().ride}` : "떠나는 시각이 출발보다 1시간 넘게 늦어야 해요") : hoursText(state.hours), `1명 ${manwon(state.budget)}`];
    if (state.how === "any") parts.push(state.people === 4 ? "4명 이상" : `${state.people}명`);
    if (state.end !== "start") parts.push(ENDS.find((e) => e.id === state.end).label);
    if (state.area !== "mix") parts.push(AREAS.find((a) => a.id === state.area).label);
    if (state.taste !== "mix") parts.push(`${TASTES.find((t) => t.id === state.taste).label} 위주`);
    document.getElementById("advSummary").textContent = parts.join(" · ");
  };
  const sync = () => { if (hubOf() && state.leave) state.hours = hoursFromLeave(); // 출발 시각이 바뀌어도 다시 셈
    const miss = missing();
    go.classList.toggle("dim", miss.length > 0);
    hint.hidden = !miss.length;
    const words = miss.map((m) => m.label).join(", "), last = words.charCodeAt(words.length - 1) - 0xac00;
    hint.textContent = miss.length ? `${words}${last >= 0 && last % 28 ? "을" : "를"} 골라 주세요` : ""; // 받침이 있으면 "을"
    syncAdv(); syncUrl(false); };
  // 빠진 항목: 버튼을 누르면 첫 번째 빠진 곳으로 옮겨 가서 잠깐 표시해요
  const hint = document.getElementById("goHint");
  const missing = () => [
    !state.date && { key: "when", label: "날짜" },
    !startPoint() && { key: "from", label: "출발 장소" },
    !state.depart && { key: "depart", label: "출발 시각" },
    !state.hours && { key: "hours", label: "시간" },
    !state.budget && { key: "budget", label: "예산" }

  const showMissing = (m) => {
    const box = document.getElementById(`g-${m.key}`)?.closest(".group");
    if (!box) return;
    const adv = box.closest("details.advanced");
    if (adv) adv.open = true;
    box.scrollIntoView({ behavior: "smooth", block: "center" });
    box.classList.remove("need"); void box.offsetWidth; box.classList.add("need");
    (m.key === "when" && state.when === "pick" ? datePick : box.querySelector(".chip:not([disabled])"))?.focus({ preventScroll: true });
  };
  // 오늘이면 이미 지난 출발 시각은 고를 수 없어요
  // 날짜·출발 시각 때문에 출발이나 시간을 저절로 바꾸면, 날짜 바로 아래에 한 줄로 알려 줘요
  const autoNote = (before) => {
    const box = document.getElementById("autoNote"), parts = [];
    const today = state.date === kstToday();
    const moved = state.depart && state.depart !== before.depart, shrunk = state.hours !== before.hours && !hubOf();
    if (!moved && !shrunk) { box.hidden = true; return; }
    if (!today) box.textContent = `다른 날이라 ${[moved && `출발 ${state.depart}`, shrunk && `${state.hours}시간`].filter(Boolean).join(", ")}으로 되돌렸어요.`; // 오늘 때문에 바꿨던 값을 되돌림
    else {
      if (moved) parts.push(`출발을 지금에서 가장 가까운 ${state.depart}로`);
      if (shrunk) parts.push(`밤 9시 안에 끝나게 ${state.hours}시간으로`);
      box.textContent = `${parts.join(", ")} 맞췄어요. 아래에서 바꿀 수 있어요.`;
    }
    box.hidden = false;
  };
  const syncDepart = () => {
    const before = { depart: state.depart, hours: state.hours };
    const nowMin = Math.floor((Date.now() + 9 * 3600e3) / 60000) % 1440;
    const today = state.date === kstToday();
    const chips = [...screen.querySelectorAll('.chip[data-key="depart"]')];
    chips.forEach((c) => { c.disabled = today && toMin(c.dataset.v) <= nowMin; });
    const picked = chips.find((c) => c.dataset.v === state.depart);
    if (picked?.disabled) {
      const next = chips.find((c) => !c.disabled);
      state.depart = next ? next.dataset.v : null;
      chips.forEach((c) => c.setAttribute("aria-checked", c === next));
    }
    if (today && !chips.some((c) => !c.disabled)) say("오늘은 고를 수 있는 출발 시각이 지났어요. 내일이나 다른 날짜를 골라 주세요.");
    // 오늘이라 늦은 시각으로 밀렸던 출발은, 다른 날로 바꾸면 10시로 돌려요 (직접 고른 시각은 그대로)
    if (!today && !departTouched && state.depart !== "10:00") {
      state.depart = "10:00";
      chips.forEach((c) => c.setAttribute("aria-checked", c.dataset.v === state.depart));
    }
    fitHours();
    autoNote(before);
  };
  // 시간을 직접 고르지 않았으면, 오늘은 밤 9시 안에 끝나는 길이로 줄이고 다른 날은 6시간으로 둬요
  const fitHours = () => {
    if (hoursTouched || hubOf() || !state.depart) return;
    const room = DAY_END - toMin(state.depart);
    const want = state.date === kstToday() ? [...HOURS].reverse().find((h) => h * 60 <= room && h <= 6) ?? HOURS[0] : 6;
    if (want === state.hours) return;
    state.hours = want;
    screen.querySelectorAll('.chip[data-key="hours"]').forEach((c) => c.setAttribute("aria-checked", Number(c.dataset.v) === state.hours));
  };
  const datePick = document.getElementById("datePick");
  datePick.onchange = () => { state.date = datePick.value || null; staleDate = null; screen.querySelector(".stale")?.remove(); syncDepart(); sync(); };
  if (state.from === "here" && state.here) say("지금 위치에서 출발해요.");

  // "지금 내 위치"는 휴대폰·브라우저에 위치를 물어봐요. 그 지역 밖이면 쓰지 않아요
  const askHere = () => {
    if (!navigator.geolocation) { say("이 브라우저는 위치를 알려 주지 않아요. 다른 출발 장소를 골라 주세요."); return; }
    say("위치를 확인하고 있어요…");
    navigator.geolocation.getCurrentPosition((pos) => {
      const { latitude: lat, longitude: lng } = pos.coords;
      const b = REGION.bounds, inJeju = lat >= b.latMin && lat <= b.latMax && lng >= b.lngMin && lng <= b.lngMax;
      state.here = inJeju ? { name: "내 위치", lat, lng } : null;
      say(inJeju ? "지금 위치에서 출발해요." : `지금 ${REGION.area}에 있지 않아요. 도착하면 써 주세요. 지금은 다른 출발 장소를 골라 주세요.`);
      sync();
    }, () => { state.here = null; say("위치를 알 수 없었어요. 위치 허용을 확인하거나 다른 출발 장소를 골라 주세요."); sync(); },
    { enableHighAccuracy: false, timeout: 10000 });
  };

  screen.querySelectorAll(".chip").forEach((chip) => {
    chip.onclick = () => {
      const key = chip.dataset.key;
      state[key] = (key === "depart" || key === "from" || key === "area" || key === "taste" || key === "when" || key === "end" || key === "zone" || key === "roam" || key === "leave") ? chip.dataset.v : Number(chip.dataset.v);
      if (key === "area") rainSkip = true; // 사람이 직접 고르면 비 때문에 실내로 바꾸지 않아요
      if (key === "when") {
        staleDate = null; screen.querySelector(".stale")?.remove();
        datePick.hidden = state.when !== "pick";
        state.date = state.when === "pick" ? (datePick.value || null) : WHEN.find((w) => w.id === state.when).date();
        if (state.when === "pick" && !datePick.value) datePick.focus();
      }
      screen.querySelectorAll(`.chip[data-key="${key}"]`).forEach((c) => c.setAttribute("aria-checked", c === chip));
      if (key === "hours" || key === "leave" || key === "end") { hoursTouched ||= key === "hours"; document.getElementById("autoNote").hidden = true; } // 직접 고르면 안내는 지워요
      if (key === "when") { document.getElementById("lateNote")?.remove(); syncDepart(); }
      if (key === "depart") { departTouched = true; const before = { depart: state.depart, hours: state.hours }; fitHours(); autoNote(before); }
      if (key === "zone") document.getElementById("roamWrap").hidden = state.zone === "all";
      if (key === "end") {
        // 역·공항이면 떠나는 시각을, 아니면 시간을 골라요
        document.getElementById("hoursWrap").hidden = !!hubOf();
        document.getElementById("leaveWrap").hidden = !hubOf();
        if (hubOf()) {
          state.leave ??= LEAVES.find((v) => toMin(v) >= toMin(state.depart ?? "10:00") + (state.hours ?? 6) * 60) ?? LEAVES[LEAVES.length - 1];
          screen.querySelectorAll('.chip[data-key="leave"]').forEach((c) => c.setAttribute("aria-checked", c.dataset.v === state.leave));
        } else if (!HOURS.includes(state.hours)) {
          state.hours = HOURS.reduce((a, b) => Math.abs(b - (state.hours ?? 6)) < Math.abs(a - (state.hours ?? 6)) ? b : a);
          screen.querySelectorAll('.chip[data-key="hours"]').forEach((c) => c.setAttribute("aria-checked", Number(c.dataset.v) === state.hours));
        }
      }
      if (hubOf() && (key === "end" || key === "leave" || key === "depart")) state.hours = hoursFromLeave();
      if (key === "from") { if (chip.dataset.v === "here") askHere(); else say(""); }
      sync();
    };
  });
  go.onclick = () => {
    const miss = missing();
    if (miss.length) { track("go_blocked", { region: REGION.id, missing: miss.map((m) => m.key).join(",") }); return showMissing(miss[0]); }
    state.skip = []; state.alt = 0; state.fix = []; state.stay = {}; courseTracked = false; goStep(3);
  };
  syncDepart();
  syncAdv();
  sync();
}

// ----- 이동 시간 -----
// 장소끼리는 travel.js의 길 기준 시간표를 쓰고, 표에 없으면(지금 내 위치 등) 직선거리로 어림해요
const travelIndex = (p) => TRAVEL_INDEX[p.id] ?? TRAVEL_INDEX[`start:${p.id}`];

function distKm(a, b) {
  const R = 6371, rad = Math.PI / 180;
  const dLat = (b.lat - a.lat) * rad, dLng = (b.lng - a.lng) * rad;
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(a.lat * rad) * Math.cos(b.lat * rad) * Math.sin(dLng / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h)) * 1.3; // 길이 구불구불한 만큼 1.3배
}

// 교통비 (성인 1명). 버스는 교통카드 기준이고, 40분 안에 갈아타면 환승 할인으로 따로 안 내요 (제주버스정보시스템 요금표)
// 택시는 중형 기본요금(2km까지) + 거리요금. 요금은 regions.js에 지역별로 있어요. 막혀서 느릴 때 붙는 시간요금·심야 할증은 빼고 어림
const isRail = (no) => /호선|동해선|경전철/.test(no);
const busFare = (no) => REGION.subway ? (isRail(no) ? REGION.subway.railFare : REGION.subway.busFare) : /^1\d\d$/.test(no) ? 2000 : 1150; // 제주 급행(1xx번)은 기본 2,000원
// "102번", "2호선": 노선 이름을 화면에 쓰는 모양
const lineName = (no) => isRail(no) ? no : `${no}번`;
// 기본요금 거리는 taxiBaseKm (없으면 2km)
const taxiMeterFare = (km) => Math.max(0, Math.ceil((km - (REGION.taxiBaseKm ?? 2)) * 1000 / REGION.taxiMeter)) * 100;
// taxiFarKm을 넘은 거리는 거리요금이 taxiFarRate배예요 (강릉 6km 넘으면 2배, 제주 20km 넘으면 1.2배)
const taxiFare = (km) => REGION.taxiBase + taxiMeterFare(km) + (REGION.taxiFarKm && km > REGION.taxiFarKm ? Math.ceil((taxiMeterFare(km) - taxiMeterFare(REGION.taxiFarKm)) * ((REGION.taxiFarRate ?? 2) - 1) / 100) * 100 : 0);
// 택시는 같이 타는 사람끼리 나눠 내요 (1명 몫, 100원 단위 올림)
const taxiShare = (km) => Math.ceil(taxiFare(km) / (state.people || 1) / 100) * 100;

// 차로 다닐 때도 이만큼(분) 안으로 가까운 곳은 걸어가게 해요 (차는 세워 둔 곳에 두고 다녀와요)
const CAR_WALK_MAX = 10;
const isCar = (how) => how === "car" || how === "ev";
const samePlace = (x, y) => x === y || (!!x && !!y && x.id !== undefined && x.id === y.id);
// 걸어서 걸리는 시간(분). 시간표에 없으면 직선거리로 어림해요
function walkMin(a, b) {
  const i = travelIndex(a), j = travelIndex(b), wheel = state.who === "wheel";
  if (i === undefined || j === undefined) return distKm(a, b) / (wheel ? 3 : 4.5) * 60;
  return TRAVEL.walk[i][j] * (wheel ? 1.5 : 1);
}
// a에서 b로 가는 방법. 차로 다닐 때는 차를 세워 둔 곳(carAt)을 따져요
// - 차가 지금 자리에 있으면: 가까우면 걷고(차는 그대로), 멀면 차로(차도 b로)
// - 차를 두고 걸어 나왔으면: 가까우면 그대로 걷고, 멀면 차까지 걸어 돌아가서 차로 가요
// 돌려주는 car는 이동한 뒤 차가 있는 곳이에요
function travel(a, b, how, carAt = a) {
  if (!isCar(how)) return travelBase(a, b, how);
  if (samePlace(carAt, a)) { const m = travelBase(a, b, how); return { ...m, car: m.text === "걸어서" ? carAt : b }; }
  const direct = walkMin(a, b);
  // 차가 있는 곳으로 가는 길이면 그냥 걸어가요
  if (samePlace(carAt, b) || direct <= CAR_WALK_MAX) return { min: Math.max(1, Math.ceil(direct)), text: "걸어서", fare: 0, plan: null, car: carAt };
  const toCar = Math.max(1, Math.ceil(walkMin(a, carAt))), drive = travelBase(carAt, b, "drive");
  return { ...drive, min: toCar + drive.min, walkToCar: toCar, carFrom: carAt, car: b };
}
function travelBase(a, b, how) {
  const i = travelIndex(a), j = travelIndex(b);
  if (i === undefined || j === undefined) return travelGuess(a, b, how);
  // 휠체어·어르신은 1.5배 느리게 걸어요
  const wheel = state.who === "wheel";
  const walk = TRAVEL.walk[i][j] * (wheel ? 1.5 : 1), car = TRAVEL.car[i][j], bike = TRAVEL.bike[i][j];
  let min, text, fare = 0, plan = null;
  if (how === "walk") {
    // 걸어서 20분 안이면 걷고, 멀면 버스 (기다리는 시간 포함 평균). 버스가 더 느리면 걸어요
    // 휠체어·어르신은 저상버스가 있는 노선만 타고, 30분 넘게는 걷지 않아요
    // 저상버스 자료가 없는 지역은 휠체어 칸이 없어요
    const bus = (wheel ? TRAVEL.busWheel?.[i][j] ?? null : TRAVEL.bus[i][j]), no = (wheel ? TRAVEL.busWheelNo?.[i][j] : TRAVEL.busNo[i][j]);
    const kind = wheel ? "저상버스" : REGION.subway ? "대중교통" : "버스";
    if (walk <= 20 || (bus !== null && walk <= bus && (!wheel || walk <= 30))) { min = walk; text = "걸어서"; }
    else if (bus === null) { min = Infinity; text = `${kind}로 못 가요`; }
    else {
      min = bus; text = no === "갈아타기" ? `${kind}으로(1번 갈아타기)`.replace("버스으로", "버스로") : isRail(no) ? `${no}으로` : `${no}번 ${wheel ? "저상버스" : "버스"}로`;
      fare = no === "갈아타기" ? busFare("") : busFare(no);
      plan = TRAVEL.busPlans[(wheel ? TRAVEL.busWheelPlan : TRAVEL.busPlan)[i][j]];
    }
  } else if (how === "any") {
    if (walk <= 15) { min = walk; text = "걸어서"; }
    else { min = car + 5; text = "택시로"; fare = taxiShare(TRAVEL.carKm[i][j]); }
  } else if (how === "bike") { min = bike + 3; text = "자전거로"; }

  // 맛집 위주면 오후 간식 때(15:00~16:30)도 한 곳 더, 앞 식사와 2시간 반만 띄워요
  const foodie = state.taste === "food";
  const mealTime = (begin >= 420 && begin <= 570) || (begin >= LUNCH_FROM && begin <= 840) || (foodie && begin >= 900 && begin <= 990) || (begin >= 1020 && begin <= 1200);
  if (p.type === "식당" && (!mealTime || begin - ctx.lastMeal < (foodie ? 150 : 180))) return null;
  // 숙소·공항에서 나와 1시간 안에 아침 식당은 넣지 않아요 (보통 아침을 먹고 나와요. 점심을 먹게 해요)
  if (p.type === "식당" && begin < 660 && begin - toMin(state.depart) < 60) return null;

  let score = -(begin - ctx.now);
  // 점심·저녁 식당에 가산점을 몰아줘요
  if (p.type === "식당") score += begin >= LUNCH_FROM && begin <= 810 ? 120 : 20;
  if (p.type === ctx.lastType) score -= 25;
  if (state.who === "solo" && p.solo) score += 30;
  // 반려견: 이동가방에 넣어야 하는 곳은 뒤로 미뤄요 (크기를 모르면 많이, 작은 개면 조금). 조건 없이 되는 곳이 없을 때만 들어가요
  if (state.who === "dog" && smallDogOnly(p)) score -= state.dogSize === "small" ? 15 : 80;
  if (state.how === "bike" && p.bikeRack) score += 10;
  if ((state.how === "ev" || state.how === "car") && p.parking) score += 10;
  if (state.how === "ev" && chargesHere(p)) score += 20;
  if (MUST.has(p)) score += 1000; // 꼭 갈 곳은 갈 수 있게 되면 바로 넣어요
  if (seesSunset(p, begin, leave)) score += 40;
  // 노을 명소는 해 지기 1시간 안에 도착하면 조금 더, 이름이 노을 명소인데 한낮(해 지기 2시간도 더 전)이면 빼는 쪽으로
  else if (isSunsetSpot(p) && begin >= sunsetToday() - 60 && begin <= sunsetToday()) score += 20;
  if (isSunsetNamed(p) && leave < sunsetToday() - 120) score -= 100;
  // 바닷가·산 쪽 위주를 골랐으면 그쪽 장소를 먼저 (식당은 산 쪽에 적어서 조금만)
  if (state.area === "sea" || state.area === "mountain") score += (isInland(p) === (state.area === "mountain") ? 1 : -1) * (p.type === "식당" ? 15 : 40);
  // 취향: 맞는 곳을 먼저, 자연 위주면 쇼핑·실내는 뒤로
  if (state.taste !== "mix") score += tasteFits(p) ? 45 : state.taste === "nature" && (p.type === "쇼핑" || p.indoor) ? -30 : 0;
  return { place: p, move: mv, begin, leave, score };
}

function add(ctx, stop) {
  ctx.stops.push(stop);
  ctx.here = stop.place; ctx.car = stop.move.car ?? stop.place; ctx.now = stop.leave; ctx.spent += costOf(stop.place) + stop.move.fare; ctx.fares += stop.move.fare; ctx.lastType = stop.place.type;
  if (stop.place.type === "식당") ctx.lastMeal = stop.begin;
  if (stop.place.type === "카페") { ctx.cafes++; ctx.lastCafe = stop.leave; }
  if (stop.place.type === "쇼핑") ctx.shops++;
}

// 갈 수 있는 곳 중 점수가 제일 높은 곳을 하나씩 이어 붙여요
function extend(ctx, pool, limit = maxStops()) {
  while (ctx.stops.length < limit) {
    let best = null;
    // 아직 못 넣은 꼭 갈 곳만큼은 자리를 남겨 둬요
    const mustLeft = [...MUST].filter((p) => !ctx.stops.some((s) => s.place === p)).length;
    const onlyMust = mustLeft > 0 && limit - ctx.stops.length <= mustLeft;
    for (const p of pool) {
      if (onlyMust && !MUST.has(p)) continue;
      const v = visit(ctx, p);
      if (v && (!best || v.score > best.score)) best = v;
    }
    if (!best) return ctx;
    add(ctx, best);
  }
  return ctx;
}

// 정한 순서대로 다녀 보기 (규칙에 안 맞으면 null)
function follow(places, goal = null) {
  const ctx = startCtx(goal);
  for (const p of places) {
    const v = visit(ctx, p);
    if (!v) return null;
    add(ctx, v);
  }
  return ctx;
}

// 마지막 장소에서 끝나는 곳까지 (끝나는 곳이 상관없거나 장소가 없으면 null)
const backOf = (ctx) => endPoint() && ctx.stops.length ? travel(ctx.here, endPoint(), state.how, ctx.car) : null;
const sunsetOf = (c) => c.stops.some((s) => seesSunset(s.place, s.begin, s.leave)) ? 1 : 0;
const movingOf = (ctx) => ctx.stops.reduce((sum, s) => sum + s.move.min, 0) + (backOf(ctx)?.min ?? 0);

// 다 짠 뒤 순서를 바꿔 이동 시간을 줄여요 (구간 뒤집기 2-opt + 한 곳 옮기기). 줄어든 시간에 더 넣을 수 있으면 넣어요
function shorten(ctx, pool) {
  let best = ctx, improved = true;
  while (improved) {
    improved = false;
    const order = best.stops.map((s) => s.place), n = order.length;
    const tries = [];
    for (let i = 0; i < n; i++) for (let j = i + 1; j < n; j++)
      tries.push([...order.slice(0, i), ...order.slice(i, j + 1).reverse(), ...order.slice(j + 1)]);
    for (let i = 0; i < n; i++) for (let k = 0; k < n; k++) if (k !== i && k !== i - 1) {
      const rest = order.filter((_, x) => x !== i);
      rest.splice(k > i ? k - 1 : k, 0, order[i]);
      tries.push(rest);
    }
    for (const t of tries) {
      const c = follow(t, ctx.goal);
      if (c && movingOf(c) < movingOf(best) && sunsetOf(c) >= sunsetOf(best)) { best = c; improved = true; }
    }
  }
  return best === ctx ? ctx : extend(best, pool);
}

// 한 번 코스 짜기. first를 주면 첫 장소는 그곳으로 정해요.
function buildCourse(pool, first, goal = null) {
  const ctx = startCtx(goal);
  if (first) { const v = visit(ctx, first); if (v) add(ctx, v); else return { stops: [], spent: 0, fares: 0, finish: ctx.now }; }
  let c = shorten(extend(ctx, pool), pool);
  // 순서를 줄였는데도 1시간 넘게 남으면 한 곳 더 넣어요 (해 질 무렵이면 노을 명소가 먼저 뽑혀요)
  // 볼거리가 다 떨어졌으면 카페·쇼핑을 한 곳 더 허락해요 (빈 시간보다 쉬어 가는 게 나아서)
  if (c.endMin - c.now > 60) {
    const before = c.stops.length;
    c = extend(c, pool, maxStops() + 1);
    if (c.stops.length === before) { c.maxCafes++; c.maxShops++; c = extend(c, pool, maxStops() + 1); }
  }
  // 노을까지 보기: 마지막에 해 지기 30분 전까지 갈 수 있는 노을 명소를 하나 붙여요 (가장 가까운 곳, 이름부터 노을 명소면 먼저)
  let glow = null;
  if (glowOn() && c.stops.length) {
    const cands = glowCands(c, pool);
    if (cands[0]) { add(c, cands[0]); glow = cands[0].place; }
    // 낮 코스를 다 짠 뒤엔 멀어서 못 가면: 가장 가까운 노을 명소를 목표로 정하고 그쪽으로 다가가며 다시 짜요
    else if (!goal) {
      const near = pool.filter((p) => isSunsetSpot(p) && !closedOn(p))
        .map((p) => ({ p, min: travel(startPoint(), p, state.how).min })).filter((x) => x.min < Infinity).sort((a, b) => a.min - b.min)[0];
      if (near) { const again = buildCourse(pool, first, near.p); if (again.glow) return again; }
    }
  }
  const back = backOf(c);
  const backFare = back?.fare ?? 0;
  return { stops: c.stops, spent: c.spent + backFare, fares: c.fares + backFare, back, finish: c.now + (back?.min ?? 0), glow };
}

// 코스 c 끝에 붙일 수 있는 노을 명소 후보 (좋은 순서). only를 주면 그곳만 따져요
function glowCands(c, pool, only = null) {
  const sunset = sunsetToday(), target = glowTarget();
  // 카페·식당은 연달아 넣지 않는 규칙을 여기서도 지켜요
  return (only ? [only] : pool).filter((p) => isSunsetSpot(p) && !c.stops.some((s) => s.place === p) && !closedOn(p) && !(p.type === c.lastType && (p.type === "카페" || p.type === "식당")) && !(isOutside(p) && c.stops.filter((s) => isOutside(s.place)).length >= maxOutside()))
    .map((p) => {
      const mv = travel(c.here, p, state.how, c.car);
      if (mv.min === Infinity) return null;
      const begin = Math.max(c.now + mv.min, target), leave = Math.max(begin + stayOf(p), sunset + GLOW_AFTER);
      const [open, close] = hoursOf(p);
      if (begin > sunset - 10) return null; // 해 지기 10분 전엔 도착해야 노을을 봐요
      if (open && begin < toMin(open)) return null;
      if (close && toMin(close) < sunset + GLOW_AFTER) return null;
      if (c.spent + costOf(p) + mv.fare > state.budget) return null;
      return { place: p, move: mv, begin, leave, score: -mv.min + (isSunsetNamed(p) ? 15 : 0) };
    }).filter(Boolean).sort((a, b) => b.score - a.score);
}

// "이곳 바꾸기": i번째 장소 자리에 넣을 수 있는 비슷한 곳 (같은 종류 먼저, 이동이 적게 늘어나는 순서로 3곳)
// 공원·볼거리는 서로 비슷한 곳으로 봐요. 노을까지 보기의 마지막 노을 명소는 다른 노을 명소로만 바꿔요
const kindOf = (p) => p.type === "공원" || p.type === "볼거리" ? "see" : p.type;
function swapOptions(stops, back, i, pool) {
  const old = stops[i].place, order = stops.map((s) => s.place);
  const glowSlot = glowOn() && i === stops.length - 1 && isSunsetSpot(old);
  const used = new Set(order);
  const tryPlace = (p) => {
    const c = courseFrom(order.map((q, k) => k === i ? p : q), pool);
    if (!c) return null;
    return { place: p, c, moving: c.stops.reduce((m, s) => m + s.move.min, 0) + (c.back?.min ?? 0) };
  };
  const pick = (filter) => pool.filter((p) => !used.has(p) && !(state.skip ?? []).includes(p.id) && filter(p)).map(tryPlace).filter(Boolean)
    .sort((a, b) => a.moving - b.moving || (b.place.dog === true) - (a.place.dog === true)).slice(0, 3);
  let out = pick((p) => glowSlot ? isSunsetSpot(p) : kindOf(p) === kindOf(old)).map((o) => ({ ...o, same: true }));
  // 같은 종류가 하나도 없으면 다른 종류라도 보여 줘요 (노을 자리는 빼고)
  if (!out.length && !glowSlot) out = pick((p) => kindOf(p) !== kindOf(old)).map((o) => ({ ...o, same: false }));
  return out;
}

// 순서·머무는 시간을 바꾼 코스가 안 될 때 이유: 앞에서부터 하나씩 넣어 보며 처음 막히는 곳을 찾아요
function editWhy(places, pool) {
  const ctx = startCtx();
  for (const p of places) {
    const v = visit(ctx, p);
    if (!v) {
      const name = esc(p.name);
      if (closedOn(p)) return `이렇게 바꾸면 ${name}${josa(p.name, "이", "가")} 쉬는 날이에요.`;
      if (p.type === "식당") return `이렇게 바꾸면 ${name}에 밥때(점심 11:30~14시, 저녁 17~20시)나 운영시간에 맞춰 갈 수 없어요.`;
      if (p.type === "카페" && ctx.lastType === "카페") return `카페 두 곳이 연달아 붙어요.`;
      if (p.type === "식당" && ctx.lastType === "식당") return `식당 두 곳이 연달아 붙어요.`;
      return `이렇게 바꾸면 ${name}의 운영시간이나 전체 시간 안에 들어가지 않아요.`;
    }
    add(ctx, v);
  }
  return `이렇게 바꾸면 고른 시간·예산 안에 돌아오지 못해요.`;
}

// 정한 장소 순서 그대로 코스를 만들어요 ("이곳 바꾸기"). 규칙(운영시간·밥때·예산·시간)에 안 맞으면 null
// 노을까지 보기면 마지막 노을 명소는 해 질 무렵에 맞춰 붙여요
function courseFrom(places, pool) {
  const last = places[places.length - 1];
  const glowLast = glowOn() && last && isSunsetSpot(last) ? last : null;
  const main = glowLast ? places.slice(0, -1) : places;
  const c = follow(main, glowLast) ?? (glowLast ? follow(main) : null);
  if (!c) return null;
  let glow = null;
  if (glowLast) {
    const g = glowCands(c, pool, glowLast)[0];
    if (!g) return null;
    add(c, g); glow = g.place;
  }
  const back = backOf(c), backFare = back?.fare ?? 0;
  if (back && (back.min === Infinity || (!glow && c.now + back.min > toMin(state.depart) + state.hours * 60 - airportBuffer()))) return null;
  if (c.spent + backFare > state.budget) return null;
  return { stops: c.stops, spent: c.spent + backFare, fares: c.fares + backFare, back, finish: c.now + (back?.min ?? 0), glow };
}

// 왔던 길을 되돌아가는 정도: 지나간 직선 거리 ÷ 같은 장소를 가장 짧게 도는 거리 (1이면 군더더기 없음)
const kmBetween = (a, b) => Math.hypot((a.lat - b.lat) * 111, (a.lng - b.lng) * 111 * Math.cos(a.lat * Math.PI / 180));
function detourOf(c) {
  const start = startPoint(), pts = c.stops.map((s) => s.place);
  const len = pts.reduce((sum, p, i) => sum + kmBetween(i ? pts[i - 1] : start, p), 0);
  let best = Infinity;
  const go = (from, left, sum) => {
    if (sum >= best) return;
    if (!left.length) { best = sum; return; }
    left.forEach((p, i) => go(p, left.filter((_, k) => k !== i), sum + kmBetween(from, p)));
  };
  go(start, pts, 0);
  return best > 0.3 ? len / best : 1;
}
// 코스 좋은 정도: 장소에서 즐기는 시간이 길수록, 이동이 짧을수록, 식사가 들어갈수록, 되돌아가지 않을수록 좋아요 (오래 머무는 곳도 공평하게)
function courseScore(c) {
  if (c.stops.length === 0) return -Infinity;
  const moving = c.stops.reduce((sum, s) => sum + s.move.min, 0) + (c.back?.min ?? 0);
  const meal = c.stops.some((s) => s.place.type === "식당" && s.begin >= 660) ? 40 : c.stops.some((s) => s.place.type === "식당") ? 10 : 0;
  const inland = c.stops.filter((s) => isInland(s.place)).length;
  // 골고루: 바닷가와 산 쪽이 둘 다 있으면 좋아요 / 한쪽 위주: 그쪽 장소가 많을수록 좋아요
  const area = state.area === "indoor" ? 0 : state.area === "mix" ? (inland > 0 && inland < c.stops.length ? 40 : 0)
    : 30 * (state.area === "mountain" ? inland : c.stops.length - inland);
  const staying = c.stops.reduce((sum, s) => sum + stayOf(s.place), 0);
  // 옆 구역도 조금: 고른 구역이 중심이고 옆 구역이 한두 곳 섞이면 좋아요
  const outside = c.stops.filter((s) => isOutside(s.place)).length;
  const roam = !roaming() ? 0 : outside * 2 >= c.stops.length ? -300 : outside > 0 ? 80 : 0;
  // 이름이 노을 명소인데 한낮에 들르는 코스는 뒤로 미뤄요
  const daySunset = c.stops.filter((s) => isSunsetNamed(s.place) && s.leave < sunsetToday() - 120).length;
  const dogBag = state.who === "dog" ? c.stops.filter((s) => smallDogOnly(s.place)).length * (state.dogSize === "small" ? 10 : 60) : 0;
  const taste = state.taste === "mix" ? 0 : c.stops.filter((s) => tasteFits(s.place)).length * 25;
  return taste - dogBag + staying + c.stops.length * 10 - moving + meal + area + roam + sunsetOf(c) * 40 - (detourOf(c) - 1) * 150 - daySunset * 80;
}

// 꼭 갈 곳 (사용자가 골라 반드시 넣는 곳, 3곳까지)
const MUST_MAX = 3;
let MUST = new Set();
// 결과 화면 위쪽: 꼭 갈 곳 목록(✕로 빼기)과 "꼭 갈 곳 넣기" 찾기 창
function mustBar() {
  const chips = state.must.map((id) => PLACES.find((p) => p.id === id)).filter(Boolean)
    .map((p) => `<span class="must-chip">${em(TYPE_ICON[p.type] ?? "📍")} ${esc(p.name)}<button class="must-del" data-id="${p.id}" aria-label="${esc(p.name)} 꼭 갈 곳에서 빼기">✕</button></span>`).join("");
  return `<div class="must-bar">${chips ? `<span class="must-title">${em("📌")} 꼭 갈 곳</span>${chips}` : ""}
    ${state.must.length >= MUST_MAX ? "" : chips
      ? `<button class="ghost must-add" id="mustAdd" aria-expanded="false" aria-controls="mustPanel">${em("📌")} 더 넣기</button>`
      : `<button class="must-cta" id="mustAdd" aria-expanded="false" aria-controls="mustPanel"><span class="must-icon" aria-hidden="true">📌</span><span><b>꼭 가고 싶은 곳이 있나요?</b><small>고르면 그곳을 넣고 주변으로 다시 짜 드려요</small></span><span class="must-go" aria-hidden="true">＋</span></button>`}
    <div class="must-panel" id="mustPanel" hidden>
      <input class="search" id="mustSearch" type="search" placeholder="장소 이름 찾기 (예: 카페, 시장)" aria-label="꼭 갈 곳 찾기" autocomplete="off">
      <ul class="must-list" id="mustList"></ul>
    </div></div>`;
}
function bindMust(redo) {
  screen.querySelectorAll(".must-del").forEach((b) => { b.onclick = () => { state.must = state.must.filter((id) => id !== b.dataset.id); state.alt = 0; state.fix = []; state.stay = {}; redo(); }; });
  const btn = document.getElementById("mustAdd"), panel = document.getElementById("mustPanel");
  if (!btn) return;
  const input = document.getElementById("mustSearch"), list = document.getElementById("mustList");
  const need = NEED[state.who];
  const draw = () => {
    const w = input.value.replace(/\s/g, "");
    const hits = PLACES.filter((p) => p.lat !== null && !state.must.includes(p.id) && (!w || (p.name + p.type + (p.desc ?? "")).replace(/\s/g, "").includes(w)))
      .sort((a, b) => a.name.localeCompare(b.name, "ko")).slice(0, w ? 30 : 12);
    list.innerHTML = hits.length ? hits.map((p) => {
      const no = need && p[need] === false;
      const unknown = need && p[need] === null;
      return `<li><button class="must-pick" data-id="${p.id}" ${no ? "disabled" : ""}>${em(TYPE_ICON[p.type] ?? "📍")} <span>${esc(p.name)}<small>${p.type}${p.desc ? ` · ${esc(p.desc)}` : ""}${no ? ` · ${{ dog: "반려견 안 돼요", kid: "유모차 안 돼요", wheel: "계단 있어요" }[state.who]}` : unknown ? ` · ${{ dog: "반려견", kid: "유모차", wheel: "계단" }[state.who]} 정보 없음` : ""}</small></span></button></li>`;
    }).join("") : `<li class="caution">"${esc(input.value)}"에 맞는 장소가 이 지역 자료에 없어요.</li>`;
    list.querySelectorAll(".must-pick").forEach((b) => { b.onclick = () => {
      state.must = [...state.must, b.dataset.id].slice(0, MUST_MAX);
      state.skip = state.skip.filter((id) => id !== b.dataset.id); state.alt = 0; state.fix = []; state.stay = {};
      track("must_add", { region: REGION.id, place: b.dataset.id }); redo();
    }; });
  };
  btn.onclick = () => { panel.hidden = !panel.hidden; btn.setAttribute("aria-expanded", String(!panel.hidden)); if (!panel.hidden) { draw(); input.focus(); } };
  input.oninput = draw;
}
// 꼭 갈 곳을 못 넣을 때 그곳 때문인 이유를 하나씩 찾아요
function whyMust() {
  const startMin = toMin(state.depart), endMin = startMin + state.hours * 60 - airportBuffer();
  return state.must.map((id) => PLACES.find((p) => p.id === id)).filter(Boolean).map((p) => {
    const [open, close] = hoursOf(p), name = esc(p.name);
    if (closedOn(p) && p.closedDays?.includes(tripDay()) && !HOLIDAYS[state.date]) return `${name}${josa(p.name, "은", "는")} ${tripDay()}요일에 쉬어요.`;
    const hc = holidayClosed(p, state.date);
    if (hc) return `${name}${josa(p.name, "은", "는")} ${hc === "신정" ? "1월 1일" : hc.replace("연휴", " 연휴")}에 쉬어요.`;
    if (shiftedClosed(p, state.date)) return `${name}${josa(p.name, "은", "는")} 쉬는 날이 공휴일과 겹쳐서, 고른 날에 대신 쉬어요.`;
    const mc = monthlyClosed(p);
    if (mc && closedOn(p)) return `${name}${josa(p.name, "은", "는")} 매월 ${ORDINAL[mc.week]} ${mc.day}요일에 쉬는데, 고른 날이 그날이에요.`;
    if (close && toMin(close) - p.stayMin < startMin) return `${name}${josa(p.name, "은", "는")} ${close}에 닫아서 ${state.depart} 출발로는 못 들러요.`;
    if (open && toMin(open) + p.stayMin > endMin) return `${name}${josa(p.name, "은", "는")} ${open}에 열어서 이 시간 안에 못 들러요.`;
    if (travel(startPoint(), p, state.how).min === Infinity) return `${name}${josa(p.name, "은", "는")} ${state.how === "walk" ? "버스·지하철로" : "이 이동 방법으로"} 갈 수 없어요.`;
    if (costOf(p) > state.budget) return `${name}${josa(p.name, "은", "는")} 1명 ${won(costOf(p))}이라 예산을 넘어요.`;
    if (p.type === "식당") return `${name}${josa(p.name, "은", "는")} 식당이라 밥때(점심 11~14시, 저녁 17~20시)에 들러야 하는데, 이 시간에는 맞추기 어려워요.`;
    return `${name}까지 가서 머물 시간이 모자라요.`;
  });
}

// includeUnknown: 정보가 없는 곳도 넣어 보기 (코스가 안 나올 때 이유를 찾으려고만 써요)
function makeCourse({ includeUnknown = false } = {}) {
  const need = NEED[state.who], skip = state.skip ?? [];
  let unknownSkipped = 0, noLocation = 0;
  MUST = new Set((state.must ?? []).filter((id) => !skip.includes(id)).map((id) => PLACES.find((p) => p.id === id)).filter((p) => p && p.lat !== null));
  const pool = PLACES.filter((p) => {
    if (p.lat === null) { noLocation++; return false; }
    if (skip.includes(p.id)) return false;
    if (MUST.has(p)) return true; // 사용자가 고른 곳은 구역·실내·동행 정보와 상관없이 넣어 봐요 (정보 없음은 배지로 알려요)
    if (state.zone && state.zone !== "all" && p.zone !== state.zone && !(roaming() && REGION.zones.find((z) => z.id === state.zone).near.includes(p.zone))) return false;
    if (p.forDogs && state.who !== "dog") return false; // 애견카페는 반려견과 갈 때만
    if (state.who === "dog" && state.dogSize === "big" && smallDogOnly(p)) return false; // 중·대형견은 이동가방에 넣어야 하는 곳을 빼요
    // 실내 위주: 공원과 야외 볼거리는 빼요
    if (state.area === "indoor" && (p.type === "공원" || (p.type === "볼거리" && !p.indoor))) return false;
    if (!need) return true;
    if (meetsNeed(p, need)) return true;
    if (p[need] === null) unknownSkipped++;
    return includeUnknown && p[need] === null;
  });

  // 첫 장소를 하나씩 바꿔 가며 여러 코스를 짜 보고, 좋은 순서로 줄 세워요 (왔다 갔다를 줄여요)
  // "다른 코스 보기"를 누르면 그다음 코스를 보여 줘요
  const seen = new Set(), courses = [];
  for (const first of [null, ...pool]) {
    const c = buildCourse(pool, first);
    const key = c.stops.map((s) => s.place.id).sort().join();
    if (!c.stops.length || seen.has(key)) continue;
    if ([...MUST].some((p) => !c.stops.some((s) => s.place === p))) continue; // 꼭 갈 곳이 빠진 코스는 버려요
    seen.add(key); courses.push(c);
  }
  courses.sort((a, b) => courseScore(b) - (glowOn() && !b.glow ? 500 : 0) - courseScore(a) + (glowOn() && !a.glow ? 500 : 0));
  let pick = courses.length ? courses[(state.alt ?? 0) % courses.length] : { stops: [], spent: 0, fares: 0, finish: toMin(state.depart) };
  if (state.fix?.length) {
    const places = state.fix.map((id) => pool.find((p) => p.id === id));
    const fixed = places.every(Boolean) ? courseFrom(places, pool) : null;
    if (fixed) pick = { ...fixed, fixed: true };
    else { state.fix = []; state.stay = {}; } // 조건이 바뀌어 더는 안 맞으면 버려요
  }
  return { ...pick, pool, unknownSkipped, noLocation, count: courses.length };
}

// 코스가 안 나오면 조건을 하나씩 풀어 보고 진짜 이유를 알려 줘요
function whyEmpty() {
  const tryWith = (change) => {
    const saved = { ...state }; Object.assign(state, change, { fix: [], stay: {} });
    const ok = makeCourse().stops.length > 0;
    Object.assign(state, saved); return ok;
  };
  if (state.must.length && tryWith({ must: [] })) return "must";
  if (state.skip.length && tryWith({ skip: [] })) return "skip";
  if (state.zone && state.zone !== "all" && !tryWith({ zone: "all" })) return "other";
  if (tryWith({ budget: Infinity })) return "budget";
  if (tryWith({ hours: 12 })) return "hours";
  if (state.zone && state.zone !== "all" && tryWith({ zone: "all" })) return "zone";
  if (makeCourse({ includeUnknown: true }).stops.length) return "unknown";
  return "other";
}

// 코스가 일찍 끝날 때: 하나만 바꿔서 장소가 더 들어가는 대안 (2개까지)
// 이웃 지역(예: 애월 → 한림·제주시내) 장소는 지역끼리 이동 시간표가 없어서 아직 못 섞어요
function leftFixes(now) {
  const count = (change) => {
    const saved = { ...state }; Object.assign(state, change, { alt: 0, fix: [], stay: {} });
    const n = makeCourse().stops.length;
    Object.assign(state, saved); return n;
  };
  const out = [];
  const tryAdd = (key, change, label) => { if (out.length < 2) { const n = count(change); if (n > now) out.push({ key, change, label: `${label} → ${n}곳` }); } };
  if (state.how === "walk") tryAdd("how", { how: "any" }, `${em("🚕")} 먼 곳은 택시로`);
  if (state.zone && state.zone !== "all" && state.roam !== "near") tryAdd("roam", { roam: "near" }, `${em("🧭")} 옆 구역도 조금`);
  if (state.area === "indoor") tryAdd("area", { area: "mix" }, `${em("🤷")} "골고루"로 바꾸기`);
  if (state.taste !== "mix") tryAdd("taste", { taste: "mix" }, `${em("🤷")} 취향 "골고루"로`);
  return out;
}

// 코스가 비었을 때: 조건을 하나만 바꿔서 코스가 나오는 것만 버튼으로 보여 줘요 (작은 변화부터, 3개까지)
function emptyFixes() {
  const count = (change) => {
    const saved = { ...state }; Object.assign(state, change, { alt: 0, fix: [], stay: {} });
    const n = makeCourse().stops.length;
    Object.assign(state, saved); return n;
  };
  const out = [];
  const tryAdd = (key, change, label) => { if (out.length < 3) { const n = count(change); if (n) out.push({ key, change, label: `${label} → ${n}곳` }); } };
  if (state.area !== "mix") tryAdd("area", { area: "mix" }, `${em("🤷")} "골고루"로 바꾸기`);
  if (state.taste !== "mix") tryAdd("taste", { taste: "mix" }, `${em("🤷")} 취향 "골고루"로`);
  if (!hubOf()) {
    const longer = HOURS.find((h) => h > state.hours && count({ hours: h }));
    if (longer) tryAdd("hours", { hours: longer }, `${em("⏱️")} ${longer}시간으로 늘리기`);
  }
  if (state.how === "walk" || state.how === "bike") tryAdd("how", { how: "car" }, `${em("🚗")} 자차·렌터카로 바꾸기`);
  if (toMin(state.depart) >= 13 * 60) tryAdd("depart", { depart: "10:00" }, `${em("⏰")} 10시 출발로 바꾸기`);
  if (state.from !== "here") {
    const others = STARTS.filter((s) => s.id !== state.from && s.id !== "airport").map((s) => ({ s, n: count({ from: s.id }) })).filter((x) => x.n).sort((a, b) => b.n - a.n);
    if (others[0]) tryAdd("from", { from: others[0].s.id }, `${em("🏠")} ${esc(others[0].s.label)} 출발로 바꾸기`);
  }
  const more = BUDGET.find((b) => b > state.budget);
  if (more) tryAdd("budget", { budget: more }, `${em("💰")} 1명 ${manwon(more)}으로 늘리기`);
  // 하나만 바꿔서는 모자라면 "골고루"와 함께 두 가지를 바꿔 봐요
  if (out.length < 2 && state.area !== "mix") {
    if (!hubOf() && state.hours < 6) tryAdd("area+hours", { area: "mix", hours: 6 }, `${em("🤷")} 골고루 + 6시간으로`);
    if (state.how === "walk" || state.how === "bike") tryAdd("area+how", { area: "mix", how: "car" }, `${em("🤷")} 골고루 + 자차로`);
  }
  return out;
}

// 장소 종류 아이콘 (사진 대신 카드에 크게 보여 줘요)
const TYPE_ICON = { 식당: "🍜", 카페: "☕", 볼거리: "🏛️", 공원: "🌳", 쇼핑: "🛍️" };
// 지도 바로가기: 장소 이름·"사진·후기"는 카카오맵 장소 페이지(번호가 없으면 이름 검색), "지도 보기"는 카카오맵 지도에서 위치를 열어요
const placeUrl = (p) => p.kakaoId ? `https://place.map.kakao.com/${p.kakaoId}` : `https://map.kakao.com/?q=${encodeURIComponent(`${p.name} ${REGION.search}`)}`;
function mapLinks(p) {
  const kakao = placeUrl(p);
  // 지도에서 위치 보기: 장소 번호가 있으면 그 장소로, 없으면 이름·좌표로 카카오맵을 열어요
  const onMap = p.kakaoId ? `https://map.kakao.com/link/map/${p.kakaoId}` : `https://map.kakao.com/link/map/${encodeURIComponent(String(p.name).replace(/,/g, " "))},${p.lat},${p.lng}`;
  return `<a href="${kakao}" target="_blank" rel="noopener" data-map="kakao" aria-label="${esc(p.name)} 사진·후기 카카오맵에서 보기">${p.kakaoId ? "📷 사진·후기" : "카카오맵"}</a><a href="${onMap}" target="_blank" rel="noopener" data-map="kakao_map" aria-label="${esc(p.name)} 위치 카카오맵 지도에서 보기">🗺️ 카카오지도</a>`;
}

// 전부 정보가 없는 칸은 배지를 안 띄워요 (예: 자전거 거치대는 아직 60곳 모두 모름)

function badgesFor(s) {
  const p = s.place, out = [];
  const yesNo = (v, ok, label) => {
    if (v === true) out.push(`<span class="badge">${ok}</span>`);
    else if (v === null) out.push(`<span class="badge warn">${label}</span>`);
  };
  if (state.who === "dog") {
    if (p.dog && p.dogRule) out.push(`<span class="badge warn">반려견 조건${p.dogReview ? "(후기 기준)" : ""}: ${esc(p.dogRule)}</span>`);
    else yesNo(p.dog, p.dogReview ? "반려견 OK(후기 기준)" : "반려견 OK", "반려견 정보 없음");
  }
  if (state.who === "kid" && babyChairOnly(p)) out.push(`<span class="badge warn">유아의자 있음 · 유모차는 확인 필요</span>`);
  else if (state.who === "kid") yesNo(p.stroller, p.strollerReview ? "유모차 OK(후기 기준)" : "유모차 OK", "유모차 정보 없음");
  // 구글 지도 제보로만 아는 곳은 입구 이야기만 해요 (안쪽까지 계단이 없는지는 몰라요)
  if (state.who === "wheel") yesNo(p.stepFree, /구글 지도/.test(p.note) && !/무장애/.test(p.note) ? "휠체어 입구 있음(이용자 제보)" : "계단 없음", "계단 정보 없음");
  // 혼자 좋은 곳만 표시해요 (모르는 곳까지 '확인 필요'를 띄우면 화면이 지저분해져요)
  if (state.who === "solo" && p.solo) out.push(`<span class="badge">혼자 좋아요</span>`);
  if (state.how === "bike" && !NO_DATA_YET.bikeRack) yesNo(p.bikeRack, "자전거 거치대", "자전거 거치대 확인 필요");
  if (state.how === "car") yesNo(p.parking, "주차 가능", "주차 확인 필요");
  if (state.how === "ev") {
    yesNo(p.parking, "주차 가능", "주차 확인 필요");
    out.push(p.evChargerMin === null
      ? `<span class="badge warn">충전소 거리 확인 필요</span>`
      : `<span class="badge">충전소 걸어서 ${p.evChargerMin}분</span>`);
    if (chargesHere(p)) out.push(`<span class="badge">${em("🔌")} 여기서 충전하며 쉬기 좋아요</span>`);
  }
  if (p.closedDays === null) out.push(`<span class="badge warn">쉬는 날 확인 필요</span>`);
  if (p.open === null && !alwaysOpen(p)) out.push(`<span class="badge warn">운영시간 확인 필요</span>`);
  if (p.seasonalHours) out.push(`<span class="badge warn">계절마다 시간이 달라요</span>`);
  const beach = inBeachSeason(p);
  if (beach !== null) out.push(beach ? `<span class="badge">해수욕장 개장 기간</span>` : `<span class="badge warn">해수욕장 개장 기간 아님 · 산책·노을만</span>`);
  if (seesSunset(p, s.begin, s.leave)) out.push(`<span class="badge sun">${em("🌅")} 노을 볼 시간</span>`);
  return out.join("");
}

// 카드에 보여 줄 종류: 해수욕장·해변은 분류가 "공원"이어도 "해변"으로 보여 줘요 (코스 계산은 그대로 공원)
const isBeach = (p) => p.type === "공원" && (p.beachSeason || /해수욕장|해변/.test(p.name));
const kindLabel = (p) => isBeach(p) ? "해변" : p.type;
// 비용: 식당·카페는 메뉴판 대표 메뉴 값이라 "1인 예상"으로, 입장료는 그대로
function costLabel(p) {
  if (p.cost === null) return costOf(p) ? `1인 약 ${won(costOf(p))}(추정)` : "비용 확인 필요";
  return isFood(p) && p.cost > 0 ? `1인 예상 ${won(p.cost)}` : won(p.cost);
}
// 운영시간이 없는 곳 중 늘 열려 있는 곳(공원·해변, 메모에 '상시 개방' 등)은 "확인 필요"를 띄우지 않아요
const alwaysOpen = (p) => p.type === "공원" || /상시\s*개방|24시간|운영시간 없음|운영시간 없어요|거리라서|둘레길/.test(p.note ?? "");

// 받침에 맞는 조사: josa("한담공원", "은", "는") → "은" (이름 끝의 한글 글자로 봐요)
function josa(word, withBatchim, without) {
  const last = [...word].reverse().find((c) => c >= "가" && c <= "힣");
  return last && (last.charCodeAt(0) - 0xac00) % 28 ? withBatchim : without;
}

// "이 코스는요": 코스 데이터에서 바로 나오는 사실만 문장으로 만들어요 (지어내는 말 없이)
function explainCourse(stops, back) {
  const out = [];
  const name = (s) => `<b>${esc(s.place.name)}</b>`;
  const need = { dog: "반려견과 갈 수 있다고", kid: "유모차가 다닐 수 있다고", wheel: "휠체어로 들어갈 수 있다고" }[state.who];
  const chairOnly = stops.filter((s) => babyChairOnly(s.place));
  if (need && chairOnly.length) out.push(`${chairOnly.map(name).join(", ")}${josa(chairOnly[chairOnly.length - 1].place.name, "은", "는")} 유아의자는 있지만 유모차가 들어가는지는 자료가 없어요. 나머지는 유모차가 다닐 수 있다고 자료에 나온 곳이에요. 전화로 한 번 확인해 주세요.`);
  else if (need) out.push(`모두 ${need} 자료에 나온 곳이에요. 직접 가 본 건 아니라서 전화로 한 번 확인해 주세요.`);
  const solo = stops.filter((s) => s.place.solo);
  if (state.who === "solo" && solo.length) out.push(`혼자 가기 좋은 ${solo.map(name).join(", ")}${josa(solo[solo.length - 1].place.name, "을", "를")} 넣었어요.`);
  // 식사
  const meals = stops.filter((s) => s.place.type === "식당");
  const mealName = (m) => (m < 660 ? "아침" : m < 870 ? "점심" : m < 1020 ? "간식" : "저녁");
  for (const m of meals) out.push(`${mealName(m.begin)}은 ${toHHMM(m.begin)}에 ${name(m)}${m.place.desc ? `(${esc(m.place.desc.replace(/\s*\(.*?\)/g, ""))})` : ""}에서 먹어요.`);
  const lunchTime = stops.length && stops[0].begin <= 720 && stops[stops.length - 1].leave >= 780;
  if (!meals.length && lunchTime) out.push("조건에 맞는 식당이 없어서 밥은 따로 챙겨 주세요.");
  const cafes = stops.filter((s) => s.place.type === "카페");
  if (cafes.length) out.push(`${cafes.map(name).join(", ")}에서 쉬어 가요.`);
  // 노을
  const sun = stops.find((s) => seesSunset(s.place, s.begin, s.leave));
  if (sun) out.push(`해가 지는 ${toHHMM(sunsetToday())}쯤 ${name(sun)}에 있어요.`);
  // 바닷가·산 쪽
  const inland = stops.filter((s) => isInland(s.place)).length, sea = stops.length - inland;
  if (state.area === "indoor") out.push("비가 와도 괜찮게 공원과 야외 볼거리는 뺐어요.");
  else if (!REGION.inland) out.push(inland && sea ? `바닷가 ${sea}곳, 산 쪽 ${inland}곳을 섞었어요.` : inland ? `모두 ${REGION.area === "제주" ? "산 쪽(중산간)" : "바다에서 떨어진 안쪽"}이에요.` : `모두 바닷가 쪽이에요.`);
  // 취향
  if (state.taste !== "mix") {
    const fit = stops.filter((s) => tasteFits(s.place)), t = TASTES.find((x) => x.id === state.taste);
    out.push(fit.length ? `${t.label} 위주로 ${fit.map(name).join(", ")}${josa(fit[fit.length - 1].place.name, "을", "를")} 골랐어요.` : `${t.label}에 맞는 곳이 조건 안에 없어서 골고루 넣었어요.`);
  }
  // 이동
  const moves = [...stops.map((s) => s.move), ...(back ? [back] : [])];
  const total = moves.reduce((m, x) => m + x.min, 0);
  const walks = moves.filter((x) => x.text === "걸어서").length;
  const kinds = [...new Set(moves.filter((x) => x.text !== "걸어서").map((x) => x.text.replace(/ ?로.*$/, "").replace(/\(.*\)/, "")))];
  out.push(`이동은 모두 ${total}분이에요${walks === moves.length ? " (모두 걸어서" : walks ? ` (${moves.length}번 중 ${walks}번은 걸어서` : " ("}${kinds.length ? `${walks ? ", " : ""}${kinds.join("·")}` : ""}).`.replace(" ()", ""));
  // 일찍 닫는 곳
  const tight = stops.find((s) => { const [, close] = hoursOf(s.place); return close && close !== "24:00" && toMin(close) - s.leave <= 30; });
  if (tight) out.push(`${name(tight)}${josa(tight.place.name, "은", "는")} ${hoursOf(tight.place)[1]}에 닫아서 그 전에 다녀오게 넣었어요.`);
  return out;
}

// 코스 공유: 폰이면 공유 창(카톡 등), 아니면 링크 복사
// ----- 날씨: 노르웨이 기상청(MET Norway) 예보를 지역 한가운데(REGION.sun) 기준으로 받아요 (열쇠 없음, 9일 뒤까지) -----
// 지역 좌표만 보내요 (사용자 위치는 보내지 않아요). 같은 지역은 1시간 동안 다시 받지 않아요
const weatherCache = {};
async function loadForecast() {
  const [lat, lng] = REGION.sun.map((v) => v.toFixed(2));
  const key = `wx-${lat},${lng}`;
  const now = Date.now();
  if (weatherCache[key] && now - weatherCache[key].at < 3600e3) return weatherCache[key].data;
  try { const c = JSON.parse(sessionStorage.getItem(key)); if (c && now - c.at < 3600e3) { weatherCache[key] = c; return c.data; } } catch {}
  const r = await fetch(`https://api.met.no/weatherapi/locationforecast/2.0/compact?lat=${lat}&lon=${lng}`);
  if (!r.ok) throw new Error(r.status);
  const data = (await r.json()).properties.timeseries;
  weatherCache[key] = { at: now, data };
  try { sessionStorage.setItem(key, JSON.stringify(weatherCache[key])); } catch {}
  return data;
}
const WX_LABEL = [[/thunder/, "뇌우", "⛈️"], [/snow/, "눈", "🌨️"], [/sleet/, "진눈깨비", "🌨️"], [/heavyrain/, "많은 비", "🌧️"], [/rainshowers/, "소나기", "🌦️"], [/lightrain/, "약한 비", "🌦️"], [/rain/, "비", "🌧️"],
  [/fog/, "안개", "🌫️"], [/cloudy/, "흐림", "☁️"], [/partlycloudy/, "구름 조금", "⛅"], [/fair/, "대체로 맑음", "🌤️"], [/clearsky/, "맑음", "☀️"]];
const wxOf = (code) => WX_LABEL.find(([re]) => re.test(code)) ?? [null, "", "🌤️"];
const WX_RANK = (code) => /thunder|snow|sleet|heavyrain/.test(code) ? 4 : /rain/.test(code) ? 3 : /fog/.test(code) ? 2 : /cloudy/.test(code) && !/partly/.test(code) ? 1 : 0;
// 하루를 나눠 보여 주는 때 (분): 오전 6~12시, 오후 12~18시, 저녁 18~24시
const DAY_PARTS = [["오전", 360, 720], ["오후", 720, 1080], ["저녁", 1080, 1440]];
// 비는 예보 이름 대신 시간당 강수량으로 나눠요 (기상청 기준: 3mm 미만 약한 비, 15mm 이상 강한 비)
function wxLabel(w) {
  const [, label, icon] = wxOf(w.code);
  if (/rain/.test(w.code) && !/thunder|snow|sleet/.test(w.code)) return w.rate >= 15 ? ["많은 비", "🌧️"] : w.rate >= 3 ? ["비", "🌧️"] : ["약한 비", "🌦️"];
  return [label, icon];
}
// 정한 시간(한국 시각, 분)에 걸치는 예보만 모아요. 처음 2~3일은 1시간, 그 뒤는 6시간 단위예요
function weatherFor(series, date, fromMin, toMin) {
  const t0 = Date.parse(`${date}T00:00:00+09:00`) + fromMin * 60e3, t1 = Date.parse(`${date}T00:00:00+09:00`) + toMin * 60e3;
  let worst = null, rain = 0, rate = 0, wind = 0, temps = [], any = false;
  for (const e of series) {
    const t = Date.parse(e.time);
    const block = e.data.next_1_hours ? 1 : e.data.next_6_hours ? 6 : 0;
    if (!block || t + block * 3600e3 <= t0 || t >= t1) continue;
    any = true;
    const d = e.data[block === 1 ? "next_1_hours" : "next_6_hours"];
    const code = d.summary.symbol_code;
    if (!worst || WX_RANK(code) > WX_RANK(worst)) worst = code;
    rain += d.details?.precipitation_amount ?? 0;
    rate = Math.max(rate, (d.details?.precipitation_amount ?? 0) / block); // 시간당 강수량(mm)
    wind = Math.max(wind, e.data.instant.details.wind_speed ?? 0);
    temps.push(e.data.instant.details.air_temperature);
  }
  if (!any) return null;
  return { code: worst, rain: Math.round(rain * 10) / 10, rate, wind: Math.round(wind), tmin: Math.round(Math.min(...temps)), tmax: Math.round(Math.max(...temps)) };
}
// 비가 제법 오면(시간당 3mm 넘게, 또는 뇌우) "골고루" 코스를 실내 위주로 먼저 바꿔 보여 줘요.
// 같은 지역·날짜에서 "골고루로 되돌리기"를 누르거나 실내 코스가 비면 다시 바꾸지 않아요
let rainAuto = null;            // 지금 비 때문에 실내로 바꾼 조건 열쇠
const rainKept = new Set();     // 되돌렸거나 실내 코스가 없던 조건 열쇠
const rainNoIndoor = new Set(); // 실내 코스가 비었던 조건 열쇠 (실내 버튼을 숨겨요)
let rainSkip = false;           // 조건 화면에서 "어디 위주"를 직접 골랐어요
const outdoorOf = (stops) => stops.filter((s) => s.place.type === "공원" || (s.place.type === "볼거리" && !s.place.indoor)).length;
const rainKey = () => `${REGION.id}|${state.date}|${state.depart}|${state.zone ?? ""}`;
async function drawWeather(stops, finish, redo) {
  const box = document.getElementById("weather");
  if (!box) return;
  const date = state.date, region = REGION;
  let series;
  try { series = await loadForecast(); } catch { return; } // 날씨를 못 받아도 코스는 그대로 보여요
  if (state.date !== date || REGION !== region || !document.body.contains(box)) return; // 그새 조건이 바뀌었어요
  // 코스 시간 예보는 실제로 짠 코스가 아니라 고른 시간(출발~출발+시간)으로 봐요.
  // 그래야 "실내 위주로 다시 짜기"로 코스 길이가 바뀌어도 같은 날 날씨가 그대로예요
  const fromM = toMin(state.depart), toM = glowOn() ? sunsetToday() + GLOW_AFTER : fromM + state.hours * 60;
  const w = weatherFor(series, date, fromM, toM);
  if (!w) return; // 예보 범위(9일) 밖이에요
  const [label, icon] = wxLabel(w);
  // 위에 크게 보이는 건 하루 단위(오전·오후·저녁)라서 코스를 다시 짜도 바뀌지 않아요
  const parts = DAY_PARTS.filter(([, a, b]) => a < toM && b > fromM)
    .map(([name, a, b]) => { const pw = weatherFor(series, date, a, b); return pw && { name, w: pw, l: wxLabel(pw) }; }).filter(Boolean);
  const temps = parts.length ? parts.map((p) => p.w) : [w];
  const tmin = Math.min(...temps.map((x) => x.tmin)), tmax = Math.max(...temps.map((x) => x.tmax));
  const wet = WX_RANK(w.code) >= 3 || w.rain >= 1;
  const heavy = /thunder/.test(w.code) || (/rain|sleet/.test(w.code) && w.rate >= 3);
  const outdoor = outdoorOf(stops);
  const coast = stops.some((s) => (s.place.type === "공원" || s.place.type === "볼거리") && !isInland(s.place) && /바다|해안|해변|해수욕|포구|코지|산책로/.test(s.place.name + s.place.note));
  if (heavy && outdoor && state.area === "mix" && !rainSkip && !rainKept.has(rainKey())) {
    rainAuto = rainKey(); state.area = "indoor"; state.alt = 0; state.fix = []; state.stay = {};
    track("weather_auto_indoor", { region: REGION.id });
    redo(); return;
  }
  const autoOn = state.area === "indoor" && rainAuto === rainKey();
  const rainy = wet && outdoor && state.area !== "indoor";
  box.querySelector("summary").innerHTML = `${parts.length ? parts.map((p) => `<span class="wx-part">${p.name} ${em(p.l[1])} ${p.l[0]}</span>`).join(" · ") : `${em(icon)} ${label}`} · ${tmin === tmax ? `${tmin}℃` : `${tmin}~${tmax}℃`}${autoOn ? ` · <b class="wx-flag">${em("☔")} 실내 위주로 짰어요</b>` : rainy ? ` · <b class="wx-flag">${em("☔")} 비 소식</b>` : ""}`;
  box.querySelector(".chip-body").innerHTML = `<p class="wx-line">코스 시간(${state.depart}~${toHHMM(toM)}) 예보: ${em(icon)} <b>${label}</b> · ${w.tmin === w.tmax ? `${w.tmin}℃` : `${w.tmin}~${w.tmax}℃`}${w.rain ? ` · 비 ${w.rain}mm` : ""} · 바람 ${w.wind}m/s</p>
    ${autoOn ? `<div class="wx-rain"><p>비가 와서 실내 위주로 짰어요.</p><button class="ghost" id="wxMix">${em("🤷")} 골고루로 되돌리기</button></div>` : ""}
    ${rainy && rainNoIndoor.has(rainKey()) ? `<p class="wx-tip">비 소식이 있어요. 이 조건엔 실내 장소가 모자라 야외 장소가 ${outdoor}곳 들어 있어요. 우산을 챙겨 주세요.</p>` : ""}
    ${rainy && !rainNoIndoor.has(rainKey()) ? `<div class="wx-rain"><p>비 소식이 있어요. 야외 장소가 ${outdoor}곳 있어요.</p><button class="primary" id="wxIndoor">${em("☔")} 실내 위주로 다시 짜기</button></div>` : ""}
    ${w.wind >= 9 && coast ? `<p class="wx-tip">바람이 세요(${w.wind}m/s). 바닷가 산책로·해안 절벽에서는 조심하세요.</p>` : ""}`;
  box.hidden = false;
  track("weather_show", { region: REGION.id, wet: wet ? 1 : 0 });
  document.getElementById("wxMix")?.addEventListener("click", () => { rainKept.add(rainKey()); rainAuto = null; state.area = "mix"; state.alt = 0; state.fix = []; state.stay = {}; track("weather_auto_undo", { region: REGION.id }); redo(); });
  document.getElementById("wxIndoor")?.addEventListener("click", () => { state.area = "indoor"; state.alt = 0; state.fix = []; state.stay = {}; track("weather_indoor", { region: REGION.id }); redo(); });
}

// 당일 진행 모드: 여행 날이 오늘이면 지금 시각으로 "지금 어디·다음은 어디"를 1분마다 보여 줘요
// (실제로 어디 있는지는 몰라서 코스 시간표 기준이에요. 늦어지면 ✕로 빼거나 −로 머무는 시간을 줄이게 안내해요)
let liveTimer = null;
const nowKst = () => Math.floor((Date.now() + 9 * 3600e3) / 60000) % 1440;
function startLive(stops, back, start, end, finish) {
  clearInterval(liveTimer);
  const box = document.getElementById("live");
  if (!box) return;
  const name = (p) => esc(p.name ?? p.label ?? "");
  const no = (i) => `<b class="live-no">${i + 1}</b>`;
  const go = (m, from, to) => `${moveText(m)}${routeLink(from, to, m)}`;
  const draw = () => {
    if (!document.body.contains(box)) { clearInterval(liveTimer); return; }
    const now = nowKst(), first = stops[0], firstLeave = first.begin - first.move.min;
    let head, body = "", cur = null;
    if (now < firstLeave) {
      const left = firstLeave - now;
      head = `출발까지 ${left >= 60 ? `${Math.floor(left / 60)}시간 ` : ""}${left % 60}분`;
      body = `${toHHMM(firstLeave)}에 ${name(start)}에서 나서요 → ${no(0)} ${name(first.place)} ${toHHMM(first.begin)} 도착<br><small>${go(first.move, start, first.place)}</small>`;
    } else if (now >= finish) {
      head = "오늘 코스가 끝났어요";
      body = `${end ? `${name(end)}에 ${toHHMM(finish)} 도착 예정이었어요. ` : ""}즐거운 하루였길 바라요!`;
    } else {
      const i = stops.findIndex((s) => now >= s.begin && now < s.leave);
      if (i >= 0) {
        const s = stops[i], next = stops[i + 1], left = s.leave - now;
        cur = i;
        head = `지금은 ${no(i)} ${name(s.place)}`;
        body = `${toHHMM(s.leave)}까지 ${left}분 남았어요.` + (next ? `<br>다음: ${no(i + 1)} ${name(next.place)} ${toHHMM(next.begin)} 도착<br><small>${go(next.move, s.place, next.place)}</small>`
          : back ? `<br>다음: ${name(end)}(으)로 ${toHHMM(finish)} 도착<br><small>${go(back, s.place, end)}</small>` : "");
      } else {
        const k = stops.findIndex((s) => now < s.begin), to = k >= 0 ? stops[k] : null, from = k > 0 ? stops[k - 1].place : k === 0 ? start : stops[stops.length - 1].place;
        cur = k >= 0 ? k : null;
        head = to ? `${no(k)} ${name(to.place)}(으)로 가는 중` : `${name(end)}(으)로 가는 중`;
        body = to ? `${toHHMM(to.begin)} 도착 예정<br><small>${go(to.move, from, to.place)}</small>` : back ? `${toHHMM(finish)} 도착 예정<br><small>${go(back, from, end)}</small>` : "";
      }
    }
    const bus = /버스|호선|지하철/.test(body) ? `<p class="live-tip">버스·지하철 시간은 평균이에요. 실제 도착은 "길찾기"(카카오맵)에서 확인해 주세요.</p>` : "";
    box.innerHTML = `<p class="live-head">${em("🟢")} 오늘 진행 · ${toHHMM(now)}</p><p class="live-now">${head}</p>${body ? `<p class="live-body">${body}</p>` : ""}${bus}
      ${now < finish ? `<p class="live-tip">늦어지면 장소 옆 ✕로 한 곳을 빼거나, −로 머무는 시간을 줄여 보세요.</p>` : ""}`;
    // 지금·다음 장소를 표시해요
    screen.querySelectorAll(".timeline .stop").forEach((li, j) => li.classList.toggle("now", j === cur));
  };
  draw();
  liveTimer = setInterval(draw, 60000);
  track("live_view", { region: REGION.id });
}

// 캘린더 내보내기: 장소마다 일정 하나씩 .ics 파일로 받아요 (휴대폰에서 열면 캘린더에 넣을지 물어봐요)
function icsTime(date, min) {
  const [y, m, d] = date.split("-").map(Number);
  return new Date(Date.UTC(y, m - 1, d) - 9 * 3600e3 + min * 60e3).toISOString().replace(/[-:]/g, "").replace(/\.\d{3}/, "");
}
const icsText = (t) => String(t).replace(/\\/g, "\\\\").replace(/;/g, "\\;").replace(/,/g, "\\,").replace(/\r?\n/g, "\\n");
// 한 줄이 길면 75바이트마다 접어요 (캘린더 파일 규칙)
function icsFold(line) {
  const out = []; let cur = "", bytes = 0;
  for (const ch of line) { const b = new TextEncoder().encode(ch).length; if (bytes + b > 73) { out.push(cur); cur = " "; bytes = 1; } cur += ch; bytes += b; }
  return [...out, cur].join("\r\n");
}
function moveText(m) {
  if (!m) return "";
  if (m.walkToCar) return `세워 둔 차까지 걸어서 ${m.walkToCar}분 → 차로 약 ${m.min - m.walkToCar}분`;
  return `${m.text} 약 ${m.min}분${m.plan ? ` (${busSteps(m.plan).replace(/<[^>]+>/g, "").replace(/&amp;/g, "&")})` : ""}`;
}
function downloadIcs(c) {
  const stamp = new Date().toISOString().replace(/[-:]/g, "").replace(/\.\d{3}/, "");
  const lines = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//swimpyonote.com//쉼표 코스//KO", "CALSCALE:GREGORIAN", "METHOD:PUBLISH", `X-WR-CALNAME:${icsText(`쉼,표 ${REGION.name} 코스`)}`];
  c.stops.forEach((s, i) => {
    const desc = [s.place.desc, `가는 길: ${moveText(s.move)}`, s.place.kakaoId ? `카카오맵: ${placeUrl(s.place)}` : "", `코스 보기: ${location.href}`].filter(Boolean).join("\n");
    lines.push("BEGIN:VEVENT", `UID:${state.date}-${s.place.id}-${i}@swimpyonote.com`, `DTSTAMP:${stamp}`,
      `DTSTART:${icsTime(state.date, s.begin)}`, `DTEND:${icsTime(state.date, s.leave)}`,
      `SUMMARY:${icsText(`${i + 1}. ${s.place.name}`)}`, `LOCATION:${icsText(s.place.name)}`, `DESCRIPTION:${icsText(desc)}`,
      ...(s.place.lat != null ? [`GEO:${s.place.lat};${s.place.lng}`] : []), "END:VEVENT");
  });
  lines.push("END:VCALENDAR");
  const blob = new Blob([lines.map(icsFold).join("\r\n") + "\r\n"], { type: "text/calendar;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `쉼표-${REGION.name.replace(/[·\s]/g, "")}-${state.date}.ics`;
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  const msg = document.getElementById("shareMsg");
  if (msg) msg.textContent = "캘린더 파일을 받았어요. 파일을 열면 캘린더에 넣을지 물어봐요.";
}

// 공유: 카카오톡 카드로 보내기(위 버튼) / 링크 복사·다른 앱(아래 버튼)
let lastCourse = null;
// 카카오톡 공유 (카카오 JavaScript SDK). 누를 때만 불러와요
let kakaoShareLoading = null;
function loadKakaoShare() {

    const js = document.createElement("script");
    js.src = "https://t1.kakaocdn.net/kakao_js_sdk/2.7.4/kakao.min.js";
    js.crossOrigin = "anonymous";
    js.onload = () => { try { if (!Kakao.isInitialized()) Kakao.init(KAKAO_JS_KEY); ok(); } catch (e) { fail(e); } };
    js.onerror = () => { kakaoShareLoading = null; js.remove(); fail(); };

  });

}
// 공유 카드 글: "한림·협재 뚜벅이 6시간 코스 · 4곳 · 1명 4.6만 원"처럼 코스마다 달라요
const roughWon = (n) => n >= 10000 ? `${Math.round(n / 1000) / 10}만 원` : `${n.toLocaleString("ko-KR")}원`;
function shareText(c = lastCourse) {
  const who = WHO.find((w) => w.id === state.who), how = HOW.find((h) => h.id === state.how);
  const span = hubOf() ? "하루" : hoursText(state.hours);
  const title = `${REGION.name} ${how.label} ${span} 코스`;
  const facts = `${who.label} · ${c.stops.length}곳 · 1명 ${c.costUnknown ? "약 " : ""}${roughWon(c.spent)}`;

const KAKAO_JS_KEY = "24a227a071d26f461b54920162fe52f0";

const smallDogOnly = (p) => !!p.dogRule && !/^(목줄|리드줄)/.test(p.dogRule) && /케이지|유모차|이동가방|이동장|캐리어|펫 카트|애견가방|소형견|kg|안아|안거나|안고/.test(p.dogRule);
// 이동 수단 종류 (지도 선 모양과 범례에 써요)
const legKind = (m) => /걸어/.test(m.text) ? "walk" : m.plan || /버스|호선|지하철|갈아타기/.test(m.text) ? "transit" : /자전거/.test(m.text) ? "bike" : "car";
const LEG_STYLE = {
  walk: { style: "shortdot", weight: 4, opacity: 0.95, label: "걸어서" },
  transit: { style: "solid", weight: 5, opacity: 0.85, label: "버스·지하철" },
  car: { style: "solid", weight: 3, opacity: 0.6, label: "차·택시" },
  bike: { style: "shortdash", weight: 4, opacity: 0.9, label: "자전거" }
};
const LEG_MARK = { walk: "┈┈", transit: "━━", car: "──", bike: "╌╌" };
// 버스 정류장 위치 (tools/bus-stops.js가 만든 regions/<id>/stops.json). 없거나 못 받으면 곧은 선으로 그려요
const busStopCache = {};
async function loadBusStops() {
  const id = REGION.id;
  if (busStopCache[id]) return busStopCache[id];
  try { const r = await fetch(`regions/${id}/stops.json?v=${REGION_VERSION}`); busStopCache[id] = r.ok ? (await r.json()).stops ?? {} : {}; }
  catch { busStopCache[id] = {}; }
  return busStopCache[id];
}
async function drawMap(points, n, legs) {
  mapView = null;
  const box = document.getElementById("map");
  box.classList.add("loading");
  setTimeout(() => box.classList.remove("loading"), 8000); // 바탕 불러오기 소식이 안 와도 8초 뒤엔 걷어요
  try { await loadKakaoMap(); } catch { box.hidden = true; return; }
  if (!document.body.contains(box)) return; // 그새 다른 화면으로 넘어갔어요
  const at = (p) => new kakao.maps.LatLng(p.lat, p.lng);
  const map = new kakao.maps.Map(box, { center: at(points[0]), level: 8 });
  // 폰에서는 지도 위를 밀어도 페이지가 내려가게 지도 끌기를 막고, 확대·축소 버튼을 둬요
  if (matchMedia("(pointer: coarse)").matches) map.setDraggable(false);
  map.setZoomable(false);
  map.addControl(new kakao.maps.ZoomControl(), kakao.maps.ControlPosition.RIGHT);
  // 카카오 지도의 확대·축소 버튼은 title만 있어서 화면 읽기 프로그램용 이름을 붙여요
  box.querySelectorAll("button[title]:not([aria-label])").forEach((b) => b.setAttribute("aria-label", `지도 ${b.title}`));
  // 출발한 곳으로 돌아오면 '출발·끝' 핀 하나로 합쳐요
  const loop = points.length > 2 && points[0] === points[points.length - 1];
  const accent = getComputedStyle(document.documentElement).getPropertyValue("--accent").trim();
  // 선은 구간마다 이동 수단에 맞게: 걸어서는 점선, 버스·지하철은 굵은 실선, 차·택시는 얇은 실선, 자전거는 짧은 줄 (실제 길이 아니라 곧은 선이에요)
  // 버스·지하철 구간은 정류장 위치를 알면 "걸어서 → 타는 곳 → (갈아타는 곳) → 내리는 곳 → 걸어서"로 나눠 그리고 정류장을 작게 찍어요
  const busStops = legs?.some((m) => m.plan) ? await loadBusStops() : {};
  if (!document.body.contains(box)) return;
  const line = (a, b, kind) => { const st = LEG_STYLE[kind]; new kakao.maps.Polyline({ map, path: [at(a), at(b)], strokeWeight: st.weight, strokeColor: accent, strokeOpacity: st.opacity, strokeStyle: st.style }); };
  const stopPins = [];
  const stopAt = (name) => { const c = busStops[name]; return c ? { lat: c[0], lng: c[1], name } : null; };
  if (legs && legs.length === points.length - 1) legs.forEach((m, k) => {
    const a = points[k], b = points[k + 1];
    const c = m.plan ? m.plan.split("|") : null;
    const hops = c ? (c.length === 5 ? [[c[1], c[3]]] : [[c[1], c[3]], [c[5], c[6]]]).map(([x, y]) => [stopAt(x), stopAt(y)]) : null;
    if (!hops || hops.some(([x, y]) => !x || !y)) return line(a, b, legKind(m));
    let here = a;
    for (const [on, off] of hops) {
      line(here, on, "walk"); line(on, off, "transit");
      stopPins.push(on, off); here = off;
    }
    line(here, b, "walk");
  });
  else new kakao.maps.Polyline({ map, path: points.map(at), strokeWeight: 3, strokeColor: accent, strokeOpacity: 0.9, strokeStyle: "shortdash" });
  // 정류장 표시 (같은 이름은 한 번만). 순서 핀보다 아래에 깔아요
  const seenStop = new Set();
  for (const p of stopPins) {
    if (seenStop.has(p.name)) continue;
    seenStop.add(p.name);
    const el = document.createElement("span");
    el.className = "bus-stop"; el.textContent = "🚏"; el.title = p.name;
    el.setAttribute("aria-label", `정류장 ${p.name}`);
    new kakao.maps.CustomOverlay({ map, position: at(p), content: el, yAnchor: 0.5, zIndex: 1 });
  }
  // 지도 바탕이 다 불러와지면 "불러오는 중" 표시를 걷어요
  kakao.maps.event.addListener(map, "tilesloaded", () => box.classList.remove("loading"));
  // 핀: i = 순서(0 = 출발, n+1 = 끝)
  const pins = points.map((p, i) => ({ i, p, pos: at(p), label: i === 0 ? (loop ? "출발·끝" : "출발") : i <= n ? String(i) : "끝" }))
    .filter((x) => !(loop && x.i === points.length - 1));
  const bounds = new kakao.maps.LatLngBounds();
  pins.forEach((x) => bounds.extend(x.pos));
  // 화면에서 30px보다 가까운 핀은 "4·5·6"처럼 하나로 합치고, 누르면 그 자리로 확대해요
  let overlays = [], picked = null;
  const layout = () => {
    overlays.forEach((o) => o.setMap(null)); overlays = [];
    const proj = map.getProjection();
    const groups = [];
    for (const x of pins) {
      const pt = proj.containerPointFromCoords(x.pos);
      const g = groups.find((g) => Math.hypot(g.pt.x - pt.x, g.pt.y - pt.y) < 30);
      if (g) g.items.push(x); else groups.push({ pt, items: [x] });
    }
    for (const g of groups) {
      const el = document.createElement("span");
      const names = g.items.map((x) => `${x.label} ${x.p.name}`).join(", ");
      el.className = "pin" + (g.items.length > 1 ? " group" : "") + (g.items.some((x) => x.i === picked) ? " on" : "");
      // 넷 이상 겹치면 "출발 외 5"처럼 줄여요 (눌러서 확대하면 나뉘어요)
      el.textContent = g.items.length > 3 ? `${g.items[0].label} 외 ${g.items.length - 1}` : g.items.map((x) => x.label).join("·");
      el.title = g.items.map((x) => x.p.name).join(", ");
      el.setAttribute("aria-label", g.items.length > 1 ? `${names}. 눌러서 확대` : names);
      if (g.items.length > 1) {
        el.setAttribute("role", "button");
        el.onclick = () => {
          const b = new kakao.maps.LatLngBounds();
          g.items.forEach((x) => b.extend(x.pos));
          map.setBounds(b, 60, 60, 60, 60);
          if (map.getLevel() > 1 && g.items.every((x) => x.p.lat === g.items[0].p.lat && x.p.lng === g.items[0].p.lng)) map.setLevel(1);
        };
      }
      overlays.push(new kakao.maps.CustomOverlay({ map, position: g.items[0].pos, content: el, yAnchor: 0.5, zIndex: g.items.some((x) => x.i === picked) ? 3 : 2 }));
    }
  };
  kakao.maps.event.addListener(map, "zoom_changed", layout);
  let lastW = box.clientWidth, lastH = box.clientHeight;
  new ResizeObserver(() => {
    if (box.clientWidth === lastW && box.clientHeight === lastH) return;
    lastW = box.clientWidth; lastH = box.clientHeight;
    map.relayout(); map.setBounds(bounds, 32, 32, 32, 32); layout();
  }).observe(box);
  map.setBounds(bounds, 32, 32, 32, 32);
  layout();
  mapView = {
    focus(i) {
      const x = pins.find((x) => x.i === i);
      if (!x) return;
      picked = i;
      map.setLevel(Math.min(map.getLevel(), 4));
      map.panTo(x.pos);
      layout();
    }
  };
}

// 버스 타는 법: "걸어서 1분 → 제주국제공항4에서 102번 → 애월고등학교에서 내려 걸어서 10분"
function busSteps(plan) {
  const c = plan.split("|");
  const walk = (m) => (Number(m) > 1 ? `걸어서 ${m}분` : "바로");
  if (c.length === 5) {
    const [no, from, w1, to, w2] = c;
    return `${walk(w1)} → ${esc(from)}에서 ${esc(lineName(no))} → ${esc(to)}에서 내려 ${walk(w2)}`;
  }
  const [no, from, w1, mid, no2, from2, to, w2] = c;
  return `${walk(w1)} → ${esc(from)}에서 ${esc(lineName(no))} → ${esc(mid)}에서 내려 ${esc(from2)}에서 ${esc(lineName(no2))} → ${esc(to)}에서 내려 ${walk(w2)}`;
}

// 이동이 전체 시간의 절반을 넘으면, 더 가까운 출발지나 택시로 바꿨을 때 몇 곳 갈 수 있는지 알려 줘요
function movingTip(stops, back, used) {
  const moving = stops.reduce((sum, s) => sum + s.move.min, 0) + (back?.min ?? 0);
  if (moving * 2 <= used) return "";
  const tryWith = (change) => {
    const saved = { ...state }; Object.assign(state, change, { alt: 0, fix: [], stay: {} });
    const c = makeCourse(); Object.assign(state, saved); return c.stops.length;
  };
  const tips = [];
  if (state.how === "walk" || state.how === "bike") {
    const n = tryWith({ how: "any" });
    if (n > stops.length) tips.push(`이동을 "상관없어요"(택시·차)로 바꾸면 ${n}곳`);
  }
  // 코스 가운데에서 가까운 동네 셋만 출발지로 바꿔 봐요
  const mid = { lat: stops.reduce((a, s) => a + s.place.lat, 0) / stops.length, lng: stops.reduce((a, s) => a + s.place.lng, 0) / stops.length };
  const near = STARTS.filter((s) => s.emoji === "🏠" && s.id !== state.from)
    .sort((a, b) => Math.hypot(a.lat - mid.lat, a.lng - mid.lng) - Math.hypot(b.lat - mid.lat, b.lng - mid.lng)).slice(0, 3);
  let best = null;
  for (const s of near) { const n = tryWith({ from: s.id }); if (n > stops.length && (!best || n > best.n)) best = { s, n }; }
  if (best) tips.push(`${esc(best.s.label)}에서 출발하면 ${best.n}곳`);
  return `이동이 ${Math.floor(moving / 60) ? `${Math.floor(moving / 60)}시간 ` : ""}${moving % 60}분으로 전체 시간의 절반이 넘어요.${tips.length ? ` ${tips.join(", ")}까지 갈 수 있어요.` : " 출발지를 가까운 동네로 바꾸거나 다른 구역을 골라 보세요."}`;
}

// 카카오맵 길찾기: 앞 장소 → 이 장소. 걸어서면 도보, 뚜벅이는 대중교통, 차·택시는 자동차, 자전거는 자전거로 열어요
function routeLink(from, to, m) {
  if (!from || !to || from.lat == null || to.lat == null) return "";
  const by = m.text === "걸어서" ? "walk" : state.how === "walk" ? "traffic" : state.how === "bike" ? "bicycle" : "car";
  const pt = (p) => `${encodeURIComponent(String(p.name).replace(/,/g, " "))},${p.lat},${p.lng}`;
  return `<a class="route" href="https://map.kakao.com/link/by/${by}/${pt(from)}/${pt(to)}" target="_blank" rel="noopener" data-map="route" aria-label="${esc(to.name)}까지 카카오맵 길찾기">길찾기</a>`;
}

function renderResult() {
  const { stops, spent, fares, back, finish, unknownSkipped, noLocation, count, pool, fixed, glow: glowPlace } = makeCourse();
  const moveLine = (m, from, to) => m.walkToCar ? `<li class="move">세워 둔 차까지 걸어서 ${m.walkToCar}분 → 차로 약 ${m.min - m.walkToCar}분${routeLink(m.carFrom, to, m)}<small class="sub-line">차는 ${esc(m.carFrom.name ?? m.carFrom.label ?? "앞에 세운 곳")}에 세워 뒀어요</small></li>`
    : `<li class="move">${m.text} 약 ${m.min}분${m.fare ? ` · ${m.text === "택시로" ? "약 " : ""}${won(m.fare)}` : ""}${routeLink(from, to, m)}${m.plan ? `<small class="sub-line">${busSteps(m.plan)}</small>` : ""}</li>`;
  const costUnknown = stops.filter((s) => s.place.cost === null).length;
  const who = WHO.find((w) => w.id === state.who), how = HOW.find((h) => h.id === state.how);
  const used = finish - toMin(state.depart);
  // 노을까지 보기면 끝나는 시각이 해 지는 시각에 맞춰져서 "시간이 남아요"는 보여 주지 않아요
  const left = glowOn() ? 0 : toMin(state.depart) + state.hours * 60 - airportBuffer() - finish;
  const start = startPoint(), end = endPoint();

  const explain = stops.length ? explainCourse(stops, back) : [];

  const caution = NEED[state.who] ? explain.shift() : null;
  // 반려견: 작은 개만 되는 곳(이동가방·케이지·안고 들어가기·무게 제한)이 몇 곳인지 위에서 먼저 알려 줘요
  // (목줄·야외 자리만 같은 조건은 크기와 상관없어서 장소 배지에만 보여요)
  const dogRuled = state.who === "dog" ? stops.map((s) => s.place).filter((p) => p.dog && smallDogOnly(p)) : [];
  let emptyWhy = null, fixes = [];
  // 일찍 끝나면 코스가 더 길어지는 대안을 버튼으로 (실내 장소가 모자랄 때 등)
  const early = stops.length && left > 60 && stops.length < maxStops();
  if (early) fixes = leftFixes(stops.length);
  const leftHM = `${Math.floor(left / 60) ? `${Math.floor(left / 60)}시간 ` : ""}${left % 60 ? `${left % 60}분` : ""}`.trim();

  // 반려견과 버스·지하철을 타는 코스면 이동장 안내
  const dogBus = state.who === "dog" && state.how === "walk" && [...stops.map((s) => s.move), back].some((m) => m?.plan);
  // 안내문은 한 줄 칩으로 접어 두고 누르면 펼쳐요 (모바일에서 코스가 먼저 보이게)
  const notices = !stops.length ? [] : [
    left > 60 && { icon: "⏳", cls: "left-time", text: `시간이 ${leftHM} 남아요. ${stops.length >= maxStops() ? `쉬엄쉬엄 다니도록 ${maxStops()}곳까지만 넣었어요. 마음에 드는 곳에서 더 머물러 보세요.` : `조건에 맞는 곳을 다 넣어서 일찍 끝나요.${fixes.length ? " 이렇게 바꾸면 더 넣을 수 있어요." : ` 시간을 줄이거나 "누구랑"·"어디 위주"를 바꿔 보세요.`}`}${early && fixes.length ? `<span class="fixes">${fixes.map((f, i) => `<button class="ghost" data-fix="${i}">${f.label}</button>`).join("")}</span>` : ""}` },
    longMove && { icon: "🚌", text: longMove },
    dogBus && { icon: "🐶", text: DOG_TRANSIT },
    caution && { icon: { dog: "🐶", kid: "👶", wheel: "♿" }[state.who] ?? "⚠️", text: caution },

  screen.innerHTML = `<div class="result${stops.length ? " has-map" : ""}"><div class="r-head">

    ${glowReady() ? `<button class="ghost glow-btn" id="glowBtn" aria-pressed="${glowOn()}">${em("🌅")} ${glowOn() ? "노을까지 보는 중 · 끄기" : "노을까지 보기"}</button>` : ""}
    ${glowOn() && stops.length && !stops.some((s) => seesSunset(s.place, s.begin, s.leave)) ? `<p class="caution">해 질 무렵에 갈 수 있는 노을 명소가 이 조건에선 없어요.</p>` : ""}
    ${stops.length ? `
      <div class="summary">

        <div><b>${costUnknown ? "약 " : ""}${spent.toLocaleString("ko-KR")}원</b><span>1명 비용${costUnknown ? "(추정 포함)" : ""}</span></div>
      </div>
      ${fares ? `<p class="fare-line">교통비 ${won(fares)} 포함${state.how === "any" && state.people > 1 ? ` (택시비는 ${state.people}명이 나눈 1명 몫)` : ""}</p>` : ""}
      ${stops.length && state.date === kstToday() ? `<section class="live" id="live" aria-live="polite" aria-label="오늘 진행 상황"></section>` : ""}

        <li class="endpoint">${em("🏁")} ${toHHMM(finish)} ${end ? `${esc(end.name)} 도착` : "코스 끝"}${hubOf() ? `<small class="sub-line">${hubOf().ride} ${toHHMM(toMin(state.depart) + Math.round(state.hours * 60))} 출발에 맞춰 ${hubOf().bufferLabel} 일찍 도착해요</small>` : ""}</li>

      ${mustBar()}<div class="empty">${emptyMessage(emptyWhy = whyEmpty())}${(fixes = emptyFixes()).length ? `<p class="fix-title">이렇게 바꾸면 코스가 나와요</p><div class="fixes">${fixes.map((f, i) => `<button class="ghost" data-fix="${i}">${f.label}</button>`).join("")}</div>` : ""}</div></div><div class="r-rest">`}
    <details class="notes"><summary>참고할 점 (자료 기준일·출처)</summary>

      <p>• 이동 시간은 실제 길 기준이에요.${state.how !== "walk" ? " 막히는 길은 반영되지 않아요." : (REGION.subway ? " 지하철·버스는 평균 배차 간격으로 기다리는 시간까지 넣은 어림이에요(실시간 도착 정보는 아니에요). 버스는 막히면 더 걸릴 수 있어요." : " 버스는 시간표의 평균 배차 간격으로 기다리는 시간까지 넣었어요(실시간 도착 정보는 아니에요).")}${state.how === "ev" ? " 충전 시간은 따로 넣지 않았어요. 충전소가 가까운 곳에서 오래 머물게 짰으니 그동안 충전해 두세요." : ""}${state.how === "car" || state.how === "ev" ? " 차로 다니는 시간에는 주차 5분을 넣었어요. 걸어서 10분 안의 가까운 곳은 차를 세워 두고 걸어가게 짰고, 다시 차를 탈 때는 차까지 걸어가는 시간도 넣었어요. 렌터카 요금·기름값(충전비)·주차비는 비용에 넣지 않았어요." : ""} ${state.from === "here" ? "내 위치에서 첫 장소까지는 직선거리로 어림했어요. " : ""}지도의 선은 순서만 보여 주는 직선이에요.
        (길 데이터 © OpenStreetMap · ${REGION.router ?? "openrouteservice.org"}${state.how === "walk" ? (REGION.subway ? " · 버스 국토교통부 TAGO · 지하철 부산교통공사" : ` · 버스 국토교통부 TAGO · 제주버스정보시스템${state.who === "wheel" ? " · 제주특별자치도 저상버스 운행노선 현황" : ""}`) : ""})</p>
      ${state.who === "wheel" && (state.how === "walk" || state.how === "any") ? `<p>• 걷는 시간은 보통보다 1.5배 넉넉히 잡았어요.${state.how === "walk" ? (REGION.subway ? " 저상버스·지하철 엘리베이터 자료가 아직 없어 대중교통은 넣지 않았어요." : REGION.noBus ? "" : " 버스는 저상버스가 있는 노선만 넣었어요. 저상버스는 일부 차량만이라 기다리는 시간을 배차 간격만큼 잡았어요. 오는 버스가 저상버스인지는 그때그때 달라요.") : ""}${REGION.area === "제주" ? ` 휠체어를 쓰는 분은 제주 교통약자이동지원센터(행복콜, <a href="tel:18996884">1899-6884</a>, 24시간)의 휠체어 차량을 쓸 수 있어요. 미리 회원등록이 필요해요.` : ""}</p>` : ""}
