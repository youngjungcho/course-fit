      ${fares ? `<p>• 교통비는 어른 1명 기준이에요. ${state.how === "walk" ? (REGION.subway ? "지하철·버스 교통카드 요금으로 어림했어요. 지하철은 1구간 요금 기준이라 멀리 가면 더 나오고, 갈아탈 때는 환승 할인을 받는 것으로 쳤어요. " : "버스는 교통카드 요금이고, 40분 안에 갈아타면 환승 할인으로 따로 내지 않아요. ") : `택시비는 거리로 어림했고, ${state.people}명이 나눠 낸 1명 몫이에요(막힐 때 붙는 요금·밤 11시 이후 할증은 빠졌어요). 4명이 넘으면 택시가 2대 필요할 수 있어요. `}</p>` : ""}
      ${costUnknown ? `<p>• 비용을 모르는 곳 ${costUnknown}곳은 이 지역 같은 종류 장소의 가운데 값으로 어림했어요. 실제와 다를 수 있어요.</p>` : ""}
      ${unknownSkipped ? `<p>• ${{ dog: "반려견", kid: "유모차", wheel: "계단" }[state.who]} 정보가 없는 곳 ${unknownSkipped}곳은 안전하게 뺐어요. 꼭 가고 싶은 곳이 있으면 전화로 확인해 보세요.</p>` : ""}
      ${noLocation ? `<p>• 위치를 아직 모르는 곳 ${noLocation}곳은 코스에서 뺐어요.</p>` : ""}
      <p>• 날씨는 노르웨이 기상청(MET Norway) 예보로, 지역 한가운데 기준이에요(CC BY 4.0). 산 쪽·바닷가는 다를 수 있어요.</p>
      <p>• 방문 통계를 위해 구글 애널리틱스를 써요. <a href="privacy.html">개인정보처리방침</a> · <a href="${footMail("문의")}" data-foot="contact">문의하기</a> · <a href="${footMail("정보 제보")}" data-foot="report">정보가 틀렸어요</a></p>
    </details>
    <div class="r-bottom"><button class="${stops.length ? "ghost" : "primary"}" id="again">조건 바꾸기</button>${stops.length ? `<button class="ghost" id="shareLink">${em("🔗")} 링크 복사·다른 앱</button><button class="ghost" id="toCal">${em("📅")} 캘린더에 넣기</button>` : ""}</div></div>
    ${stops.length ? `<div class="dock">
      <p class="share-msg" id="shareMsg" role="status"></p>
      <div class="actions">
        <button class="ghost kakao" id="shareKakao" aria-label="카카오톡으로 코스 보내기">${em("💬")} 카톡 공유</button>
        <button class="ghost" id="save">${isSaved() ? `${em("⭐")} 저장됨` : `${em("☆")} 저장`}</button>
        ${count > 1 ? `<button class="ghost alt" id="alt" aria-label="다른 코스 보기, ${count}개 중 ${(state.alt % count) + 1}번째">${em("🔄")} ${(state.alt % count) + 1}/${count}</button>` : ""}
      </div>
    </div>` : ""}</div>`;
  trackCourse(stops, emptyWhy);
  document.getElementById("again").onclick = () => goStep(2);
  document.getElementById("glowBtn")?.addEventListener("click", () => { state.glow = !glowOn(); state.alt = 0; state.fix = []; state.stay = {}; track("glow_toggle", { region: REGION.id, on: state.glow ? 1 : 0 }); redo(); });
  // 다시 그린 뒤 포커스를 같은 자리(다음 장소의 '이곳 빼기')나 제목으로 옮겨요
  const redo = (focusIndex = null, focusSel = null) => {
    syncUrl(false); renderResult();
    const skips = screen.querySelectorAll(".skip");
    const again = focusSel && screen.querySelector(focusSel);
    const target = again && !again.disabled ? again : focusIndex !== null && skips.length ? skips[Math.min(focusIndex, skips.length - 1)] : screen.querySelector("h1");
    if (target === screen.querySelector("h1")) { target.tabIndex = -1; window.scrollTo(0, 0); }
    target.focus();
  };
  // 꼭 갈 곳을 "이곳 빼기"하면 꼭 갈 곳에서도 빼요
  // 순서 바꾸기·머무는 시간 조절: 바꾼 코스가 규칙에 맞을 때만 바꾸고, 안 맞으면 이유를 그 장소 아래에 알려 줘요
  const order = stops.map((s) => s.place);
  const tryEdit = (places, stay) => { const saved = state.stay; state.stay = stay; const c = courseFrom(places, pool); const why = c ? null : editWhy(places, pool); state.stay = saved; return { c, why }; };
  const applyEdit = (i, places, stay, focusSel, ev) => {
    const { c, why } = tryEdit(places, stay);
    if (!c) { document.getElementById(`edit-${i}`).textContent = why; track("edit_blocked", { region: REGION.id, kind: ev }); return; }
    state.fix = places.map((p) => p.id); state.stay = stay;
    track(ev, { region: REGION.id }); redo(null, focusSel);
  };
  screen.querySelectorAll(".mv").forEach((b) => { b.onclick = () => {
    const i = Number(b.dataset.i), j = i + Number(b.dataset.d), places = [...order];
    [places[i], places[j]] = [places[j], places[i]];
    applyEdit(i, places, { ...state.stay }, `.mv[data-i="${j}"][data-d="${b.dataset.d}"]`, "edit_order");
  }; });
  screen.querySelectorAll(".st").forEach((b) => { b.onclick = () => {
    const i = Number(b.dataset.i), p = order[i], m = Math.min(STAY_MAX, Math.max(STAY_MIN, stayOf(p) + Number(b.dataset.d) * STAY_STEP));
    const stay = { ...state.stay, [p.id]: m };
    if (m === p.stayMin) delete stay[p.id]; // 처음 값으로 돌아오면 지워요
    applyEdit(i, order, stay, `.st[data-i="${i}"][data-d="${b.dataset.d}"]`, "edit_stay");
  }; });
  // ✕: 바로 빼지 않고 그 자리에 갈 만한 비슷한 곳 3개를 먼저 보여 줘요 ("그냥 빼기"도 있어요)
  const justSkip = (id, i) => { state.must = state.must.filter((x) => x !== id); if (!state.skip.includes(id)) state.skip.push(id); state.alt = 0; state.fix = []; state.stay = {}; redo(i); };
  screen.querySelectorAll(".skip").forEach((b) => { b.onclick = () => {
    const i = Number(b.dataset.i), panel = document.getElementById(`swap-${i}`);
    if (!panel.hidden) { panel.hidden = true; b.setAttribute("aria-expanded", "false"); return; }
    const opts = swapOptions(stops, back, i, pool);
    const old = stops[i].place, movingNow = stops.reduce((m, s) => m + s.move.min, 0) + (back?.min ?? 0);
    panel.innerHTML = `<p class="swap-title">${esc(old.name)} 대신 갈 만한 곳${opts.length && !opts[0].same ? " (다른 종류)" : ""}</p>
      ${opts.length ? `<ul class="swap-list">${opts.map((o, k) => {
        const d = o.moving - movingNow, s2 = o.c.stops[i];
        return `<li><button class="swap-pick" data-k="${k}">${em(TYPE_ICON[o.place.type] ?? "📍")} <span><b>${esc(o.place.name)}</b><small>${o.place.desc ? `${esc(o.place.desc)} · ` : ""}${toHHMM(s2.begin)} 도착 · 이동 ${d > 0 ? `${d}분 늘어요` : d < 0 ? `${-d}분 줄어요` : "그대로"}${o.place.cost !== null && o.place.cost !== old.cost ? ` · ${costLabel(o.place)}` : ""}</small></span></button></li>`;
      }).join("")}</ul>` : `<p class="caution">이 자리에 넣을 수 있는 비슷한 곳이 없어요. 시간·운영시간·예산이 맞는 곳이 없어서예요.</p>`}
      <div class="swap-actions"><button class="ghost" data-just>이곳 그냥 빼기</button><button class="link" data-close>닫기</button></div>`;
    panel.hidden = false; b.setAttribute("aria-expanded", "true");
    track("swap_open", { region: REGION.id, place: old.id, options: opts.length });
    panel.querySelectorAll(".swap-pick").forEach((pb) => { pb.onclick = () => {
      const o = opts[Number(pb.dataset.k)];
      // 뺀 곳(skip)에는 넣지 않아요: "처음 코스로"를 누르면 원래 코스가 그대로 돌아와요
      state.must = state.must.filter((x) => x !== old.id);
      state.fix = o.c.stops.map((s) => s.place.id);
      track("swap_pick", { region: REGION.id, from: old.id, to: o.place.id });
      redo(i);
    }; });
    panel.querySelector("[data-just]").onclick = () => { track("swap_skip", { region: REGION.id, place: old.id }); justSkip(old.id, i); };
    panel.querySelector("[data-close]").onclick = () => { panel.hidden = true; b.setAttribute("aria-expanded", "false"); b.focus(); };
    panel.querySelector("button")?.focus();
  }; });
  bindMust(redo);
  screen.querySelectorAll("[data-fix]").forEach((b) => { b.onclick = () => { const f = fixes[b.dataset.fix]; Object.assign(state, f.change, { alt: 0, fix: [], stay: {} }); track(stops.length ? "left_fix" : "empty_fix", { region: REGION.id, fix: f.key }); redo(); }; });
  document.getElementById("unfix")?.addEventListener("click", () => { state.fix = []; state.stay = {}; track("swap_reset", { region: REGION.id }); redo(); });
  document.getElementById("unskip")?.addEventListener("click", () => { state.skip = []; state.alt = 0; state.fix = []; state.stay = {}; redo(); });
  document.getElementById("alt")?.addEventListener("click", () => { state.alt = (state.alt + 1) % count; state.fix = []; state.stay = {}; track("course_alt", { region: REGION.id }); redo(); });
  document.getElementById("shareKakao")?.addEventListener("click", shareKakao);
  document.getElementById("shareLink")?.addEventListener("click", shareLink);
  lastCourse = { stops, spent, used, costUnknown, back, start, end };
  document.getElementById("toCal")?.addEventListener("click", () => { downloadIcs(lastCourse); track("calendar_export", { region: REGION.id }); });
  // 브라우저 탭·즐겨찾기 제목도 코스에 맞춰요 (다른 화면으로 가면 원래 제목으로 돌아가요)
  document.title = stops.length ? `${shareText().line} | 쉼,표` : BASE_TITLE;
  if (stops.length) drawWeather(stops, finish, redo);
  if (stops.length) startLive(stops, back, start, end, finish);
  // 비 때문에 실내로 바꿨는데 실내 코스가 없으면 골고루로 되돌려요
  else if (state.area === "indoor" && rainAuto === rainKey()) { rainKept.add(rainKey()); rainNoIndoor.add(rainKey()); rainAuto = null; state.area = "mix"; state.alt = 0; state.fix = []; state.stay = {}; redo(); return; }
  document.getElementById("save")?.addEventListener("click", (e) => {
    const on = toggleSaved(stops);
    e.currentTarget.innerHTML = on ? `${em("⭐")} 저장됨` : `${em("☆")} 저장`;
    document.getElementById("shareMsg").textContent = on ? "이 휴대폰(브라우저)에 저장했어요. 위의 \"내 코스\"에서 다시 볼 수 있어요." : "저장을 지웠어요.";
  });
  if (stops.length) drawMap([start, ...stops.map((s) => s.place), ...(end ? [end] : [])], stops.length, [...stops.map((s) => s.move), ...(end && back ? [back] : [])]);
  // 장소 카드의 번호를 누르면 지도가 그 장소로 가요
  screen.querySelectorAll("button.no").forEach((b) => { b.onclick = () => focusOnMap(Number(b.dataset.stop)); });
  screen.querySelectorAll("a[data-map]").forEach((a) => { a.addEventListener("click", () => track("map_open", { region: REGION.id, map: a.dataset.map })); });
  bindFoot();
  screen.querySelectorAll("a[data-report]").forEach((a) => { a.addEventListener("click", () => track("report_click", { region: REGION.id, place: a.dataset.report })); });
}

// ----- 시작 -----
// 처음 열 때: 주소에 담긴 조건을 읽어요. 공유 링크로 바로 결과가 열려도 기록은 하나만 둬요
// (카톡에서 연 사람이 뒤로가기 한 번에 카톡으로 돌아가요. 앞 단계는 '← 이전' 버튼으로)
// 짧은 오프닝: 처음 들어온 사람에게 한 번만 보여 줘요 (공유 링크로 바로 들어오면 건너뛰어요)
function showSplash() {
  try { if (sessionStorage.getItem("splash")) return; sessionStorage.setItem("splash", "1"); } catch {}
  const s = document.createElement("div");
  s.className = "splash"; s.setAttribute("aria-hidden", "true");
  s.innerHTML = `<svg width="72" height="72" viewBox="0 0 100 100"><rect width="100" height="100" rx="22" fill="#fff" fill-opacity=".15"/><circle cx="68" cy="36" r="16" fill="#f2a541"/><path d="M0 66 Q25 56 50 66 T100 66 V100 H0Z" fill="#e3f1ea"/></svg>
    <b>쉼,표</b><p>잠깐 멈춰가는 하루<br>누구랑, 어떻게 가는지 고르면 코스를 짜 드려요</p>`;
  document.body.append(s);
  // 짧게 보여 주고 빠르게 걷어요 (천천히 사라지면 아래 화면과 겹쳐 보여서 어수선해요)
  const hide = () => { s.classList.add("hide"); setTimeout(() => s.remove(), 200); };
  s.onclick = hide;
  setTimeout(hide, 1000);
}
async function boot() {
  const q = new URLSearchParams(location.search);
  // 지역이 없는데 조건이 들어 있는 예전 링크는 애월로 열어요
  const old = !q.get("region") && [...q.keys()].some((k) => Object.values(URL_KEYS).includes(k) || k === "step");
  const id = REGIONS.some((r) => r.id === q.get("region")) ? q.get("region") : old ? REGIONS[0].id : null;
  if (id) {
    try { applyRegion(REGIONS.find((r) => r.id === id), await loadRegionData(id)); } catch { return showLoadError(id); }
  }
  readQuery();
  history.replaceState({ step: state.step, depth: 0 }, "", `${location.pathname}${queryOf() ? `?${queryOf()}` : ""}`);
  render();
  if (state.step === PICK) showSplash();
  // 오프라인용 저장 (sw.js)
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
}
boot();
</script>
</body>
</html>
