<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>여행 코스 · 내 조건에 맞춰</title>
<meta name="description" content="반려견·유모차·휠체어·혼자, 뚜벅이·자전거·전기차. 누구랑 어떻게 다니는지 고르면 하루 코스를 짜 드려요. 운영시간·버스·교통비까지 따져요.">
<meta property="og:type" content="website">
<meta property="og:title" content="여행 코스 · 내 조건에 맞춰">
<meta property="og:description" content="누구랑, 어떻게, 몇 시간 — 고르면 하루 코스가 나와요.">
<meta property="og:url" content="https://youngjungcho.github.io/course-fit/">
<meta property="og:image" content="https://youngjungcho.github.io/course-fit/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:locale" content="ko_KR">
<meta name="twitter:card" content="summary_large_image">

<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%231f7a5a'/><circle cx='68' cy='36' r='16' fill='%23f2a541'/><path d='M0 66 Q25 56 50 66 T100 66 V100 H0Z' fill='%23e3f1ea'/></svg>">
<style>
  :root {
    --bg: #f6f4ef;
    --card: #ffffff;
    --text: #1f2421;
    --muted: #6b716d;
    --line: #e2ded5;
    --accent: #1f7a5a;
    --accent-soft: #e3f1ea;
    --warn: #9a5b00;
    --warn-soft: #fff1d6;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #161917;
      --card: #20241f;
      --text: #eceee9;
      --muted: #a2a8a3;
      --line: #343a35;
      --accent: #5fc79d;
      --accent-soft: #1d3329;
      --warn: #f2c26b;
      --warn-soft: #3a2d14;
    }
  }
  :root[data-theme="dark"] {
    --bg: #161917; --card: #20241f; --text: #eceee9; --muted: #a2a8a3;
    --line: #343a35; --accent: #5fc79d; --accent-soft: #1d3329;
    --warn: #f2c26b; --warn-soft: #3a2d14;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    font-size: 17px;
    line-height: 1.55;
    word-break: keep-all;
    -webkit-text-size-adjust: 100%;
    -webkit-tap-highlight-color: transparent;
  }
  button, a, select, summary, input { touch-action: manipulation; }
  button:focus-visible, a:focus-visible, select:focus-visible, summary:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .wrap { max-width: 560px; margin: 0 auto; padding: 8px max(16px, env(safe-area-inset-right)) calc(32px + env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); }

  .appbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 52px; }
  .region { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 17px; min-width: 0; }
  .region select {
    font: inherit; color: var(--text); background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    min-height: 44px; max-width: 100%; padding: 0 34px 0 12px; cursor: pointer; appearance: none; -webkit-appearance: none;
    background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%);
    background-position: right 17px center, right 12px center; background-size: 5px 5px; background-repeat: no-repeat;
  }
  .count { color: var(--muted); font-size: 14px; white-space: nowrap; }
  .top { display: flex; align-items: center; gap: 8px; min-height: 44px; margin-bottom: 4px; }
  .back {
    border: 0; background: none; color: var(--muted); font-size: 16px;
    min-height: 44px; padding: 0 8px 0 0; cursor: pointer; white-space: nowrap;
  }
  .back[hidden] { display: none; }
  .step-text { color: var(--muted); font-size: 14px; min-width: 28px; text-align: right; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  h1:focus { outline: none; }
  .progress { flex: 1; height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
  .progress > div { height: 100%; background: var(--accent); transition: width .25s; }

  h1 { font-size: 25px; line-height: 1.3; margin: 10px 0 4px; }
  .sub { color: var(--muted); margin: 0 0 16px; font-size: 16px; }

  .choices { display: grid; gap: 10px; }
  .choice {
    display: flex; align-items: center; gap: 14px; width: 100%;
    background: var(--card); color: var(--text);
    border: 2px solid var(--line); border-radius: 16px;
    padding: 14px 16px; font-size: 18px; text-align: left; cursor: pointer; transition: transform .08s;
  }
  .choice:active, .chip:active, .primary:active, .ghost:active { transform: scale(.98); }
  .choice .emoji { font-size: 28px; }
  .choice small { display: block; color: var(--muted); font-size: 15px; }
  .choice.picked { border-color: var(--accent); background: var(--accent-soft); }

  .group { margin-bottom: 20px; }
  .group h2 { font-size: 16px; margin: 0 0 8px; }
  .chips { display: grid; gap: 8px; grid-template-columns: repeat(var(--cols, 2), minmax(0, 1fr)); }
  .chip {
    min-height: 48px; padding: 6px 4px; border-radius: 12px; line-height: 1.25;
    background: var(--card); color: var(--text);
    border: 2px solid var(--line); font-size: 16px; cursor: pointer; transition: transform .08s;
  }
  @media (max-width: 359px) { .chips[style*="--cols:5"] { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
  .advanced { background: var(--card); border: 1px solid var(--line); border-radius: 14px; margin: 0 0 16px; }
  .advanced > summary { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 56px; padding: 8px 14px; cursor: pointer; list-style: none; font-size: 15px; }
  .advanced > summary::-webkit-details-marker { display: none; }
  .advanced > summary b { color: var(--accent); white-space: nowrap; font-size: 14px; }
  .advanced[open] > summary b::before { content: "접기"; }
  .advanced:not([open]) > summary b::before { content: "바꾸기"; }
  .advanced .inner { padding: 4px 14px 2px; border-top: 1px solid var(--line); }
  .advanced .group:first-child { margin-top: 12px; }
  .cta { position: sticky; bottom: 0; z-index: 5; margin: 0 -16px; padding: 10px 16px calc(10px + env(safe-area-inset-bottom)); background: linear-gradient(to top, var(--bg) 78%, transparent); }
  .chip:disabled { opacity: .35; cursor: default; }
  .chip[aria-checked="true"] { border-color: var(--accent); background: var(--accent-soft); font-weight: 600; }

  .geo { margin: -10px 0 20px; color: var(--muted); font-size: 15px; }
  .geo[hidden] { display: none; }
  .date-pick {
    width: 100%; min-height: 48px; padding: 0 14px; margin-top: 8px; border-radius: 12px;
    background: var(--card); color: var(--text); border: 2px solid var(--line); font-size: 17px;
  }
  .date-pick[hidden] { display: none; }

  .primary {
    width: 100%; min-height: 56px; border: 0; border-radius: 16px;
    background: var(--accent); color: #fff; font-size: 18px; font-weight: 700; cursor: pointer;
  }
  :root[data-theme="dark"] .primary { color: #10231b; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .primary { color: #10231b; } }
  .primary:disabled { opacity: .4; cursor: default; }

  .summary {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 0 0 12px;
  }
  .summary div { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px; text-align: center; }
  .summary b { display: block; font-size: 20px; white-space: nowrap; }
  @media (max-width: 400px) { .summary b { font-size: 17px; } }
  .summary span { color: var(--muted); font-size: 14px; }
  .fare-line { color: var(--muted); font-size: 13px; margin: -6px 0 12px; text-align: right; }
  .left-time { background: var(--warn-soft); color: var(--warn); border-radius: 10px; padding: 8px 12px; font-size: 14px; line-height: 1.45; margin: 0 0 10px; }
  .tags { color: var(--muted); font-size: 14px; margin: -12px 0 14px; line-height: 1.5; }
  .caution { color: var(--muted); font-size: 14px; margin: 0 0 12px; }

  .timeline { list-style: none; padding: 0; margin: 0 0 20px; }
  .move { color: var(--muted); font-size: 15px; padding: 6px 0 6px 18px; border-left: 2px dashed var(--line); margin-left: 8px; }
  .stop {
    background: var(--card); border: 1px solid var(--line); border-radius: 16px;
    padding: 14px 16px; margin: 4px 0;
  }
  .stop .time { display: flex; align-items: center; gap: 8px; color: var(--accent); font-weight: 700; font-size: 15px; }
  .stop .no { display: inline-flex; align-items: center; justify-content: center; width: 24px; height: 24px; border-radius: 50%; background: var(--accent); color: var(--bg); font-size: 13px; flex: none; }
  .stop .name { font-size: 19px; font-weight: 700; margin: 2px 0; }
  .stop .desc { font-size: 15px; margin: 0 0 2px; }
  .why { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 0 14px; margin: 0 0 12px; }
  .why > summary { min-height: 48px; display: flex; align-items: center; justify-content: space-between; cursor: pointer; font-weight: 700; font-size: 16px; list-style: none; }
  .why > summary::-webkit-details-marker { display: none; }
  .why > summary::after { content: "펼치기"; font-weight: 400; color: var(--accent); font-size: 14px; }
  .why[open] > summary::after { content: "접기"; }
  .why ul { margin: 0 0 12px; padding-left: 18px; }
  .why li { margin: 3px 0; font-size: 15px; }
  .stop .meta { color: var(--muted); font-size: 15px; }
  .badges { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .badge { font-size: 13px; padding: 3px 9px; border-radius: 10px; background: var(--accent-soft); color: var(--accent); }
  .badge.warn { background: var(--warn-soft); color: var(--warn); }
  .badge.sun { background: var(--warn-soft); color: var(--text); }
  .links .skip { flex: 1; min-height: 44px; padding: 0 6px; border: 1px solid var(--line); border-radius: 10px; background: none; color: var(--muted); font-size: 14px; cursor: pointer; }
  .dock { position: sticky; bottom: 0; z-index: 5; margin: 0 -16px; padding: 8px 16px calc(8px + env(safe-area-inset-bottom)); background: linear-gradient(to top, var(--bg) 80%, transparent); }
  .actions { display: flex; gap: 8px; }
  .wide { width: 100%; flex: none; margin-bottom: 4px; }
  .ghost { flex: 1; min-width: 0; min-height: 48px; padding: 0 6px; border: 1px solid var(--line); border-radius: 12px; background: var(--card); color: var(--text); font-size: 15px; font-weight: 600; cursor: pointer; }
  .link { border: 0; background: none; color: var(--accent); font-size: 15px; text-decoration: underline; cursor: pointer; padding: 4px; }
  .share-msg { color: var(--muted); font-size: 14px; margin: 0 0 4px; overflow-wrap: anywhere; background: var(--bg); }
  .share-msg:empty { display: none; }
  .skipped { color: var(--muted); font-size: 15px; margin: 0 0 8px; }
  .map { height: 220px; border-radius: 14px; border: 1px solid var(--line); margin: 0 0 12px; z-index: 0; }
  .map[hidden] { display: none; }
  .pin { width: auto !important; }
  .pin span { display: inline-flex; align-items: center; justify-content: center; min-width: 30px; height: 30px; padding: 0 6px; border-radius: 15px; white-space: nowrap; transform: translate(-50%, 0); margin-left: 15px; background: var(--accent); color: #fff; font-weight: 700; font-size: 12px; border: 2px solid #fff; box-shadow: 0 1px 3px rgba(0,0,0,.4); }
  .more { margin-top: 4px; font-size: 14px; color: var(--muted); }
  .more summary { cursor: pointer; min-height: 44px; display: flex; align-items: center; }
  .more p { margin: 6px 0; line-height: 1.6; }
  .more ul { margin: 4px 0; padding-left: 18px; word-break: break-all; }
  .more a { color: var(--accent); }
  .links { display: flex; gap: 8px; margin-top: 10px; }
  .links a {
    flex: 1; min-height: 44px; display: flex; align-items: center; justify-content: center;
    border: 1px solid var(--line); border-radius: 10px;
    color: var(--text); text-decoration: none; font-size: 14px;
  }
  .endpoint { font-weight: 600; padding: 6px 0; }
  .sub-line { display: block; font-weight: 400; color: var(--muted); font-size: 14px; }
  .notes { color: var(--muted); font-size: 14px; margin-bottom: 16px; }
  .notes > summary { min-height: 44px; display: flex; align-items: center; cursor: pointer; }
  .notes p { margin: 4px 0; }
  .empty { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 20px; margin-bottom: 20px; }
</style>
</head>
<body>
<div class="wrap">
  <header class="appbar">
    <label class="region"><span id="regionArea"></span> <select id="regionPick" aria-label="지역 고르기"></select></label>
    <span class="count"><span id="placeCount"></span>곳</span>
  </header>

  <div class="top">
    <button class="back" id="back" hidden>← 이전</button>
    <div class="progress" id="progress" role="progressbar" aria-label="진행" aria-valuemin="1" aria-valuemax="4"><div id="bar"></div></div>
    <span class="step-text" id="stepText" aria-hidden="true"></span>
  </div>

  <main id="screen"></main>
</div>

<script src="regions.js?v=20261101p"></script>
<script id="regionLoader">
// 고른 지역의 자료만 불러와요 (지역 없는 예전 링크는 애월)
const REGION = REGIONS.find((r) => r.id === new URLSearchParams(location.search).get("region")) ?? REGIONS[0];
document.write(`<script src="regions/${REGION.id}/places.js?v=20261101p"><\/script><script src="regions/${REGION.id}/travel.js?v=20261101p"><\/script>`);
</script>
<script>
// ----- 고를 수 있는 것들 -----
const WHO = [
  { id: "group",  emoji: "👫", label: "친구·연인·가족",    hint: "특별한 조건 없이 좋은 곳으로" },
  { id: "dog",    emoji: "🐶", label: "반려견이랑",        hint: "반려견이 들어갈 수 있는 곳만" },
  { id: "kid",    emoji: "👶", label: "아기랑 (유모차)",   hint: "유모차가 다닐 수 있는 곳만" },
  { id: "wheel",  emoji: "♿", label: "휠체어·어르신이랑", hint: "계단 없이 들어갈 수 있는 곳만" },
  { id: "solo",   emoji: "🙋", label: "혼자",              hint: "혼밥 되는 곳처럼 혼자 가기 좋은 곳을 먼저" }
];
const HOW = [
  { id: "walk", emoji: "🚶", label: "뚜벅이",   hint: "걷거나 버스" },
  { id: "bike", emoji: "🚲", label: "자전거",   hint: "자전거 세울 곳을 먼저" },
  { id: "car",  emoji: "🚗", label: "렌터카",   hint: "주차되는 곳을 먼저" },
  { id: "ev",   emoji: "🔌", label: "전기차",   hint: "충전소 가까운 곳에서 오래 머물게 짜요" },
  { id: "any",  emoji: "🤷", label: "상관없어요", hint: "가까우면 걷고, 멀면 택시·차로" }
];
// 버스 자료가 없는 지역은 뚜벅이를 빼요
const HOW_HERE = REGION.noBus ? HOW.filter((h) => h.id !== "walk") : HOW;
const WHEN = [
  { id: "today",    label: () => `오늘 (${dayOf(kstToday())})`,              date: () => kstToday() },
  { id: "tomorrow", label: () => `내일 (${dayOf(addDays(kstToday(), 1))})`, date: () => addDays(kstToday(), 1) },
  { id: "pick",     label: () => "다른 날짜",                          date: () => null }
];
const DEPART = ["09:00", "10:00", "11:00", "12:00", "13:00", "14:00", "15:00", "16:00", "17:00", "18:00"];
const HOURS = [3, 4, 6, 8];
const PEOPLE = [1, 2, 3, 4];
// 아기랑·휠체어·친구는 함께 가는 사람이 있으니 기본 2명, 그 밖에는 1명
const defaultPeople = () => (state.who === "kid" || state.who === "wheel" || state.who === "group" ? 2 : 1);
const BUDGET = [30000, 50000, 100000, 150000];
const HERE = { id: "here", emoji: "📍", label: "지금 내 위치" };
const ENDS = [
  { id: "start",   emoji: "🔁", label: "출발한 곳으로" },
  { id: "airport", emoji: REGION.hub.emoji, label: REGION.hub.label }, // 타고 떠나는 곳 (지역마다 달라요)
  { id: "any",     emoji: "🤷", label: "상관없어요" }
];
const AREAS = [
  { id: "mix",      emoji: "🤷", label: "골고루" },
  { id: "sea",      emoji: "🌊", label: "바닷가 위주" },
  { id: "mountain", emoji: "⛰️", label: "산 쪽 위주" },
  { id: "indoor",   emoji: "☔", label: "실내 위주" }
];

const state = { step: 0, who: null, how: null, people: null, when: null, date: null, from: null, here: null, depart: null, hours: null, budget: null, area: "mix", end: "start", skip: [], alt: 0 };

const screen = document.getElementById("screen");
const bar = document.getElementById("bar");
const back = document.getElementById("back");

// ----- 주소(URL)에 고른 조건 담기: 새로고침해도 그대로, 링크로 보내면 같은 코스가 떠요 -----
// "지금 내 위치"는 위치라서 주소에 넣지 않아요
const URL_KEYS = { who: "who", how: "how", people: "people", date: "date", from: "from", depart: "time", hours: "hours", budget: "budget", end: "end", area: "area" };
function queryOf() {
  const q = new URLSearchParams();
  for (const [k, name] of Object.entries(URL_KEYS)) {
    const v = state[k];
    if (v === null || v === undefined || (k === "from" && v === "here")) continue;
    if ((k === "end" && v === "start") || (k === "area" && v === "mix")) continue; // 기본값은 빼요
    if (k === "people" && state.how !== "any") continue; // 인원은 택시비를 나눌 때만 써요
    q.set(name, v);
  }
  if (REGION !== REGIONS[0]) q.set("region", REGION.id);
  if (state.skip.length) q.set("skip", state.skip.join(","));
  if (state.alt) q.set("alt", state.alt);
  if (state.step) q.set("step", state.step);
  return q.toString();
}
function readQuery() {
  const q = new URLSearchParams(location.search);
  const one = (name, ok) => { const v = q.get(name); return v !== null && ok(v) ? v : null; };
  const num = (name, list) => { const v = Number(q.get(name)); return list.includes(v) ? v : null; };
  state.who = one("who", (v) => WHO.some((w) => w.id === v));
  state.how = one("how", (v) => HOW_HERE.some((h) => h.id === v));
  state.people = num("people", PEOPLE) ?? defaultPeople(); // 인원이 없는 예전 링크는 기본값으로
  state.date = one("date", (v) => /^\d{4}-\d\d-\d\d$/.test(v));
  // 공유받은 링크의 날짜가 지났으면 날짜를 다시 고르게 해요
  staleDate = state.date && state.date < kstToday() ? state.date : null;
  if (staleDate) state.date = null;
  state.when = !state.date ? null : state.date === kstToday() ? "today" : state.date === addDays(kstToday(), 1) ? "tomorrow" : "pick";
  state.from = one("from", (v) => STARTS.some((s) => s.id === v));
  state.depart = one("time", (v) => DEPART.includes(v));
  state.hours = num("hours", HOURS);
  state.budget = num("budget", BUDGET);
  state.end = one("end", (v) => ENDS.some((e) => e.id === v)) ?? "start";
  state.area = one("area", (v) => AREAS.some((a) => a.id === v)) ?? "mix";
  state.skip = (q.get("skip") ?? "").split(",").filter((id) => PLACES.some((p) => p.id === id));
  state.alt = Math.max(0, Number(q.get("alt")) || 0);
  // 앞 단계를 다 골라야 다음 단계로 갈 수 있어요
  const ready = [true, !!state.who, !!state.how, !!(state.date && state.from && state.depart && state.hours && state.budget)];
  let step = Math.min(3, Math.max(0, Number(q.get("step")) || 0));
  while (step > 0 && !ready[step]) step--;
  state.step = step;
}
let staleDate = null;
// depth = 이 사이트 안에서 앞으로 간 횟수. 0이면 뒤로가기는 사이트를 나가요
const syncUrl = (push) => history[push ? "pushState" : "replaceState"]({ step: state.step, depth: (history.state?.depth ?? 0) + (push ? 1 : 0) }, "", `${location.pathname}${queryOf() ? `?${queryOf()}` : ""}`);
// 다음 단계로: 브라우저 기록에 남겨서 폰의 뒤로가기로 돌아올 수 있어요
const goStep = (step) => { state.step = step; syncUrl(true); render(); };
back.onclick = () => {
  if ((history.state?.depth ?? 0) > 0) history.back();
  else { state.step = Math.max(0, state.step - 1); syncUrl(false); render(); }
};
// 뒤로·앞으로 가기: 단계만 옮기고 고른 값은 그대로 둬요 (돌아가도 고른 것이 표시돼요)
window.addEventListener("popstate", () => {
  state.step = Math.min(3, Math.max(0, Number(new URLSearchParams(location.search).get("step")) || 0));
  syncUrl(false); render();
});

// ----- 작은 도우미 -----
const toMin = (hhmm) => { const [h, m] = hhmm.split(":").map(Number); return h * 60 + m; };
const toHHMM = (min) => `${String(Math.floor(min / 60)).padStart(2, "0")}:${String(min % 60).padStart(2, "0")}`;
const won = (n) => n === 0 ? "무료" : `${n.toLocaleString("ko-KR")}원`;
const manwon = (n) => `${n / 10000}만 원`;
// 이모지는 화면낭독기가 읽지 않게 숨겨요
const em = (e) => `<span aria-hidden="true">${e}</span>`;
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const DAYS = ["일", "월", "화", "수", "목", "금", "토"];
// 날짜는 "2026-10-31" 글자로 다뤄요. 기기 시간대와 상관없이 한국 시간 기준이에요
const kstToday = () => new Date(Date.now() + 9 * 3600e3).toISOString().slice(0, 10);
const addDays = (iso, n) => new Date(Date.parse(iso) + n * 864e5).toISOString().slice(0, 10);
const dayOf = (iso) => DAYS[new Date(`${iso}T00:00:00Z`).getUTCDay()];
const dateLabel = (iso) => `${Number(iso.slice(5, 7))}월 ${Number(iso.slice(8, 10))}일(${dayOf(iso)})`;

// ----- 화면 그리기 -----
function render() {
  bar.style.width = `${(state.step + 1) * 25}%`;
  const progress = document.getElementById("progress");
  progress.setAttribute("aria-valuenow", state.step + 1);
  progress.setAttribute("aria-valuetext", `${state.step + 1}/4단계`);
  document.getElementById("stepText").textContent = `${state.step + 1}/4`;
  back.hidden = state.step === 0;
  [renderWho, renderHow, renderWhen, renderResult][state.step]();
  window.scrollTo(0, 0);
  // 화면이 바뀌면 제목으로 포커스를 옮겨서 화면낭독기가 새 화면을 읽게 해요 (처음 열 때는 빼고)
  const h1 = screen.querySelector("h1");
  if (h1 && rendered) { h1.tabIndex = -1; h1.focus({ preventScroll: true }); }
  rendered = true;
}
let rendered = false;

function choiceList(items, key) {
  return `<div class="choices">${items.map((it) => `
    <button class="choice${state[key] === it.id ? " picked" : ""}" data-id="${it.id}">
      <span class="emoji" aria-hidden="true">${it.emoji}</span>
      <span>${it.label}${state[key] === it.id ? `<span class="sr"> (골랐던 것)</span>` : ""}<small>${it.hint}</small></span>
    </button>`).join("")}</div>`;
}

function bindChoices(key) {
  screen.querySelectorAll(".choice").forEach((btn) => {
    btn.onclick = () => {
      if (key === "who" && state.who !== btn.dataset.id) state.people = null; // 누구랑이 바뀌면 인원 기본값도 다시
      state[key] = btn.dataset.id; goStep(state.step + 1);
    };
  });
}

function renderWho() {
  screen.innerHTML = `<h1>누구랑 가요?</h1><p class="sub">하나만 골라 주세요.</p>${choiceList(WHO, "who")}`;
  bindChoices("who");
}

function renderHow() {
  screen.innerHTML = `<h1>어떻게 다녀요?</h1><p class="sub">하나만 골라 주세요.</p>${REGION.busNote ? `<p class="caution">${esc(REGION.busNote)}</p>` : ""}${choiceList(HOW_HERE, "how")}`;
  bindChoices("how");
}

// 하나만 고르는 묶음(radiogroup). 화면낭독기는 "언제 가요? 오늘, 선택됨"처럼 읽어요
function chipGroup(title, key, values, label, cols = 2) {
  return `<div class="group"><h2 id="g-${key}">${title}</h2><div class="chips" style="--cols:${cols}" role="radiogroup" aria-labelledby="g-${key}">${values.map((v) =>
    `<button class="chip" role="radio" data-key="${key}" data-v="${v}" aria-checked="${state[key] === v}">${label(v)}</button>`
  ).join("")}</div></div>`;
}

const startPoint = () => state.from === "here" ? state.here : STARTS.find((s) => s.id === state.from);
// 공항·역에서 끝나면 비행기·기차를 타요: 고른 시간이 끝나기 전에 넉넉히 도착하게 짜요
const AIRPORT_BUFFER = REGION.hub.buffer;
const airportBuffer = () => (state.end === "airport" ? AIRPORT_BUFFER : 0);
// 코스가 끝나고 돌아갈 곳 (상관없으면 null)
const endPoint = () => state.end === "any" ? null : state.end === "airport" ? STARTS.find((s) => s.id === "airport") : startPoint();

function renderWhen() {
  state.people ??= defaultPeople();
  // 자주 고르는 값을 미리 골라 둬요. 언제·어디서만 고르면 바로 코스를 짤 수 있어요
  state.hours ??= 6; state.budget ??= 50000; state.depart ??= "10:00";
  const froms = [HERE, ...STARTS];
  screen.innerHTML = `
    <h1>언제, 어디서 출발해요?</h1>
    ${staleDate ? `<p class="left-time stale" role="status">받은 링크의 날짜(${dateLabel(staleDate)})가 지났어요. 날짜를 다시 골라 주세요.</p>` : ""}
    <p class="sub">시간과 예산은 미리 골라 뒀어요.</p>
    <div class="group"><h2 id="g-when">언제 가요?</h2><div class="chips" style="--cols:3" role="radiogroup" aria-labelledby="g-when">${WHEN.map((w) =>
      `<button class="chip" role="radio" data-key="when" data-v="${w.id}" aria-checked="${state.when === w.id}">${w.label()}</button>`).join("")}</div>
      <input type="date" class="date-pick" id="datePick" aria-label="여행 날짜" min="${kstToday()}" value="${state.when === "pick" ? state.date : ""}" ${state.when === "pick" ? "" : "hidden"}>
    </div>
    ${chipGroup("어디서 출발해요? (숙소가 있는 동네)", "from", froms.map((f) => f.id), (id) => { const f = froms.find((x) => x.id === id); return f.emoji === "🏠" ? f.label : `${em(f.emoji)} ${f.label}`; })}
    <p class="geo" id="geo" hidden></p>
    <details class="advanced"><summary><span id="advSummary"></span><b aria-hidden="true"></b></summary><div class="inner">
    ${chipGroup("몇 시에 출발해요?", "depart", DEPART, (v) => v, 5)}
    ${chipGroup("몇 시간 있어요?", "hours", HOURS, (v) => `${v}시간`, 4)}
    ${chipGroup("1명 예산은요?", "budget", BUDGET, manwon, 4)}
    ${state.how === "any" ? chipGroup("몇 명이서 가요? (택시비를 나눠요)", "people", PEOPLE, (v) => v === 4 ? "4명+" : `${v}명`, 4) : ""}
    ${chipGroup("어디서 끝나요?", "end", ENDS.map((e) => e.id), (id) => { const e = ENDS.find((x) => x.id === id); return `${em(e.emoji)} ${e.label}`; })}
    ${chipGroup("어디 위주로 볼까요?", "area", AREAS.map((a) => a.id), (id) => { const a = AREAS.find((x) => x.id === id); return `${em(a.emoji)} ${a.label}`; })}
    </div></details>
    <div class="cta"><button class="primary" id="go">코스 짜기</button></div>`;
  const go = document.getElementById("go");
  const geo = document.getElementById("geo");
  const say = (msg) => { geo.textContent = msg; geo.hidden = !msg; };
  // 접어 둔 조건을 한 줄로 보여 줘요
  const syncAdv = () => {
    const parts = [state.depart ? `${state.depart} 출발` : "출발 시각 없음", `${state.hours}시간`, `1명 ${manwon(state.budget)}`];
    if (state.how === "any") parts.push(state.people === 4 ? "4명 이상" : `${state.people}명`);
    if (state.end !== "start") parts.push(ENDS.find((e) => e.id === state.end).label);
    if (state.area !== "mix") parts.push(AREAS.find((a) => a.id === state.area).label);
    document.getElementById("advSummary").textContent = parts.join(" · ");
  };
  const sync = () => { go.disabled = !(state.date && startPoint() && state.depart && state.hours && state.budget); syncAdv(); syncUrl(false); };
  // 오늘이면 이미 지난 출발 시각은 고를 수 없어요
  const syncDepart = () => {
    const nowMin = Math.floor((Date.now() + 9 * 3600e3) / 60000) % 1440;
    const today = state.date === kstToday();
    const chips = [...screen.querySelectorAll('.chip[data-key="depart"]')];
    chips.forEach((c) => { c.disabled = today && toMin(c.dataset.v) <= nowMin; });
    const picked = chips.find((c) => c.dataset.v === state.depart);
    if (picked?.disabled) {
      const next = chips.find((c) => !c.disabled);
      state.depart = next ? next.dataset.v : null;
      chips.forEach((c) => c.setAttribute("aria-checked", c === next));
    }
    if (today && !chips.some((c) => !c.disabled)) say("오늘은 고를 수 있는 출발 시각이 지났어요. 내일이나 다른 날짜를 골라 주세요.");
  };
  const datePick = document.getElementById("datePick");
  datePick.onchange = () => { state.date = datePick.value || null; staleDate = null; screen.querySelector(".stale")?.remove(); syncDepart(); sync(); };
  if (state.from === "here" && state.here) say("지금 위치에서 출발해요.");

  // "지금 내 위치"는 휴대폰·브라우저에 위치를 물어봐요. 그 지역 밖이면 쓰지 않아요
  const askHere = () => {
    if (!navigator.geolocation) { say("이 브라우저는 위치를 알려 주지 않아요. 다른 출발 장소를 골라 주세요."); return; }
    say("위치를 확인하고 있어요…");
    navigator.geolocation.getCurrentPosition((pos) => {
      const { latitude: lat, longitude: lng } = pos.coords;
      const b = REGION.bounds, inJeju = lat >= b.latMin && lat <= b.latMax && lng >= b.lngMin && lng <= b.lngMax;
      state.here = inJeju ? { name: "내 위치", lat, lng } : null;
      say(inJeju ? "지금 위치에서 출발해요." : `지금 ${REGION.area}에 있지 않아요. 도착하면 써 주세요. 지금은 다른 출발 장소를 골라 주세요.`);
      sync();
    }, () => { state.here = null; say("위치를 알 수 없었어요. 위치 허용을 확인하거나 다른 출발 장소를 골라 주세요."); sync(); },
    { enableHighAccuracy: false, timeout: 10000 });
  };

  screen.querySelectorAll(".chip").forEach((chip) => {
    chip.onclick = () => {
      const key = chip.dataset.key;
      state[key] = (key === "depart" || key === "from" || key === "area" || key === "when" || key === "end") ? chip.dataset.v : Number(chip.dataset.v);
      if (key === "when") {
        staleDate = null; screen.querySelector(".stale")?.remove();
        datePick.hidden = state.when !== "pick";
        state.date = state.when === "pick" ? (datePick.value || null) : WHEN.find((w) => w.id === state.when).date();
        if (state.when === "pick" && !datePick.value) datePick.focus();
      }
      screen.querySelectorAll(`.chip[data-key="${key}"]`).forEach((c) => c.setAttribute("aria-checked", c === chip));
      if (key === "when") syncDepart();
      if (key === "from") { if (chip.dataset.v === "here") askHere(); else say(""); }
      sync();
    };
  });
  go.onclick = () => { state.skip = []; state.alt = 0; goStep(3); };
  syncDepart();
  syncAdv();
  sync();
}

// ----- 이동 시간 -----
// 장소끼리는 travel.js의 길 기준 시간표를 쓰고, 표에 없으면(지금 내 위치 등) 직선거리로 어림해요
const TRAVEL_INDEX = Object.fromEntries(TRAVEL.ids.map((id, i) => [id, i]));
const travelIndex = (p) => TRAVEL_INDEX[p.id] ?? TRAVEL_INDEX[`start:${p.id}`];

function distKm(a, b) {
  const R = 6371, rad = Math.PI / 180;
  const dLat = (b.lat - a.lat) * rad, dLng = (b.lng - a.lng) * rad;
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(a.lat * rad) * Math.cos(b.lat * rad) * Math.sin(dLng / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h)) * 1.3; // 길이 구불구불한 만큼 1.3배
}

// 교통비 (성인 1명). 버스는 교통카드 기준이고, 40분 안에 갈아타면 환승 할인으로 따로 안 내요 (제주버스정보시스템 요금표)
// 택시는 중형 기본요금(2km까지) + 거리요금. 요금은 regions.js에 지역별로 있어요. 막혀서 느릴 때 붙는 시간요금·심야 할증은 빼고 어림
const busFare = (no) => /^1\d\d$/.test(no) ? 2000 : 1150; // 급행(1xx번)은 기본 2,000원
const taxiMeterFare = (km) => Math.max(0, Math.ceil((km - 2) * 1000 / REGION.taxiMeter)) * 100;
// taxiFarKm을 넘은 거리는 거리요금이 2배예요 (강릉 6km 초과 할증 100%)
const taxiFare = (km) => REGION.taxiBase + taxiMeterFare(km) + (REGION.taxiFarKm && km > REGION.taxiFarKm ? taxiMeterFare(km) - taxiMeterFare(REGION.taxiFarKm) : 0);
// 택시는 같이 타는 사람끼리 나눠 내요 (1명 몫, 100원 단위 올림)
const taxiShare = (km) => Math.ceil(taxiFare(km) / (state.people || 1) / 100) * 100;

function travel(a, b, how) {
  const i = travelIndex(a), j = travelIndex(b);
  if (i === undefined || j === undefined) return travelGuess(a, b, how);
  // 휠체어·어르신은 1.5배 느리게 걸어요
  const wheel = state.who === "wheel";
  const walk = TRAVEL.walk[i][j] * (wheel ? 1.5 : 1), car = TRAVEL.car[i][j], bike = TRAVEL.bike[i][j];
  let min, text, fare = 0, plan = null;
  if (how === "walk") {
    // 걸어서 20분 안이면 걷고, 멀면 버스 (기다리는 시간 포함 평균). 버스가 더 느리면 걸어요
    // 휠체어·어르신은 저상버스가 있는 노선만 타고, 30분 넘게는 걷지 않아요
    const bus = (wheel ? TRAVEL.busWheel : TRAVEL.bus)[i][j], no = (wheel ? TRAVEL.busWheelNo : TRAVEL.busNo)[i][j];
    const kind = wheel ? "저상버스" : "버스";
    if (walk <= 20 || (bus !== null && walk <= bus && (!wheel || walk <= 30))) { min = walk; text = "걸어서"; }
    else if (bus === null) { min = Infinity; text = `${kind}로 못 가요`; }
    else {
      min = bus; text = no === "갈아타기" ? `${kind}로(1번 갈아타기)` : `${no}번 ${kind}로`;
      fare = no === "갈아타기" ? busFare("") : busFare(no);
      plan = TRAVEL.busPlans[(wheel ? TRAVEL.busWheelPlan : TRAVEL.busPlan)[i][j]];
    }
  } else if (how === "any") {
    if (walk <= 15) { min = walk; text = "걸어서"; }
    else { min = car + 5; text = "택시로"; fare = taxiShare(TRAVEL.carKm[i][j]); }
  } else if (how === "bike") { min = bike + 3; text = "자전거로"; }
  else { min = car + 5; text = "차로"; } // 주차 5분
  return { min: Math.max(1, Math.ceil(min)), text, fare, plan };
}

// 직선거리 어림 (시간표에 없는 곳)
function travelGuess(a, b, how) {
  const km = distKm(a, b);
  const walkKmh = state.who === "wheel" ? 3 : 4.5;
  let min, text, fare = 0;
  if (how === "walk") {
    if (km <= 1.2) { min = km / walkKmh * 60; text = "걸어서"; }
    else { min = 10 + km / 18 * 60; text = "버스로(어림)"; fare = busFare(""); }
  } else if (how === "any") {
    if (km <= 1.2) { min = km / walkKmh * 60; text = "걸어서"; }
    else { min = 5 + km / 35 * 60; text = "택시로"; fare = taxiShare(km); }
  } else if (how === "bike") { min = 3 + km / 12 * 60; text = "자전거로"; }
  else { min = 5 + km / 35 * 60; text = "차로"; }
  return { min: Math.max(3, Math.ceil(min)), text, fare };
}

// ----- 코스 짜기 -----
const NEED = { dog: "dog", kid: "stroller", wheel: "stepFree" };

// 가는 날 요일에 따로 정한 운영시간이 있으면 그걸 써요 (예: 주말엔 더 일찍 열어요)
const tripDay = () => dayOf(state.date);
const hoursOf = (p) => (p.hoursByDay && p.hoursByDay[tripDay()]) || [p.open, p.close];
// 식당·카페는 마지막 주문 전에 들어가야 해요. 모르면 식당은 닫기 1시간 전, 카페는 30분 전으로 어림
// (요일마다 닫는 시간이 다르면 닫는 시간과 마지막 주문 사이 간격을 그날에 맞춰요)
function lastOrderMin(p, close) {
  if (p.type !== "식당" && p.type !== "카페") return Infinity;
  const gap = p.lastOrder ? toMin(p.close) - toMin(p.lastOrder) : (p.type === "식당" ? 60 : 30);
  return toMin(close) - gap;
}

// 전기차: 충전소가 걸어서 5분 안이고 50분 넘게 머무는 곳이면, 충전해 두고 다녀오기 좋아요
const chargesHere = (p) => p.evChargerMin !== null && p.evChargerMin <= 5 && p.stayMin >= 50;

// 일몰 시각(한국 시간, 분). 미국 해양대기청(NOAA)의 간단한 태양 계산식이에요. 애월 기준으로 1~2분 차이 정도
function sunsetMin(iso, lat = REGION.sun[0], lng = REGION.sun[1]) {
  const rad = Math.PI / 180;
  const day = (Date.parse(iso) - Date.parse(`${iso.slice(0, 4)}-01-01`)) / 864e5;
  const g = 2 * Math.PI / 365 * day;
  const eqtime = 229.18 * (0.000075 + 0.001868 * Math.cos(g) - 0.032077 * Math.sin(g) - 0.014615 * Math.cos(2 * g) - 0.040849 * Math.sin(2 * g));
  const decl = 0.006918 - 0.399912 * Math.cos(g) + 0.070257 * Math.sin(g) - 0.006758 * Math.cos(2 * g) + 0.000907 * Math.sin(2 * g) - 0.002697 * Math.cos(3 * g) + 0.00148 * Math.sin(3 * g);
  const ha = Math.acos(Math.cos(90.833 * rad) / (Math.cos(lat * rad) * Math.cos(decl)) - Math.tan(lat * rad) * Math.tan(decl)) / rad;
  return Math.round(720 - 4 * lng - eqtime + 4 * ha + 540);
}
// 노을 보기 좋은 곳: 이름·메모에 노을·선셋이 있는 곳, 또는 바다가 보이는 바닷가 야외 장소(공원·볼거리)
const sunsetSpots = new Map();
const isSunsetSpot = (p) => {
  if (!sunsetSpots.has(p)) sunsetSpots.set(p, /노을|일몰|선셋|썬셋/.test(p.name + p.note)
    || (!REGION.noSeaSunset && (p.type === "공원" || p.type === "볼거리") && /바다|해안|포구|해수욕|전망/.test(p.name + p.note) && !isInland(p)));
  return sunsetSpots.get(p);
};
// 해가 지는 시각에 그곳에 있으면 노을을 봐요
const sunsetCache = {};
const sunsetToday = () => (sunsetCache[state.date] ??= sunsetMin(state.date));
const seesSunset = (p, begin, leave) => isSunsetSpot(p) && begin <= sunsetToday() && leave >= sunsetToday();
// 해수욕장 개장 기간인지 (beachSeason이 없으면 null)
const inBeachSeason = (p) => p.beachSeason ? state.date.slice(5) >= p.beachSeason[0] && state.date.slice(5) <= p.beachSeason[1] : null;

// 해안선(COASTLINE)에서 남쪽으로 2.5km 넘게 떨어지면 산 쪽(중산간)
function isInland(p) {
  const [a, b] = COASTLINE;
  const coastLat = a.lat + (p.lng - a.lng) / (b.lng - a.lng) * (b.lat - a.lat);
  // 서귀포처럼 바다가 남쪽인 지역은 북쪽이 산 쪽이에요
  const south = (coastLat - p.lat) * 111;
  return (typeof INLAND_NORTH !== "undefined" ? -south : south) > 2.5;
}

// 쉬엄쉬엄 다니게: 3시간 3곳, 4시간 3곳, 6시간 5곳, 8시간 6곳까지
const PACE_BUFFER = 15;
const maxStops = () => Math.ceil(state.hours * 0.75);

// 코스를 짜는 중의 상태: 지금 어디서 몇 시인지, 돈·카페·식사를 얼마나 썼는지
function startCtx() {
  const startMin = toMin(state.depart);
  return {
    stops: [], here: startPoint(), now: startMin, spent: 0, fares: 0, lastType: null, lastMeal: -999, lastCafe: -999, cafes: 0,
    // 고른 시간을 꽉 채우지 않게 15분 여유를 둬요
    endMin: startMin + state.hours * 60 - PACE_BUFFER, maxCafes: state.hours <= 4 ? 1 : 2, day: tripDay()
  };
}

// 지금 자리에서 p로 가면 어떻게 되는지 (못 가면 null)
function visit(ctx, p) {
  if (ctx.stops.some((s) => s.place === p)) return null;
  if (p.closedDays && p.closedDays.includes(ctx.day)) return null;
  // 카페·식당은 연달아 넣지 않고, 카페는 4시간 이하면 1곳·그보다 길면 2곳까지
  if (p.type === ctx.lastType && (p.type === "카페" || p.type === "식당")) return null;
  if (p.type === "카페" && ctx.cafes >= ctx.maxCafes) return null;

  const [open, close] = hoursOf(p);
  const mv = travel(ctx.here, p, state.how);
  if (mv.min === Infinity) return null; // 버스로 못 가는 곳
  let begin = ctx.now + mv.min;
  // 문 열기 전이나 쉬는 시간이면 30분까지는 기다리고, 더 길면 다음 후보로
  const waitUntil = (min) => { if (min - begin > 30) return false; begin = min; return true; };
  if (open && begin < toMin(open) && !waitUntil(toMin(open))) return null;
  const hitBreak = (p.breaks ?? []).find(([from, to]) => begin < toMin(to) && begin + p.stayMin > toMin(from));
  if (hitBreak && !waitUntil(toMin(hitBreak[1]))) return null;
  const leave = begin + p.stayMin;
  if (leave > ctx.endMin) return null;
  if (close && leave > toMin(close)) return null;
  if (close && begin > lastOrderMin(p, close)) return null;
  // 끝나는 곳이 있으면 거기까지 돌아가는 시간도 넣어서 시간 안에 들어와야 해요
  const end = endPoint(), back = end && travel(p, end, state.how);
  if (back && (back.min === Infinity || leave + back.min > ctx.endMin - airportBuffer())) return null;
  // 입장료·밥값에 교통비까지, 돌아갈 차비도 남겨 두고 예산 안이어야 해요
  if (ctx.spent + (p.cost ?? 0) + mv.fare + (back?.fare ?? 0) > state.budget) return null;

  // 카페는 2시간 넘게 띄우고, 점심 전(11시~13시 30분)에는 넣지 않아요. 점심을 먼저 먹어요
  if (p.type === "카페" && (begin - ctx.lastCafe < 120 || (ctx.lastMeal < 0 && begin >= 660 && begin <= 810))) return null;

  // 식당은 밥때(아침 7~9:30, 점심 11~14시, 저녁 17~20시)에만, 앞 식사에서 3시간이 지나야 넣어요
  const mealTime = (begin >= 420 && begin <= 570) || (begin >= 660 && begin <= 840) || (begin >= 1020 && begin <= 1200);
  if (p.type === "식당" && (!mealTime || begin - ctx.lastMeal < 180)) return null;
  // 숙소·공항에서 나와 1시간 안에 아침 식당은 넣지 않아요 (보통 아침을 먹고 나와요. 점심을 먹게 해요)
  if (p.type === "식당" && begin < 660 && begin - toMin(state.depart) < 60) return null;

  let score = -(begin - ctx.now);
  // 점심·저녁 식당에 가산점을 몰아줘요
  if (p.type === "식당") score += begin >= 690 && begin <= 810 ? 120 : begin >= 660 ? 60 : 20;
  if (p.type === ctx.lastType) score -= 25;
  if (state.who === "solo" && p.solo) score += 30;
  if (state.how === "bike" && p.bikeRack) score += 10;
  if ((state.how === "ev" || state.how === "car") && p.parking) score += 10;
  if (state.how === "ev" && chargesHere(p)) score += 20;
  if (seesSunset(p, begin, leave)) score += 40;
  // 바닷가·산 쪽 위주를 골랐으면 그쪽 장소를 먼저 (식당은 산 쪽에 적어서 조금만)
  if (state.area === "sea" || state.area === "mountain") score += (isInland(p) === (state.area === "mountain") ? 1 : -1) * (p.type === "식당" ? 15 : 40);
  return { place: p, move: mv, begin, leave, score };
}

function add(ctx, stop) {
  ctx.stops.push(stop);
  ctx.here = stop.place; ctx.now = stop.leave; ctx.spent += (stop.place.cost ?? 0) + stop.move.fare; ctx.fares += stop.move.fare; ctx.lastType = stop.place.type;
  if (stop.place.type === "식당") ctx.lastMeal = stop.begin;
  if (stop.place.type === "카페") { ctx.cafes++; ctx.lastCafe = stop.leave; }
}

// 갈 수 있는 곳 중 점수가 제일 높은 곳을 하나씩 이어 붙여요
function extend(ctx, pool) {
  while (ctx.stops.length < maxStops()) {
    let best = null;
    for (const p of pool) {
      const v = visit(ctx, p);
      if (v && (!best || v.score > best.score)) best = v;
    }
    if (!best) return ctx;
    add(ctx, best);
  }
  return ctx;
}

// 정한 순서대로 다녀 보기 (규칙에 안 맞으면 null)
function follow(places) {
  const ctx = startCtx();
  for (const p of places) {
    const v = visit(ctx, p);
    if (!v) return null;
    add(ctx, v);
  }
  return ctx;
}

// 마지막 장소에서 끝나는 곳까지 (끝나는 곳이 상관없거나 장소가 없으면 null)
const backOf = (ctx) => endPoint() && ctx.stops.length ? travel(ctx.here, endPoint(), state.how) : null;
const sunsetOf = (c) => c.stops.some((s) => seesSunset(s.place, s.begin, s.leave)) ? 1 : 0;
const movingOf = (ctx) => ctx.stops.reduce((sum, s) => sum + s.move.min, 0) + (backOf(ctx)?.min ?? 0);

// 다 짠 뒤 순서를 바꿔 이동 시간을 줄여요 (구간 뒤집기 2-opt + 한 곳 옮기기). 줄어든 시간에 더 넣을 수 있으면 넣어요
function shorten(ctx, pool) {
  let best = ctx, improved = true;
  while (improved) {
    improved = false;
    const order = best.stops.map((s) => s.place), n = order.length;
    const tries = [];
    for (let i = 0; i < n; i++) for (let j = i + 1; j < n; j++)
      tries.push([...order.slice(0, i), ...order.slice(i, j + 1).reverse(), ...order.slice(j + 1)]);
    for (let i = 0; i < n; i++) for (let k = 0; k < n; k++) if (k !== i && k !== i - 1) {
      const rest = order.filter((_, x) => x !== i);
      rest.splice(k > i ? k - 1 : k, 0, order[i]);
      tries.push(rest);
    }
    for (const t of tries) {
      const c = follow(t);
      if (c && movingOf(c) < movingOf(best) && sunsetOf(c) >= sunsetOf(best)) { best = c; improved = true; }
    }
  }
  return best === ctx ? ctx : extend(best, pool);
}

// 한 번 코스 짜기. first를 주면 첫 장소는 그곳으로 정해요.
function buildCourse(pool, first) {
  const ctx = startCtx();
  if (first) { const v = visit(ctx, first); if (v) add(ctx, v); else return { stops: [], spent: 0, fares: 0, finish: ctx.now }; }
  const c = shorten(extend(ctx, pool), pool);
  const back = backOf(c);
  const backFare = back?.fare ?? 0;
  return { stops: c.stops, spent: c.spent + backFare, fares: c.fares + backFare, back, finish: c.now + (back?.min ?? 0) };
}

// 코스 좋은 정도: 장소에서 즐기는 시간이 길수록, 이동이 짧을수록, 식사가 들어갈수록 좋아요 (오래 머무는 곳도 공평하게)
function courseScore(c) {
  if (c.stops.length === 0) return -Infinity;
  const moving = c.stops.reduce((sum, s) => sum + s.move.min, 0) + (c.back?.min ?? 0);
  const meal = c.stops.some((s) => s.place.type === "식당" && s.begin >= 660) ? 40 : c.stops.some((s) => s.place.type === "식당") ? 10 : 0;
  const inland = c.stops.filter((s) => isInland(s.place)).length;
  // 골고루: 바닷가와 산 쪽이 둘 다 있으면 좋아요 / 한쪽 위주: 그쪽 장소가 많을수록 좋아요
  const area = state.area === "indoor" ? 0 : state.area === "mix" ? (inland > 0 && inland < c.stops.length ? 40 : 0)
    : 30 * (state.area === "mountain" ? inland : c.stops.length - inland);
  const staying = c.stops.reduce((sum, s) => sum + s.place.stayMin, 0);
  return staying + c.stops.length * 10 - moving + meal + area + sunsetOf(c) * 40;
}

// includeUnknown: 정보가 없는 곳도 넣어 보기 (코스가 안 나올 때 이유를 찾으려고만 써요)
function makeCourse({ includeUnknown = false } = {}) {
  const need = NEED[state.who], skip = state.skip ?? [];
  let unknownSkipped = 0, noLocation = 0;
  const pool = PLACES.filter((p) => {
    if (p.lat === null) { noLocation++; return false; }
    if (skip.includes(p.id)) return false;
    if (p.forDogs && state.who !== "dog") return false; // 애견카페는 반려견과 갈 때만
    // 실내 위주: 공원과 야외 볼거리는 빼요
    if (state.area === "indoor" && (p.type === "공원" || (p.type === "볼거리" && !p.indoor))) return false;
    if (!need) return true;
    if (p[need] === null) unknownSkipped++;
    return p[need] === true || (includeUnknown && p[need] === null);
  });

  // 첫 장소를 하나씩 바꿔 가며 여러 코스를 짜 보고, 좋은 순서로 줄 세워요 (왔다 갔다를 줄여요)
  // "다른 코스 보기"를 누르면 그다음 코스를 보여 줘요
  const seen = new Set(), courses = [];
  for (const first of [null, ...pool]) {
    const c = buildCourse(pool, first);
    const key = c.stops.map((s) => s.place.id).sort().join();
    if (!c.stops.length || seen.has(key)) continue;
    seen.add(key); courses.push(c);
  }
  courses.sort((a, b) => courseScore(b) - courseScore(a));
  const pick = courses.length ? courses[(state.alt ?? 0) % courses.length] : { stops: [], spent: 0, fares: 0, finish: toMin(state.depart) };
  return { ...pick, unknownSkipped, noLocation, count: courses.length };
}

// 코스가 안 나오면 조건을 하나씩 풀어 보고 진짜 이유를 알려 줘요
function whyEmpty() {
  const tryWith = (change) => {
    const saved = { ...state }; Object.assign(state, change);
    const ok = makeCourse().stops.length > 0;
    Object.assign(state, saved); return ok;
  };
  if (state.skip.length && tryWith({ skip: [] })) return "skip";
  if (tryWith({ budget: Infinity })) return "budget";
  if (tryWith({ hours: 12 })) return "hours";
  if (makeCourse({ includeUnknown: true }).stops.length) return "unknown";
  return "other";
}

// 지도 바로가기: 카카오맵은 장소 번호로, 네이버지도는 이름 검색으로 열어요
function mapLinks(p) {
  const kakao = p.kakaoId ? `https://place.map.kakao.com/${p.kakaoId}` : `https://map.kakao.com/?q=${encodeURIComponent(p.name)}`;
  const naver = `https://map.naver.com/p/search/${encodeURIComponent(`${p.name} ${REGION.search}`)}`;
  return `<a href="${kakao}" target="_blank" rel="noopener">카카오맵</a><a href="${naver}" target="_blank" rel="noopener">네이버지도</a>`;
}

// 전부 정보가 없는 칸은 배지를 안 띄워요 (예: 자전거 거치대는 아직 60곳 모두 모름)
const NO_DATA_YET = { bikeRack: PLACES.every((p) => p.bikeRack === null) };

function badgesFor(s) {
  const p = s.place, out = [];
  const yesNo = (v, ok, label) => {
    if (v === true) out.push(`<span class="badge">${ok}</span>`);
    else if (v === null) out.push(`<span class="badge warn">${label}</span>`);
  };
  if (state.who === "dog") {
    if (p.dog && p.dogRule) out.push(`<span class="badge warn">반려견 조건${p.dogReview ? "(후기 기준)" : ""}: ${esc(p.dogRule)}</span>`);
    else yesNo(p.dog, p.dogReview ? "반려견 OK(후기 기준)" : "반려견 OK", "반려견 정보 없음");
  }
  if (state.who === "kid") yesNo(p.stroller, p.strollerReview ? "유모차 OK(후기 기준)" : "유모차 OK", "유모차 정보 없음");
  // 구글 지도 제보로만 아는 곳은 입구 이야기만 해요 (안쪽까지 계단이 없는지는 몰라요)
  if (state.who === "wheel") yesNo(p.stepFree, /구글 지도/.test(p.note) && !/무장애/.test(p.note) ? "휠체어 입구 있음(이용자 제보)" : "계단 없음", "계단 정보 없음");
  // 혼자 좋은 곳만 표시해요 (모르는 곳까지 '확인 필요'를 띄우면 화면이 지저분해져요)
  if (state.who === "solo" && p.solo) out.push(`<span class="badge">혼자 좋아요</span>`);
  if (state.how === "bike" && !NO_DATA_YET.bikeRack) yesNo(p.bikeRack, "자전거 거치대", "자전거 거치대 확인 필요");
  if (state.how === "car") yesNo(p.parking, "주차 가능", "주차 확인 필요");
  if (state.how === "ev") {
    yesNo(p.parking, "주차 가능", "주차 확인 필요");
    out.push(p.evChargerMin === null
      ? `<span class="badge warn">충전소 거리 확인 필요</span>`
      : `<span class="badge">충전소 걸어서 ${p.evChargerMin}분</span>`);
    if (chargesHere(p)) out.push(`<span class="badge">${em("🔌")} 여기서 충전하며 쉬기 좋아요</span>`);
  }
  if (p.closedDays === null) out.push(`<span class="badge warn">쉬는 날 확인 필요</span>`);
  if (p.open === null) out.push(`<span class="badge warn">운영시간 확인 필요</span>`);
  if (p.seasonalHours) out.push(`<span class="badge warn">계절마다 시간이 달라요</span>`);
  const beach = inBeachSeason(p);
  if (beach !== null) out.push(beach ? `<span class="badge">해수욕장 개장 기간</span>` : `<span class="badge warn">해수욕장 개장 기간 아님 · 산책·노을만</span>`);
  if (seesSunset(p, s.begin, s.leave)) out.push(`<span class="badge sun">${em("🌅")} 노을 볼 시간</span>`);
  return out.join("");
}

// 받침에 맞는 조사: josa("한담공원", "은", "는") → "은" (이름 끝의 한글 글자로 봐요)
function josa(word, withBatchim, without) {
  const last = [...word].reverse().find((c) => c >= "가" && c <= "힣");
  return last && (last.charCodeAt(0) - 0xac00) % 28 ? withBatchim : without;
}

// "이 코스는요": 코스 데이터에서 바로 나오는 사실만 문장으로 만들어요 (지어내는 말 없이)
function explainCourse(stops, back) {
  const out = [];
  const name = (s) => `<b>${esc(s.place.name)}</b>`;
  const need = { dog: "반려견과 갈 수 있다고", kid: "유모차가 다닐 수 있다고", wheel: "휠체어로 들어갈 수 있다고" }[state.who];
  if (need) out.push(`모두 ${need} 자료에 나온 곳이에요. 직접 가 본 건 아니라서 전화로 한 번 확인해 주세요.`);
  const solo = stops.filter((s) => s.place.solo);
  if (state.who === "solo" && solo.length) out.push(`혼자 가기 좋은 ${solo.map(name).join(", ")}${josa(solo[solo.length - 1].place.name, "을", "를")} 넣었어요.`);
  // 식사
  const meals = stops.filter((s) => s.place.type === "식당");
  const mealName = (m) => (m < 660 ? "아침" : m < 960 ? "점심" : "저녁");
  for (const m of meals) out.push(`${mealName(m.begin)}은 ${toHHMM(m.begin)}에 ${name(m)}${m.place.desc ? `(${esc(m.place.desc.replace(/\s*\(.*?\)/g, ""))})` : ""}에서 먹어요.`);
  const lunchTime = stops.length && stops[0].begin <= 720 && stops[stops.length - 1].leave >= 780;
  if (!meals.length && lunchTime) out.push("조건에 맞는 식당이 없어서 밥은 따로 챙겨 주세요.");
  const cafes = stops.filter((s) => s.place.type === "카페");
  if (cafes.length) out.push(`${cafes.map(name).join(", ")}에서 쉬어 가요.`);
  // 노을
  const sun = stops.find((s) => seesSunset(s.place, s.begin, s.leave));
  if (sun) out.push(`해가 지는 ${toHHMM(sunsetToday())}쯤 ${name(sun)}에 있어요.`);
  // 바닷가·산 쪽
  const inland = stops.filter((s) => isInland(s.place)).length, sea = stops.length - inland;
  if (state.area === "indoor") out.push("비가 와도 괜찮게 공원과 야외 볼거리는 뺐어요.");
  else out.push(inland && sea ? `바닷가 ${sea}곳, 산 쪽 ${inland}곳을 섞었어요.` : inland ? `모두 산 쪽(중산간)이에요.` : `모두 바닷가 쪽이에요.`);
  // 이동
  const moves = [...stops.map((s) => s.move), ...(back ? [back] : [])];
  const total = moves.reduce((m, x) => m + x.min, 0);
  const walks = moves.filter((x) => x.text === "걸어서").length;
  const kinds = [...new Set(moves.filter((x) => x.text !== "걸어서").map((x) => x.text.replace(/ ?로.*$/, "").replace(/\(.*\)/, "")))];
  out.push(`이동은 모두 ${total}분이에요${walks === moves.length ? " (모두 걸어서" : walks ? ` (${moves.length}번 중 ${walks}번은 걸어서` : " ("}${kinds.length ? `${walks ? ", " : ""}${kinds.join("·")}` : ""}).`.replace(" ()", ""));
  // 일찍 닫는 곳
  const tight = stops.find((s) => { const [, close] = hoursOf(s.place); return close && close !== "24:00" && toMin(close) - s.leave <= 30; });
  if (tight) out.push(`${name(tight)}${josa(tight.place.name, "은", "는")} ${hoursOf(tight.place)[1]}에 닫아서 그 전에 다녀오게 넣었어요.`);
  return out;
}

// 코스 공유: 폰이면 공유 창(카톡 등), 아니면 링크 복사
async function shareCourse() {
  const msg = document.getElementById("shareMsg");
  const url = location.href;
  if (state.from === "here") msg.textContent = "\"지금 내 위치\"는 링크에 담기지 않아요. 받는 사람은 출발 장소를 다시 골라야 해요.";
  try {
    if (navigator.share) { await navigator.share({ title: `${REGION.area} ${REGION.name} 여행 코스`, url }); return; }
    await navigator.clipboard.writeText(url);
    msg.textContent = (msg.textContent ? msg.textContent + " " : "") + "링크를 복사했어요. 카톡에 붙여 넣어 보내 보세요.";
  } catch (e) {
    if (e.name !== "AbortError") msg.textContent = `이 링크를 복사해 보내 주세요: ${url}`;
  }
}

// 코스 지도: OpenStreetMap 지도 위에 순서대로 번호를 찍고 잇는 선을 그려요 (선은 직선이라 실제 길과 달라요)
let leafletLoading = null;
function loadLeaflet() {
  leafletLoading ??= new Promise((ok, fail) => {
    const css = document.createElement("link");
    css.rel = "stylesheet"; css.href = "https://unpkg.com/leaflet@1.9.4/dist/leaflet.css";
    document.head.append(css);
    const js = document.createElement("script");
    js.src = "https://unpkg.com/leaflet@1.9.4/dist/leaflet.js";
    js.onload = ok; js.onerror = fail;
    document.head.append(js);
  });
  return leafletLoading;
}
async function drawMap(points, n) {
  const box = document.getElementById("map");
  try { await loadLeaflet(); } catch { box.hidden = true; return; }
  if (!document.body.contains(box)) return; // 그새 다른 화면으로 넘어갔어요
  const map = L.map(box, { scrollWheelZoom: false, attributionControl: true, dragging: !L.Browser.mobile }); // 폰에서는 지도 위를 밀어도 페이지가 내려가요 (두 손가락으로 확대)
  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 18, attribution: "© OpenStreetMap" }).addTo(map);
  // 출발한 곳으로 돌아오면 '출발·끝' 핀 하나로 합쳐요
  const loop = points.length > 2 && points[0] === points[points.length - 1];
  const ll = points.map((p) => [p.lat, p.lng]);
  L.polyline(ll, { color: getComputedStyle(document.documentElement).getPropertyValue("--accent").trim(), weight: 3, dashArray: "6 6" }).addTo(map);
  points.forEach((p, i) => {
    if (loop && i === points.length - 1) return;
    const label = i === 0 ? (loop ? "출발·끝" : "출발") : i <= n ? String(i) : "끝";
    L.marker([p.lat, p.lng], { icon: L.divIcon({ className: "pin", html: `<span>${label}</span>`, iconSize: [30, 30] }), alt: `${label} ${p.name}` })
      .addTo(map).bindTooltip(p.name);
  });
  map.fitBounds(ll, { padding: [24, 24] });
}

// 메모·출처: 휠체어·유모차 이용자에게 쓸모 있는 이야기(예: 모래사장 안쪽은 어려워요)가 메모에 많아요
const lastChecked = (p) => (p.note.match(/20\d\d-\d\d(-\d\d)?/g) ?? []).sort().pop();
function moreInfo(p) {
  const src = (p.sources ?? []).map((x) => /^https?:/.test(x)
    ? `<li><a href="${esc(x)}" target="_blank" rel="noopener">${esc(x.replace(/^https?:\/\/(www\.)?/, "").slice(0, 40))}</a></li>`
    : `<li>${esc(x)}</li>`).join("");
  const checked = lastChecked(p);
  return `<details class="more"><summary>메모·출처 보기${checked ? ` <span class="checked">· ${checked} 확인</span>` : ""}</summary>
    ${p.station ? `<p>가까운 정류장: ${esc(p.station)}</p>` : ""}<p>${esc(p.note)}</p>${src ? `<ul>${src}</ul>` : ""}</details>`;
}

// 버스 타는 법: "걸어서 1분 → 제주국제공항4에서 102번 → 애월고등학교에서 내려 걸어서 10분"
function busSteps(plan) {
  const c = plan.split("|");
  const walk = (m) => (Number(m) > 1 ? `걸어서 ${m}분` : "바로");
  if (c.length === 5) {
    const [no, from, w1, to, w2] = c;
    return `${walk(w1)} → ${esc(from)}에서 ${esc(no)}번 → ${esc(to)}에서 내려 ${walk(w2)}`;
  }
  const [no, from, w1, mid, no2, from2, to, w2] = c;
  return `${walk(w1)} → ${esc(from)}에서 ${esc(no)}번 → ${esc(mid)}에서 내려 ${esc(from2)}에서 ${esc(no2)}번 → ${esc(to)}에서 내려 ${walk(w2)}`;
}

function emptyMessage(why) {
  const wheelBus = state.who === "wheel" && state.how === "walk";
  const call = `행복콜(<a href="tel:18996884">1899-6884</a>) 휠체어 차량도 있어요.`;
  return {
    skip: `뺀 곳을 빼고 나니 코스를 짤 수 없어요. 위의 "다시 넣기"를 눌러 보세요.`,
    budget: `예산이 모자라요. ${state.how === "any" ? "택시비까지 넣으면 " : ""}1명 ${manwon(state.budget)}으로는 다녀올 수 있는 곳이 없어요. 예산을 늘리거나${state.how === "any" ? ", 이동을 뚜벅이로 바꾸거나" : ""} 끝나는 곳을 "상관없어요"로 바꿔 보세요.`,
    hours: wheelBus
      ? `저상버스와 걷기로는 ${state.hours}시간 안에 다녀올 수 있는 곳이 없어요. 시간을 늘리거나, 이동을 "상관없어요"(택시·차)로 바꿔 보세요. ${call}`
      : state.end === "airport"
      ? `${REGION.hub.ride} ${REGION.hub.bufferLabel} 전에 ${REGION.hub.place}에 도착하려면 ${state.hours}시간 중 ${state.hours * 60 - AIRPORT_BUFFER}분만 쓸 수 있어서, 다녀올 수 있는 곳이 없어요. 시간을 늘리거나 이동을 "렌터카"·"상관없어요"로 바꿔 보세요.`
      : `${state.hours}시간 안에 다녀올 수 있는 곳이 없어요. 시간을 늘리거나 끝나는 곳을 "상관없어요"로 바꿔 보세요.`,
    unknown: `아직 "${{ dog: "반려견 OK", kid: "유모차 OK", wheel: "계단 없음" }[state.who]}"이 확인된 장소가 부족해요. 장소 정보를 확인하면 코스가 나와요.`,
    other: `이 날짜·출발 시각에 문을 연 곳 중 조건에 맞는 곳이 없어요. 출발 시각이나 날짜를 바꿔 보세요.${wheelBus ? ` ${call}` : ""}`
  }[why];
}

function renderResult() {
  const { stops, spent, fares, back, finish, unknownSkipped, noLocation, count } = makeCourse();
  const moveLine = (m) => `<li class="move">${m.text} 약 ${m.min}분${m.fare ? ` · ${m.text === "택시로" ? "약 " : ""}${won(m.fare)}` : ""}${m.plan ? `<small class="sub-line">${busSteps(m.plan)}</small>` : ""}</li>`;
  const costUnknown = stops.filter((s) => s.place.cost === null).length;
  const who = WHO.find((w) => w.id === state.who), how = HOW.find((h) => h.id === state.how);
  const used = finish - toMin(state.depart);
  const left = toMin(state.depart) + state.hours * 60 - airportBuffer() - finish;
  const start = startPoint(), end = endPoint();

  const explain = stops.length ? explainCourse(stops, back) : [];
  // 반려견·유모차·휠체어는 전화 확인 안내가 중요해서 접지 않고 보여 줘요
  const caution = NEED[state.who] ? explain.shift() : null;
  const list = stops.map((s, i) => `
    ${moveLine(s.move)}
    <li class="stop">
      <div class="time"><span class="no" aria-hidden="true">${i + 1}</span>${toHHMM(s.begin)} – ${toHHMM(s.leave)}</div>
      <div class="name">${esc(s.place.name)}</div>
      ${s.place.desc ? `<div class="desc">${esc(s.place.desc)}</div>` : ""}
      <div class="meta">${s.place.type} · ${s.place.stayMin}분 · ${s.place.cost === null ? "비용 확인 필요" : won(s.place.cost)}${s.place.lastOrder && !s.place.hoursByDay ? ` · 마지막 주문 ${s.place.lastOrder}` : ""}</div>
      <div class="badges">${badgesFor(s)}</div>
      <div class="links">${mapLinks(s.place)}<button class="skip" data-id="${s.place.id}" aria-label="${esc(s.place.name)} 빼기">이곳 빼기</button></div>
      ${moreInfo(s.place)}
    </li>`).join("");

  screen.innerHTML = `
    <h1>이런 코스 어때요?</h1>
    <p class="sub">${em(who.emoji)} ${who.label} · ${em(how.emoji)} ${how.label}${state.how === "any" ? ` · ${state.people}명` : ""}</p>
    <p class="tags">${dateLabel(state.date)} · ${state.depart} 출발 · ${state.hours}시간 · 1명 ${manwon(state.budget)} · ${AREAS.find((a) => a.id === state.area).label}<br>${esc(start.name)}${end && end !== start ? ` → ${esc(end.name)}` : end ? " 출발·도착" : " 출발"} · ${em("🌅")} 일몰 ${toHHMM(sunsetMin(state.date))}</p>
    ${stops.length ? `
      <div class="summary">
        <div><b>${stops.length}곳</b><span>장소</span></div>
        <div><b>${Math.floor(used / 60)}시간 ${used % 60}분</b><span>걸리는 시간</span></div>
        <div><b>${spent.toLocaleString("ko-KR")}원${costUnknown ? "+" : ""}</b><span>1명 비용</span></div>
      </div>
      ${fares ? `<p class="fare-line">교통비 ${won(fares)} 포함${state.how === "any" && state.people > 1 ? ` (택시비는 ${state.people}명이 나눈 1명 몫)` : ""}</p>` : ""}
      ${left > 60 ? `<p class="left-time">시간이 ${Math.floor(left / 60) ? `${Math.floor(left / 60)}시간 ` : ""}${left % 60 ? `${left % 60}분 ` : ""}남아요. ${stops.length >= maxStops() ? `쉬엄쉬엄 다니도록 ${maxStops()}곳까지만 넣었어요. 마음에 드는 곳에서 더 머물러 보세요.` : `조건에 맞는 곳을 다 넣어서 일찍 끝나요. 시간을 줄이거나 "누구랑"·"어디 위주"를 바꿔 보세요.`}</p>` : ""}
      ${caution ? `<p class="caution">${caution}</p>` : ""}
      ${state.skip.length ? `<p class="skipped">뺀 곳: ${state.skip.map((id) => esc(PLACES.find((p) => p.id === id).name)).join(", ")} <button class="link" id="unskip">다시 넣기</button></p>` : ""}
      <div class="map" id="map" aria-label="코스 지도"></div>
      ${explain.length ? `<details class="why"><summary>이 코스는요</summary><ul>${explain.map((t) => `<li>${t}</li>`).join("")}</ul></details>` : ""}
      <ul class="timeline">
        <li class="endpoint">${em("📍")} ${state.depart} ${esc(start.name)}에서 출발</li>
        ${list}
        ${back ? moveLine(back) : ""}
        <li class="endpoint">${em("🏁")} ${toHHMM(finish)} ${end ? `${esc(end.name)} 도착` : "코스 끝"}${state.end === "airport" ? `<small class="sub-line">${REGION.hub.ride}는 ${toHHMM(toMin(state.depart) + state.hours * 60)}쯤으로 보고 ${REGION.hub.bufferLabel} 일찍 도착해요</small>` : ""}</li>
      </ul>` : `
      <div class="empty">${emptyMessage(whyEmpty())}</div>`}
    <details class="notes"><summary>참고할 점 (자료 기준일·출처)</summary>
      <p>• 장소 정보는 2026년 10월까지의 인터넷 자료로 모았고, 직접 가 보거나 전화로 확인한 건 아니에요. 장소마다 "메모·출처 보기"에 출처가 있어요. 가기 전에 운영시간은 한 번 더 확인해 주세요.</p>
      <p>• 이동 시간은 실제 길 기준이에요.${state.how !== "walk" ? " 막히는 길은 반영되지 않아요." : " 버스는 시간표의 평균 배차 간격으로 기다리는 시간까지 넣었어요(실시간 도착 정보는 아니에요)."}${state.how === "ev" ? " 충전 시간은 따로 넣지 않았어요. 충전소가 가까운 곳에서 오래 머물게 짰으니 그동안 충전해 두세요." : ""}${state.how === "car" || state.how === "ev" ? " 차로 다니는 시간에는 주차 5분을 넣었어요. 렌터카 요금·기름값(충전비)·주차비는 비용에 넣지 않았어요." : ""} ${state.from === "here" ? "내 위치에서 첫 장소까지는 직선거리로 어림했어요. " : ""}지도의 선은 순서만 보여 주는 직선이에요.
        (길 데이터 © OpenStreetMap · ${REGION.router ?? "openrouteservice.org"}${state.how === "walk" ? ` · 버스 국토교통부 TAGO · 제주버스정보시스템${state.who === "wheel" ? " · 제주특별자치도 저상버스 운행노선 현황" : ""}` : ""})</p>
      ${state.who === "wheel" && (state.how === "walk" || state.how === "any") ? `<p>• 걷는 시간은 보통보다 1.5배 넉넉히 잡았어요.${state.how === "walk" ? " 버스는 저상버스가 있는 노선만 넣었어요. 저상버스는 일부 차량만이라 기다리는 시간을 배차 간격만큼 잡았어요. 오는 버스가 저상버스인지는 그때그때 달라요." : ""} 휠체어를 쓰는 분은 제주 교통약자이동지원센터(행복콜, <a href="tel:18996884">1899-6884</a>, 24시간)의 휠체어 차량을 쓸 수 있어요. 미리 회원등록이 필요해요.</p>` : ""}
      ${state.how === "bike" ? `<p>• 자전거 대여료는 비용에 넣지 않았어요.</p>` : ""}
      ${fares ? `<p>• 교통비는 어른 1명 기준이에요. ${state.how === "walk" ? "버스는 교통카드 요금이고, 40분 안에 갈아타면 환승 할인으로 따로 내지 않아요. " : `택시비는 거리로 어림했고, ${state.people}명이 나눠 낸 1명 몫이에요(막힐 때 붙는 요금·밤 11시 이후 할증은 빠졌어요). 4명이 넘으면 택시가 2대 필요할 수 있어요. `}</p>` : ""}
      ${costUnknown ? `<p>• 비용을 모르는 곳 ${costUnknown}곳은 비용 합계에 들어가지 않았어요.</p>` : ""}
      ${unknownSkipped ? `<p>• ${{ dog: "반려견", kid: "유모차", wheel: "계단" }[state.who]} 정보가 없는 곳 ${unknownSkipped}곳은 안전하게 뺐어요. 꼭 가고 싶은 곳이 있으면 전화로 확인해 보세요.</p>` : ""}
      ${noLocation ? `<p>• 위치를 아직 모르는 곳 ${noLocation}곳은 코스에서 뺐어요.</p>` : ""}
    </details>
    <button class="${stops.length ? "ghost wide" : "primary"}" id="again">조건 바꾸기</button>
    ${stops.length ? `<div class="dock">
      <p class="share-msg" id="shareMsg" role="status"></p>
      <div class="actions">
        ${count > 1 ? `<button class="ghost" id="alt">${em("🔄")} 다른 코스 보기 (${(state.alt % count) + 1}/${count})</button>` : ""}
        <button class="ghost" id="share">${em("🔗")} 코스 공유하기</button>
      </div>
    </div>` : ""}`;
  document.getElementById("again").onclick = () => goStep(2);
  // 다시 그린 뒤 포커스를 같은 자리(다음 장소의 '이곳 빼기')나 제목으로 옮겨요
  const redo = (focusIndex = null) => {
    syncUrl(false); renderResult();
    const skips = screen.querySelectorAll(".skip");
    const target = focusIndex !== null && skips.length ? skips[Math.min(focusIndex, skips.length - 1)] : screen.querySelector("h1");
    if (target === screen.querySelector("h1")) { target.tabIndex = -1; window.scrollTo(0, 0); }
    target.focus();
  };
  screen.querySelectorAll(".skip").forEach((b, i) => { b.onclick = () => { state.skip.push(b.dataset.id); state.alt = 0; redo(i); }; });
  document.getElementById("unskip")?.addEventListener("click", () => { state.skip = []; state.alt = 0; redo(); });
  document.getElementById("alt")?.addEventListener("click", () => { state.alt = (state.alt + 1) % count; redo(); });
  document.getElementById("share")?.addEventListener("click", shareCourse);
  if (stops.length) drawMap([start, ...stops.map((s) => s.place), ...(end ? [end] : [])], stops.length);
}

// 처음 열 때: 주소에 담긴 조건을 읽어요. 공유 링크로 바로 결과가 열려도 기록은 하나만 둬요
// (카톡에서 연 사람이 뒤로가기 한 번에 카톡으로 돌아가요. 앞 단계는 '← 이전' 버튼으로)
document.getElementById("placeCount").textContent = PLACES.length;
document.getElementById("regionArea").textContent = REGION.area;
// 지역 바꾸기: 고른 조건은 그대로 두고 그 지역 자료로 다시 열어요 (없는 출발 장소·뺀 장소는 읽을 때 걸러져요)
const regionPick = document.getElementById("regionPick");
regionPick.innerHTML = [...new Set(REGIONS.map((r) => r.area))].map((a) => `<optgroup label="${esc(a)}">${REGIONS.filter((r) => r.area === a).map((r) => `<option value="${r.id}">${esc(r.name)}</option>`).join("")}</optgroup>`).join("");
regionPick.value = REGION.id;
regionPick.onchange = () => {
  const q = new URLSearchParams(queryOf());
  q.set("region", regionPick.value); q.delete("skip"); q.delete("alt");
  location.search = q.toString();
};
readQuery();
history.replaceState({ step: state.step, depth: 0 }, "", `${location.pathname}${queryOf() ? `?${queryOf()}` : ""}`);
render();
</script>
