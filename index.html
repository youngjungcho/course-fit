<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>내 조건 여행 코스</title>
<style>
  :root {
    --bg: #f6f4ef;
    --card: #ffffff;
    --text: #1f2421;
    --muted: #6b716d;
    --line: #e2ded5;
    --accent: #1f7a5a;
    --accent-soft: #e3f1ea;
    --warn: #9a5b00;
    --warn-soft: #fff1d6;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #161917;
      --card: #20241f;
      --text: #eceee9;
      --muted: #a2a8a3;
      --line: #343a35;
      --accent: #5fc79d;
      --accent-soft: #1d3329;
      --warn: #f2c26b;
      --warn-soft: #3a2d14;
    }
  }
  :root[data-theme="dark"] {
    --bg: #161917; --card: #20241f; --text: #eceee9; --muted: #a2a8a3;
    --line: #343a35; --accent: #5fc79d; --accent-soft: #1d3329;
    --warn: #f2c26b; --warn-soft: #3a2d14;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    font-size: 17px;
    line-height: 1.55;
    word-break: keep-all;
  }
  .wrap { max-width: 560px; margin: 0 auto; padding: 16px 16px 48px; }

  .sample-banner {
    background: var(--warn-soft); color: var(--warn);
    border-radius: 12px; padding: 10px 14px; font-size: 15px; margin-bottom: 16px;
  }
  .top { display: flex; align-items: center; gap: 12px; min-height: 44px; margin-bottom: 8px; }
  .back {
    border: 0; background: none; color: var(--muted); font-size: 16px;
    padding: 8px 4px; cursor: pointer;
  }
  .back[hidden] { display: none; }
  .progress { flex: 1; height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
  .progress > div { height: 100%; background: var(--accent); transition: width .25s; }

  h1 { font-size: 26px; line-height: 1.3; margin: 20px 0 6px; }
  .sub { color: var(--muted); margin: 0 0 20px; }

  .choices { display: grid; gap: 12px; }
  .choice {
    display: flex; align-items: center; gap: 14px; width: 100%;
    background: var(--card); color: var(--text);
    border: 2px solid var(--line); border-radius: 16px;
    padding: 16px 18px; font-size: 18px; text-align: left; cursor: pointer;
  }
  .choice .emoji { font-size: 28px; }
  .choice small { display: block; color: var(--muted); font-size: 15px; }
  .choice[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }

  .group { margin-bottom: 24px; }
  .group h2 { font-size: 18px; margin: 0 0 10px; }
  .chips { display: flex; flex-wrap: wrap; gap: 10px; }
  .chip {
    min-height: 48px; padding: 0 18px; border-radius: 24px;
    background: var(--card); color: var(--text);
    border: 2px solid var(--line); font-size: 17px; cursor: pointer;
  }
  .chip[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); font-weight: 600; }

  .geo { margin: -14px 0 24px; color: var(--muted); font-size: 15px; }
  .geo[hidden] { display: none; }

  .primary {
    width: 100%; min-height: 56px; border: 0; border-radius: 16px;
    background: var(--accent); color: #fff; font-size: 18px; font-weight: 700; cursor: pointer;
  }
  :root[data-theme="dark"] .primary { color: #10231b; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .primary { color: #10231b; } }
  .primary:disabled { opacity: .4; cursor: default; }

  .summary {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 0 0 20px;
  }
  .summary div { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px; text-align: center; }
  .summary b { display: block; font-size: 20px; }
  .summary span { color: var(--muted); font-size: 14px; }
  .tags { color: var(--muted); font-size: 15px; margin: -12px 0 16px; }

  .timeline { list-style: none; padding: 0; margin: 0 0 20px; }
  .move { color: var(--muted); font-size: 15px; padding: 6px 0 6px 18px; border-left: 2px dashed var(--line); margin-left: 8px; }
  .stop {
    background: var(--card); border: 1px solid var(--line); border-radius: 16px;
    padding: 14px 16px; margin: 4px 0;
  }
  .stop .time { color: var(--accent); font-weight: 700; font-size: 15px; }
  .stop .name { font-size: 19px; font-weight: 700; margin: 2px 0; }
  .stop .meta { color: var(--muted); font-size: 15px; }
  .badges { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .badge { font-size: 13px; padding: 3px 9px; border-radius: 10px; background: var(--accent-soft); color: var(--accent); }
  .badge.warn { background: var(--warn-soft); color: var(--warn); }
  .links { display: flex; gap: 8px; margin-top: 10px; }
  .links a {
    flex: 1; min-height: 40px; display: flex; align-items: center; justify-content: center;
    border: 1px solid var(--line); border-radius: 10px;
    color: var(--text); text-decoration: none; font-size: 15px;
  }
  .endpoint { font-weight: 600; padding: 6px 0; }
  .notes { color: var(--muted); font-size: 14px; margin-bottom: 20px; }
  .notes p { margin: 4px 0; }
  .empty { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 20px; margin-bottom: 20px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="sample-banner"><b>제주 애월</b> 장소로 만들고 있어요. 아직 직접 확인하지 않은 정보가 많아요.</div>

  <div class="top">
    <button class="back" id="back" hidden>← 이전</button>
    <div class="progress"><div id="bar"></div></div>
  </div>

  <main id="screen"></main>
</div>

<script src="places.js"></script>
<script>
// ----- 고를 수 있는 것들 -----
const WHO = [
  { id: "dog",    emoji: "🐶", label: "반려견이랑",        hint: "반려견이 들어갈 수 있는 곳만" },
  { id: "kid",    emoji: "👶", label: "아기랑 (유모차)",   hint: "유모차가 다닐 수 있는 곳만" },
  { id: "wheel",  emoji: "♿", label: "휠체어·어르신이랑", hint: "계단 없이 들어갈 수 있는 곳만" },
  { id: "solo",   emoji: "🙋", label: "혼자",              hint: "혼자 가기 좋은 곳을 먼저" }
];
const HOW = [
  { id: "walk", emoji: "🚶", label: "뚜벅이",   hint: "걷거나 버스·지하철" },
  { id: "bike", emoji: "🚲", label: "자전거",   hint: "자전거 세울 곳을 먼저" },
  { id: "ev",   emoji: "🔌", label: "전기차",   hint: "충전소까지 거리도 보여 드려요" },
  { id: "any",  emoji: "🤷", label: "상관없어요", hint: "가까우면 걷고, 멀면 택시·차로" }
];
const DEPART = ["09:00", "10:00", "11:00", "12:00", "13:00", "14:00", "15:00", "16:00", "17:00", "18:00"];
const HOURS = [3, 4, 6, 8];
const BUDGET = [30000, 50000, 100000, 150000];
const HERE = { id: "here", emoji: "📍", label: "지금 내 위치" };
const JEJU = { latMin: 33.1, latMax: 33.6, lngMin: 126.1, lngMax: 127.0 };
const AREAS = [
  { id: "mix",      label: "🤷 골고루" },
  { id: "sea",      label: "🌊 바닷가 위주" },
  { id: "mountain", label: "⛰️ 산 쪽 위주" }
];

const state = { step: 0, who: null, how: null, from: null, here: null, depart: null, hours: null, budget: null, area: "mix" };

const screen = document.getElementById("screen");
const bar = document.getElementById("bar");
const back = document.getElementById("back");
back.onclick = () => { state.step = Math.max(0, state.step - 1); render(); };

// ----- 작은 도우미 -----
const toMin = (hhmm) => { const [h, m] = hhmm.split(":").map(Number); return h * 60 + m; };
const toHHMM = (min) => `${String(Math.floor(min / 60)).padStart(2, "0")}:${String(min % 60).padStart(2, "0")}`;
const won = (n) => n === 0 ? "무료" : `${n.toLocaleString("ko-KR")}원`;
const manwon = (n) => `${n / 10000}만 원`;
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const DAYS = ["일", "월", "화", "수", "목", "금", "토"];
const today = DAYS[new Date().getDay()];

// ----- 화면 그리기 -----
function render() {
  bar.style.width = `${(state.step + 1) * 25}%`;
  back.hidden = state.step === 0;
  [renderWho, renderHow, renderWhen, renderResult][state.step]();
  window.scrollTo(0, 0);
}

function choiceList(items, key) {
  return `<div class="choices">${items.map((it) => `
    <button class="choice" data-id="${it.id}" aria-pressed="${state[key] === it.id}">
      <span class="emoji">${it.emoji}</span>
      <span>${it.label}<small>${it.hint}</small></span>
    </button>`).join("")}</div>`;
}

function bindChoices(key) {
  screen.querySelectorAll(".choice").forEach((btn) => {
    btn.onclick = () => { state[key] = btn.dataset.id; state.step++; render(); };
  });
}

function renderWho() {
  screen.innerHTML = `<h1>누구랑 가요?</h1><p class="sub">하나만 골라 주세요.</p>${choiceList(WHO, "who")}`;
  bindChoices("who");
}

function renderHow() {
  screen.innerHTML = `<h1>어떻게 다녀요?</h1><p class="sub">하나만 골라 주세요.</p>${choiceList(HOW, "how")}`;
  bindChoices("how");
}

function chipGroup(title, key, values, label) {
  return `<div class="group"><h2>${title}</h2><div class="chips">${values.map((v) =>
    `<button class="chip" data-key="${key}" data-v="${v}" aria-pressed="${state[key] === v}">${label(v)}</button>`
  ).join("")}</div></div>`;
}

const startPoint = () => state.from === "here" ? state.here : STARTS.find((s) => s.id === state.from);

function renderWhen() {
  const froms = [HERE, ...STARTS];
  screen.innerHTML = `
    <h1>출발이랑 예산은요?</h1>
    <p class="sub">네 가지를 골라 주세요. 마지막 칸은 그대로 둬도 돼요.</p>
    ${chipGroup("어디서 출발해요?", "from", froms.map((f) => f.id), (id) => { const f = froms.find((x) => x.id === id); return `${f.emoji} ${f.label}`; })}
    <p class="geo" id="geo" hidden></p>
    ${chipGroup("몇 시에 출발해요?", "depart", DEPART, (v) => v)}
    ${chipGroup("몇 시간 있어요?", "hours", HOURS, (v) => `${v}시간`)}
    ${chipGroup("1명 예산은요?", "budget", BUDGET, manwon)}
    ${chipGroup("어디 위주로 볼까요?", "area", AREAS.map((a) => a.id), (id) => AREAS.find((a) => a.id === id).label)}
    <button class="primary" id="go">코스 짜기</button>`;
  const go = document.getElementById("go");
  const geo = document.getElementById("geo");
  const say = (msg) => { geo.textContent = msg; geo.hidden = !msg; };
  const sync = () => { go.disabled = !(startPoint() && state.depart && state.hours && state.budget); };
  if (state.from === "here" && state.here) say("📍 지금 위치에서 출발해요.");

  // "지금 내 위치"는 휴대폰·브라우저에 위치를 물어봐요. 제주 밖이면 쓰지 않아요
  const askHere = () => {
    if (!navigator.geolocation) { say("이 브라우저는 위치를 알려 주지 않아요. 다른 출발 장소를 골라 주세요."); return; }
    say("위치를 확인하고 있어요…");
    navigator.geolocation.getCurrentPosition((pos) => {
      const { latitude: lat, longitude: lng } = pos.coords;
      const inJeju = lat >= JEJU.latMin && lat <= JEJU.latMax && lng >= JEJU.lngMin && lng <= JEJU.lngMax;
      state.here = inJeju ? { name: "내 위치", lat, lng } : null;
      say(inJeju ? "📍 지금 위치에서 출발해요." : "지금 제주가 아닌 곳에 있어요. 제주에 도착하면 써 주세요. 지금은 제주공항이나 애월을 골라 주세요.");
      sync();
    }, () => { state.here = null; say("위치를 알 수 없었어요. 위치 허용을 확인하거나 다른 출발 장소를 골라 주세요."); sync(); },
    { enableHighAccuracy: false, timeout: 10000 });
  };

  screen.querySelectorAll(".chip").forEach((chip) => {
    chip.onclick = () => {
      const key = chip.dataset.key;
      state[key] = (key === "depart" || key === "from" || key === "area") ? chip.dataset.v : Number(chip.dataset.v);
      screen.querySelectorAll(`.chip[data-key="${key}"]`).forEach((c) => c.setAttribute("aria-pressed", c === chip));
      if (key === "from") { if (chip.dataset.v === "here") askHere(); else say(""); }
      sync();
    };
  });
  go.onclick = () => { state.step++; render(); };
  sync();
}

// ----- 이동 시간 (지금은 직선거리로 대충 계산) -----
function distKm(a, b) {
  const R = 6371, rad = Math.PI / 180;
  const dLat = (b.lat - a.lat) * rad, dLng = (b.lng - a.lng) * rad;
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(a.lat * rad) * Math.cos(b.lat * rad) * Math.sin(dLng / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h)) * 1.3; // 길이 구불구불한 만큼 1.3배
}

function travel(a, b, how) {
  const km = distKm(a, b);
  let min, text;
  if (how === "walk") {
    if (km <= 1.2) { min = km / 4.5 * 60; text = "걸어서"; }
    else { min = 10 + km / 18 * 60; text = "버스·지하철로"; }
  } else if (how === "any") {
    if (km <= 1.2) { min = km / 4.5 * 60; text = "걸어서"; }
    else { min = 5 + km / 35 * 60; text = "택시·차로"; }
  } else if (how === "bike") { min = 3 + km / 12 * 60; text = "자전거로"; }
  else { min = 5 + km / 35 * 60; text = "차로"; }
  return { min: Math.max(3, Math.ceil(min)), text };
}

// ----- 코스 짜기 -----
const NEED = { dog: "dog", kid: "stroller", wheel: "stepFree" };

// 오늘 요일에 따로 정한 운영시간이 있으면 그걸 써요 (예: 주말엔 더 일찍 열어요)
const hoursOf = (p) => (p.hoursByDay && p.hoursByDay[today]) || [p.open, p.close];

// 해안선(COASTLINE)에서 남쪽으로 2.5km 넘게 떨어지면 산 쪽(중산간)
function isInland(p) {
  const [a, b] = COASTLINE;
  const coastLat = a.lat + (p.lng - a.lng) / (b.lng - a.lng) * (b.lat - a.lat);
  return (coastLat - p.lat) * 111 > 2.5;
}

// 한 번 코스 짜기: 지금 자리에서 갈 수 있는 곳 중 점수가 제일 높은 곳을 하나씩 이어 붙여요.
// first를 주면 첫 장소는 그곳으로 정해요.
function buildCourse(pool, first) {
  const startMin = toMin(state.depart);
  const endMin = startMin + state.hours * 60;
  const maxCafes = state.hours <= 4 ? 1 : 2;
  const stops = [];
  let here = startPoint(), now = startMin, spent = 0, lastType = null, lastMeal = -999, cafes = 0;

  while (true) {
    let best = null;
    for (const p of (stops.length === 0 && first ? [first] : pool)) {
      if (stops.some((s) => s.place === p)) continue;
      if (p.closedDays && p.closedDays.includes(today)) continue;
      if (spent + (p.cost ?? 0) > state.budget) continue;
      // 카페·식당은 연달아 넣지 않고, 카페는 4시간 이하면 1곳·그보다 길면 2곳까지
      if (p.type === lastType && (p.type === "카페" || p.type === "식당")) continue;
      if (p.type === "카페" && cafes >= maxCafes) continue;

      const [open, close] = hoursOf(p);
      const mv = travel(here, p, state.how);
      let begin = now + mv.min;
      // 문 열기 전이나 쉬는 시간이면 30분까지는 기다리고, 더 길면 다음 후보로
      const waitUntil = (min) => { if (min - begin > 30) return false; begin = min; return true; };
      if (open && begin < toMin(open) && !waitUntil(toMin(open))) continue;
      const hitBreak = (p.breaks ?? []).find(([from, to]) => begin < toMin(to) && begin + p.stayMin > toMin(from));
      if (hitBreak && !waitUntil(toMin(hitBreak[1]))) continue;
      const leave = begin + p.stayMin;
      if (leave > endMin) continue;
      if (close && leave > toMin(close)) continue;

      let score = -(begin - now);
      // 식당은 밥때(아침 7~9:30, 점심 11~14시, 저녁 17~20시)에만, 앞 식사에서 3시간이 지나야 넣어요
      const mealTime = (begin >= 420 && begin <= 570) || (begin >= 660 && begin <= 840) || (begin >= 1020 && begin <= 1200);
      if (p.type === "식당" && (!mealTime || begin - lastMeal < 180)) continue;
      if (p.type === "식당") score += 60;
      if (p.type === lastType) score -= 25;
      if (state.who === "solo" && p.solo) score += 10;
      if (state.how === "bike" && p.bikeRack) score += 10;
      if (state.how === "ev" && p.parking) score += 10;
      // 바닷가·산 쪽 위주를 골랐으면 그쪽 장소를 먼저 (식당은 산 쪽에 적어서 조금만)
      if (state.area !== "mix") score += (isInland(p) === (state.area === "mountain") ? 1 : -1) * (p.type === "식당" ? 15 : 40);

      if (!best || score > best.score) best = { place: p, move: mv, begin, leave, score };
    }
    if (!best) break;
    stops.push(best);
    here = best.place; now = best.leave; spent += best.place.cost ?? 0; lastType = best.place.type;
    if (best.place.type === "식당") lastMeal = best.begin;
    if (best.place.type === "카페") cafes++;
  }
  return { stops, spent, finish: now };
}

// 코스 좋은 정도: 장소에서 즐기는 시간이 길수록, 이동이 짧을수록, 식사가 들어갈수록 좋아요 (오래 머무는 곳도 공평하게)
function courseScore(c) {
  if (c.stops.length === 0) return -Infinity;
  const moving = c.stops.reduce((sum, s) => sum + s.move.min, 0);
  const meal = c.stops.some((s) => s.place.type === "식당") ? 30 : 0;
  const inland = c.stops.filter((s) => isInland(s.place)).length;
  // 골고루: 바닷가와 산 쪽이 둘 다 있으면 좋아요 / 한쪽 위주: 그쪽 장소가 많을수록 좋아요
  const area = state.area === "mix" ? (inland > 0 && inland < c.stops.length ? 40 : 0)
    : 30 * (state.area === "mountain" ? inland : c.stops.length - inland);
  const staying = c.stops.reduce((sum, s) => sum + s.place.stayMin, 0);
  return staying + c.stops.length * 10 - moving + meal + area;
}

function makeCourse() {
  const need = NEED[state.who];
  let unknownSkipped = 0, noLocation = 0;
  const pool = PLACES.filter((p) => {
    if (p.lat === null) { noLocation++; return false; }
    if (!need) return true;
    if (p[need] === null) unknownSkipped++;
    return p[need] === true;
  });

  // 첫 장소를 하나씩 바꿔 가며 여러 코스를 짜 보고, 제일 좋은 걸 골라요 (왔다 갔다를 줄여요)
  let best = buildCourse(pool, null);
  for (const p of pool) {
    const c = buildCourse(pool, p);
    if (courseScore(c) > courseScore(best)) best = c;
  }
  return { ...best, unknownSkipped, noLocation };
}

// 지도 바로가기: 카카오맵은 장소 번호로, 네이버지도는 이름 검색으로 열어요
function mapLinks(p) {
  const kakao = p.kakaoId ? `https://place.map.kakao.com/${p.kakaoId}` : `https://map.kakao.com/?q=${encodeURIComponent(p.name)}`;
  const naver = `https://map.naver.com/p/search/${encodeURIComponent(`${p.name} 애월`)}`;
  return `<a href="${kakao}" target="_blank" rel="noopener">카카오맵</a><a href="${naver}" target="_blank" rel="noopener">네이버지도</a>`;
}

function badgesFor(p) {
  const out = [];
  const yesNo = (v, ok, label) => {
    if (v === true) out.push(`<span class="badge">${ok}</span>`);
    else if (v === null) out.push(`<span class="badge warn">${label}</span>`);
  };
  if (state.who === "dog") yesNo(p.dog, "반려견 OK", "반려견 정보 없음");
  if (state.who === "kid") yesNo(p.stroller, "유모차 OK", "유모차 정보 없음");
  if (state.who === "wheel") yesNo(p.stepFree, "계단 없음", "계단 정보 없음");
  if (state.who === "solo") yesNo(p.solo, "혼자 좋아요", "혼자 확인 필요");
  if (state.how === "bike") yesNo(p.bikeRack, "자전거 거치대", "자전거 거치대 확인 필요");
  if (state.how === "ev") {
    yesNo(p.parking, "주차 가능", "주차 확인 필요");
    out.push(p.evChargerMin === null
      ? `<span class="badge warn">충전소 거리 확인 필요</span>`
      : `<span class="badge">충전소 걸어서 ${p.evChargerMin}분</span>`);
  }
  if (p.closedDays === null) out.push(`<span class="badge warn">쉬는 날 확인 필요</span>`);
  if (p.open === null) out.push(`<span class="badge warn">운영시간 확인 필요</span>`);
  return out.join("");
}

function renderResult() {
  const { stops, spent, finish, unknownSkipped, noLocation } = makeCourse();
  const costUnknown = stops.filter((s) => s.place.cost === null).length;
  const who = WHO.find((w) => w.id === state.who), how = HOW.find((h) => h.id === state.how);
  const used = finish - toMin(state.depart);
  const start = startPoint();

  const list = stops.map((s) => `
    <li class="move">${s.move.text} 약 ${s.move.min}분</li>
    <li class="stop">
      <div class="time">${toHHMM(s.begin)} – ${toHHMM(s.leave)}</div>
      <div class="name">${esc(s.place.name)}</div>
      <div class="meta">${s.place.type} · ${s.place.stayMin}분 · ${s.place.cost === null ? "비용 확인 필요" : won(s.place.cost)}${s.place.station ? ` · ${esc(s.place.station)}` : ""}</div>
      <div class="badges">${badgesFor(s.place)}</div>
      <div class="links">${mapLinks(s.place)}</div>
    </li>`).join("");

  screen.innerHTML = `
    <h1>이런 코스 어때요?</h1>
    <p class="sub">${who.emoji} ${who.label} · ${how.emoji} ${how.label}</p>
    <p class="tags">${esc(start.name)}에서 ${state.depart} 출발 · ${state.hours}시간 · 1명 ${manwon(state.budget)} · ${AREAS.find((a) => a.id === state.area).label} · 오늘(${today}) 기준</p>
    ${stops.length ? `
      <div class="summary">
        <div><b>${stops.length}곳</b><span>장소</span></div>
        <div><b>${Math.floor(used / 60)}시간 ${used % 60}분</b><span>걸리는 시간</span></div>
        <div><b>${spent.toLocaleString("ko-KR")}원${costUnknown ? "+" : ""}</b><span>1명 비용</span></div>
      </div>
      <ul class="timeline">
        <li class="endpoint">📍 ${state.depart} ${esc(start.name)}에서 출발</li>
        ${list}
        <li class="endpoint">🏁 ${toHHMM(finish)} 코스 끝</li>
      </ul>` : `
      <div class="empty">${unknownSkipped
        ? `아직 "${{ dog: "반려견 OK", kid: "유모차 OK", wheel: "계단 없음" }[state.who]}"이 확인된 장소가 부족해요. 장소 정보를 확인하면 코스가 나와요.`
        : "조건에 맞는 곳을 찾지 못했어요. 도착 시각이나 시간, 예산을 바꿔 보세요."}</div>`}
    <div class="notes">
      <p>• 이동 시간은 직선거리로 대충 계산했어요. 실제와 다를 수 있어요.</p>
      ${costUnknown ? `<p>• 비용을 모르는 곳 ${costUnknown}곳은 비용 합계에 들어가지 않았어요.</p>` : ""}
      ${unknownSkipped ? `<p>• ${{ dog: "반려견", kid: "유모차", wheel: "계단" }[state.who]} 정보가 없는 곳 ${unknownSkipped}곳은 안전하게 뺐어요. 꼭 가고 싶은 곳이 있으면 전화로 확인해 보세요.</p>` : ""}
      ${noLocation ? `<p>• 위치를 아직 모르는 곳 ${noLocation}곳은 코스에서 뺐어요.</p>` : ""}
    </div>
    <button class="primary" id="again">조건 바꾸기</button>`;
  document.getElementById("again").onclick = () => { state.step = 0; render(); };
}

render();
</script>
</body>
</html>
